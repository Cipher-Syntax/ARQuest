<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape"
        />
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #000000;
            }
            #canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #00e5ff;
                font-weight: bold;
                font-family: system-ui;
                letter-spacing: 2px;
            }
            #joystick-zone {
                position: absolute;
                bottom: 20px;
                left: 20px;
                width: 120px;
                height: 120px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                border: 2px solid rgba(0, 229, 255, 0.3);
                pointer-events: none;
            }
            #instructions {
                position: absolute;
                bottom: 20px;
                right: 20px;
                text-align: right;
                color: rgba(255, 255, 255, 0.7);
                font-family: system-ui;
                font-size: 12px;
                pointer-events: none;
            }
            #ghost-btn {
                position: absolute;
                top: 80px;
                right: 20px;
                background: rgba(0, 229, 255, 0.2);
                color: #00e5ff;
                border: 1px solid #00e5ff;
                padding: 8px 12px;
                border-radius: 8px;
                font-family: system-ui;
                font-weight: bold;
                z-index: 100;
                display: none;
            }
            #camera-zone {
                position: absolute;
                top: 0;
                right: 0;
                width: 50%;
                height: 100%;
                z-index: 10;
            }
            #crosshair {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 6px;
                height: 6px;
                background: rgba(255, 255, 255, 0.8);
                border-radius: 50%;
                transform: translate(-50%, -50%);
                z-index: 50;
                pointer-events: none;
            }
            #info-panel {
                position: absolute;
                background: rgba(0, 0, 0, 0.85);
                border: 2px solid #00e5ff;
                color: white;
                padding: 15px;
                border-radius: 12px;
                width: 220px;
                text-align: center;
                font-family: system-ui;
                z-index: 200;
                display: none;
                pointer-events: auto;
                transform: translate(-50%, -100%);
                margin-top: -15px; /* Spacing above head */
                box-shadow: 0 10px 30px rgba(0, 229, 255, 0.2);
            }
            #info-panel::after {
                content: '';
                position: absolute;
                bottom: -10px;
                left: 50%;
                transform: translateX(-50%);
                border-width: 10px 10px 0;
                border-style: solid;
                border-color: #00e5ff transparent transparent transparent;
                display: block;
                width: 0;
            }
            #info-panel h2 {
                margin-top: 0;
                color: #00e5ff;
            }
            #info-close {
                margin-top: 15px;
                padding: 10px 20px;
                background: #00e5ff;
                color: black;
                font-weight: bold;
                border: none;
                border-radius: 6px;
                width: 100%;
            }
            /* ── NPC nameplate (game-style) ─────────────────────────────── */
            .floating-label {
                position: absolute;
                background: linear-gradient(
                    180deg,
                    rgba(17, 24, 39, 0.94),
                    rgba(8, 12, 20, 0.96)
                );
                color: #ffffff;
                font-weight: 700;
                padding: 5px 11px 6px;
                border-radius: 8px;
                font-family: system-ui, -apple-system, sans-serif;
                font-size: 12.5px;
                letter-spacing: 0.2px;
                line-height: 1.2;
                pointer-events: none;
                transform: translate(-50%, -100%);
                opacity: 0;
                white-space: nowrap;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
                transition: opacity 0.2s;
                text-align: center;
                border: 1px solid rgba(250, 204, 21, 0.45);
                border-left: 3px solid #facc15;
                z-index: 150;
                will-change: opacity, transform;
            }
            .floating-label .npc-dot {
                display: inline-block;
                width: 5px;
                height: 5px;
                margin-right: 5px;
                border-radius: 50%;
                background: #facc15;
                box-shadow: 0 0 5px rgba(250, 204, 21, 0.9);
                vertical-align: middle;
            }
            .floating-label::after {
                content: '';
                position: absolute;
                bottom: -5px;
                left: 50%;
                transform: translateX(-50%);
                border-width: 5px 5px 0;
                border-style: solid;
                border-color: rgba(8, 12, 20, 0.96) transparent transparent transparent;
                display: block;
                width: 0;
            }
            .floating-label.restricted {
                border-color: rgba(239, 68, 68, 0.5);
                border-left-color: #ef4444;
            }
            .floating-label.restricted .npc-dot {
                background: #ef4444;
                box-shadow: 0 0 5px rgba(239, 68, 68, 0.95);
            }
            .floating-label.restricted::after {
                border-color: rgba(8, 12, 20, 0.96) transparent transparent transparent;
            }

            /* ── NPC speech bubble (description, only when you are close) ── */
            .npc-bubble {
                position: absolute;
                left: 0;
                top: 0;
                max-width: 230px;
                white-space: normal;
                overflow-wrap: anywhere;
                text-align: left;
                background: linear-gradient(180deg, #fffdf5, #fdf6e3);
                color: #1f2937;
                font-family: system-ui, -apple-system, sans-serif;
                font-size: 12px;
                font-weight: 500;
                line-height: 1.35;
                padding: 8px 12px 9px;
                border-radius: 11px;
                border: 1px solid rgba(31, 41, 55, 0.14);
                box-shadow:
                    0 8px 22px rgba(0, 0, 0, 0.38),
                    inset 0 1px 0 rgba(255, 255, 255, 0.9);
                pointer-events: none;
                z-index: 151;
                /* Sits above the nameplate and pops in from its tail. */
                transform: translate(-50%, -100%) translateY(-40px) scale(0.82);
                transform-origin: 50% 100%;
                opacity: 0;
                transition:
                    opacity 0.16s ease-out,
                    transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.45);
                will-change: opacity, transform;
            }
            .npc-bubble.show {
                opacity: 1;
                transform: translate(-50%, -100%) translateY(-40px) scale(1);
            }
            /* Tail pointing down at the NPC */
            .npc-bubble::after {
                content: '';
                position: absolute;
                top: 100%;
                left: 50%;
                margin-left: -6px;
                border-width: 6px;
                border-style: solid;
                border-color: #fdf6e3 transparent transparent transparent;
                filter: drop-shadow(0 1px 0 rgba(31, 41, 55, 0.14));
            }
            .npc-bubble.restricted {
                background: linear-gradient(180deg, #fff5f5, #fee2e2);
                border-color: rgba(185, 28, 28, 0.25);
                color: #450a0a;
            }
            .npc-bubble.restricted::after {
                border-color: #fee2e2 transparent transparent transparent;
            }
            .floating-label.portal-label {
                background: rgba(7, 42, 48, 0.92);
                color: #00e5ff;
                border: 1.5px solid #00e5ff;
                box-shadow: 0 0 14px rgba(0, 229, 255, 0.45);
                letter-spacing: 0.5px;
            }
            .floating-label.portal-label::after {
                border-color: #00e5ff transparent transparent transparent;
            }
            /* ── Spawn Fade-In Overlay ─────────────────────────────── */
            #spawn-fade {
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 0;
                background: #000;
                opacity: 1;
                pointer-events: none;
                z-index: 300;
                transition: opacity 0.7s ease-out;
            }
            #spawn-fade.faded {
                opacity: 0;
            }

            /* ── Gyroscope mode indicator pill ─────────────────────── */

            #gyro-indicator {
                position: absolute;
                top: 16px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(46, 204, 113, 0.15);
                border: 1px solid rgba(46, 204, 113, 0.6);
                color: #2ecc71;
                font-family: system-ui;
                font-size: 11px;
                font-weight: bold;
                letter-spacing: 2px;
                padding: 5px 14px;
                border-radius: 20px;
                z-index: 200;
                display: none;
                pointer-events: none;
                white-space: nowrap;
            }

            /* ── Gyroscope permission banner (iOS 13+ needs user gesture) ── */
            #gyro-permission-banner {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.92);
                border: 2px solid #2ecc71;
                color: white;
                padding: 24px 20px;
                border-radius: 14px;
                width: 280px;
                text-align: center;
                font-family: system-ui;
                z-index: 500;
                display: none;
            }
            #gyro-permission-banner h3 {
                margin: 0 0 10px;
                color: #2ecc71;
                font-size: 15px;
                letter-spacing: 1px;
            }
            #gyro-permission-banner p {
                margin: 0 0 16px;
                color: rgba(255, 255, 255, 0.75);
                font-size: 13px;
                line-height: 1.5;
            }
            #gyro-allow-btn {
                width: 100%;
                padding: 12px;
                background: #2ecc71;
                color: black;
                font-weight: bold;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                cursor: pointer;
            }
        </style>
        <!-- Include nipplejs for Joystick -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    </head>
    <body>
        <div id="loading">INITIALIZING...</div>
        <div id="instructions">
            Drag right side to look<br />Use joystick to move
        </div>
        <div id="joystick-zone"></div>
        <div id="camera-zone"></div>
        <button id="ghost-btn" onclick="toggleGhostMode()">PHYSICS: ON</button>
        <div id="crosshair"></div>

        <!-- Gyroscope mode indicator -->
        <div id="gyro-indicator">⬡ GYROSCOPE ACTIVE</div>

        <!-- Gyroscope permission banner (iOS 13+ DeviceOrientationEvent.requestPermission) -->
        <div id="gyro-permission-banner">
            <h3>GYROSCOPE ACCESS</h3>
            <p>
                This mode uses your phone's built-in gyroscope to look around.
                Please allow sensor access.
            </p>
            <button id="gyro-allow-btn" onclick="requestGyroPermission()">
                ALLOW GYROSCOPE
            </button>
        </div>

        <!-- Info panel is kept for backwards compatibility or clicks, but we'll use floating-labels for hover -->
        <div id="info-panel">
            <h2 id="info-title">Title</h2>
            <p id="info-desc">Description</p>
            <button id="info-close" onclick="closeInfoPanel()">CLOSE</button>
        </div>
        
        <div id="floating-labels"></div>

        <!-- Spawn fade-in overlay: covers scene during spawn, fades out once positioned -->
        <div id="spawn-fade"></div>

        <canvas id="canvas"></canvas>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
                }
            }
        </script>
        <script type="module">
            import * as THREE from "three";
            import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
            import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
            import { OrbitControls } from "three/addons/controls/OrbitControls.js";

            let scene, camera, renderer, controls, model, animFrameId;
            let moveForward = 0;
            let moveRight = 0;
            let joystickManager;
            let ghostMode = false;
            let chunkCollector = {
                totalChunks: 0,
                chunks: [],
                receivedCount: 0,
                fallbackUrl: null,
            };
            let MOVE_SPEED = 0.18;
            const COLLISION_DISTANCE = 0.38;
            const floorRaycaster = new THREE.Raycaster();
            floorRaycaster.far = 4.0;
            const wallRaycaster = new THREE.Raycaster();
            wallRaycaster.far = 1.0;
            const downVector = new THREE.Vector3(0, -1, 0);
            let worldBounds;

            let hotspots = [];
            let portalBadges = [];
            let lastCamBroadcastTime = 0;
            const tapRaycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            // ── Chibi NPC kit ──────────────────────────────────────────────
            // Every hotspot reuses the same materials and geometries, so a
            // room full of characters only pays for them once.
            const NPC_COLORS = {
                skin: 0xf2c9a3,
                hair: 0x241a14,
                shirt: 0x8a1538, // WMSU Crimson
                trim: 0x5f0c24,
                pants: 0x232b3a,
                shoe: 0x11161f,
                badge: 0xfacc15,
                danger: 0xef4444,
            };

            // Chibi proportions: ~2.3 heads tall, oversized head, stubby
            // limbs, big eyes. Total height ≈ 1.5m.
            const NPC_HEAD_R = 0.32;
            const NPC_HEAD_Y = 1.06;
            const NPC_GEM_Y = 1.6;
            const NPC_LABEL_HEIGHT = 1.82;
            // Arms rest angled out from the round body, otherwise the sleeves
            // disappear inside the belly.
            const NPC_ARM_REST = 0.34;

            const escapeHtml = (value) =>
                String(value).replace(
                    /[&<>"']/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;",
                        })[c],
                );

            let npcShadowTexture = null;
            function getNpcShadowTexture() {
                if (npcShadowTexture) return npcShadowTexture;
                const size = 128;
                const canvas = document.createElement("canvas");
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext("2d");
                const grad = ctx.createRadialGradient(
                    size / 2,
                    size / 2,
                    4,
                    size / 2,
                    size / 2,
                    size / 2,
                );
                grad.addColorStop(0, "rgba(0, 0, 0, 0.55)");
                grad.addColorStop(0.55, "rgba(0, 0, 0, 0.26)");
                grad.addColorStop(1, "rgba(0, 0, 0, 0)");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, size, size);
                npcShadowTexture = new THREE.CanvasTexture(canvas);
                return npcShadowTexture;
            }

            let npcKit = null;
            function getNpcKit() {
                if (npcKit) return npcKit;

                const std = (color, extra = {}) =>
                    new THREE.MeshStandardMaterial({
                        color,
                        roughness: 0.85,
                        metalness: 0,
                        ...extra,
                    });

                const mat = {
                    skin: std(NPC_COLORS.skin, { roughness: 0.85 }),
                    hair: std(NPC_COLORS.hair, { roughness: 0.92 }),
                    shirt: std(NPC_COLORS.shirt, {
                        roughness: 0.72,
                        metalness: 0.03,
                    }),
                    trim: std(NPC_COLORS.trim, { roughness: 0.78 }),
                    pants: std(NPC_COLORS.pants, { roughness: 0.92 }),
                    shoe: std(NPC_COLORS.shoe, { roughness: 0.6 }),
                    eye: std(0x1b121a, { roughness: 0.28, metalness: 0.05 }),
                    glint: std(0xffffff, { roughness: 0.15 }),
                    blush: std(0xff9aa8, {
                        roughness: 1,
                        transparent: true,
                        opacity: 0.85,
                    }),
                    mouth: std(0x3a1d22, { roughness: 0.6 }),
                    badge: std(NPC_COLORS.badge, {
                        emissive: NPC_COLORS.badge,
                        emissiveIntensity: 0.4,
                        roughness: 0.35,
                        metalness: 0.25,
                    }),
                };

                // Segment counts are kept low — this runs on phones.
                const geom = {
                    belly: new THREE.SphereGeometry(0.25, 20, 14),
                    collar: new THREE.CylinderGeometry(0.13, 0.15, 0.05, 14),
                    crest: new THREE.CylinderGeometry(0.032, 0.032, 0.012, 10),
                    leg: new THREE.CylinderGeometry(0.078, 0.072, 0.26, 10),
                    shoe: new THREE.BoxGeometry(0.16, 0.09, 0.26),
                    toe: new THREE.SphereGeometry(0.08, 10, 7),
                    upperArm: new THREE.CylinderGeometry(0.065, 0.06, 0.13, 8),
                    foreArm: new THREE.CylinderGeometry(0.06, 0.055, 0.12, 8),
                    hand: new THREE.SphereGeometry(0.078, 10, 8),
                    skull: new THREE.SphereGeometry(NPC_HEAD_R, 22, 16),
                    hair: new THREE.SphereGeometry(
                        NPC_HEAD_R + 0.008,
                        20,
                        14,
                        0,
                        Math.PI * 2,
                        0,
                        Math.PI * 0.42,
                    ),
                    tuft: new THREE.ConeGeometry(0.032, 0.15, 6),
                    iris: new THREE.SphereGeometry(0.07, 14, 12),
                    glint: new THREE.SphereGeometry(0.024, 8, 6),
                    blush: new THREE.SphereGeometry(0.048, 10, 8),
                    brow: new THREE.BoxGeometry(0.055, 0.017, 0.014),
                };

                npcKit = { mat, geom };
                return npcKit;
            }

            function buildNPCAvatar(isRestricted) {
                const { mat, geom } = getNpcKit();
                const body = new THREE.Group();

                // ── Rounded little body ──
                const torso = new THREE.Group();

                const belly = new THREE.Mesh(geom.belly, mat.shirt);
                belly.position.y = 0.585;
                belly.scale.set(1, 1.0, 0.9);
                torso.add(belly);

                const collar = new THREE.Mesh(geom.collar, mat.trim);
                collar.position.y = 0.79;
                torso.add(collar);

                const crest = new THREE.Mesh(geom.crest, mat.badge);
                crest.rotation.x = Math.PI / 2;
                crest.position.set(0.085, 0.64, 0.218);
                torso.add(crest);
                body.add(torso);

                // ── Stubby legs + chunky shoes ──
                [-1, 1].forEach((side) => {
                    const x = side * 0.1;

                    const leg = new THREE.Mesh(geom.leg, mat.pants);
                    leg.position.set(x, 0.23, 0);
                    body.add(leg);

                    const shoe = new THREE.Mesh(geom.shoe, mat.shoe);
                    shoe.position.set(x, 0.045, 0.03);
                    body.add(shoe);

                    const toe = new THREE.Mesh(geom.toe, mat.shoe);
                    toe.position.set(x, 0.055, 0.14);
                    toe.scale.set(1, 0.75, 0.7);
                    body.add(toe);
                });

                // ── Short arms with mitten hands ──
                const makeArm = (side) => {
                    const shoulder = new THREE.Group();
                    shoulder.position.set(side * 0.225, 0.7, 0);
                    shoulder.rotation.order = "ZXY";
                    shoulder.rotation.z = side * NPC_ARM_REST;

                    const upper = new THREE.Mesh(geom.upperArm, mat.shirt);
                    upper.position.y = -0.065;
                    shoulder.add(upper);

                    const elbow = new THREE.Group();
                    elbow.position.y = -0.13;

                    const fore = new THREE.Mesh(geom.foreArm, mat.shirt);
                    fore.position.y = -0.06;
                    elbow.add(fore);

                    const hand = new THREE.Mesh(geom.hand, mat.skin);
                    hand.position.y = -0.155;
                    hand.scale.set(1, 0.95, 0.95);
                    elbow.add(hand);

                    shoulder.add(elbow);
                    body.add(shoulder);
                    return { shoulder, elbow };
                };

                const leftArm = makeArm(1);
                const rightArm = makeArm(-1);

                // ── Oversized head ──
                const head = new THREE.Group();
                head.position.y = NPC_HEAD_Y;

                const skull = new THREE.Mesh(geom.skull, mat.skin);
                head.add(skull);

                // Hair: deep at the back, lifted at the front (fringe).
                const hair = new THREE.Mesh(geom.hair, mat.hair);
                hair.rotation.x = -0.35;
                head.add(hair);

                // Cowlick tuft
                const tuft = new THREE.Mesh(geom.tuft, mat.hair);
                tuft.position.set(0.035, NPC_HEAD_R + 0.03, 0.02);
                tuft.rotation.z = -0.55;
                tuft.rotation.x = -0.18;
                head.add(tuft);

                // Face parts are placed *on* the skull surface and yawed along
                // its normal, so the flat discs hug the curvature instead of
                // floating off it or sinking inside.
                const placeOnHead = (obj, yaw, y) => {
                    const ring = Math.sqrt(
                        Math.max(0.0001, NPC_HEAD_R * NPC_HEAD_R - y * y),
                    );
                    obj.position.set(
                        Math.sin(yaw) * ring,
                        y,
                        Math.cos(yaw) * ring,
                    );
                    obj.rotation.y = yaw;
                    return obj;
                };

                // Big chibi eyes: dark oval + white glint
                const eyes = [];
                [-1, 1].forEach((side) => {
                    const eye = new THREE.Group();
                    placeOnHead(eye, side * 0.38, 0.02);

                    const iris = new THREE.Mesh(geom.iris, mat.eye);
                    iris.scale.set(1, 1.2, 0.45);
                    eye.add(iris);

                    const glint = new THREE.Mesh(geom.glint, mat.glint);
                    // Same corner of both eyes = a single light source.
                    glint.position.set(-0.02, 0.04, 0.019);
                    eye.add(glint);

                    head.add(eye);
                    eyes.push(eye);
                });

                // Blush
                [-1, 1].forEach((side) => {
                    const blush = new THREE.Mesh(geom.blush, mat.blush);
                    placeOnHead(blush, side * 0.76, -0.09);
                    blush.scale.set(1, 0.62, 0.3);
                    head.add(blush);
                });

                // Brows
                [-1, 1].forEach((side) => {
                    const brow = new THREE.Mesh(geom.brow, mat.hair);
                    placeOnHead(brow, side * 0.33, 0.135);
                    // Angled inwards for the "restricted" glare.
                    brow.rotation.z = side * (isRestricted ? 0.42 : 0.08);
                    head.add(brow);
                });

                // Tiny mouth, projected onto the skull curve.
                const mouthPoints = [];
                const mouthHalfWidth = 0.038;
                const mouthAmp = 0.017;
                const mouthCenterY = -0.098;
                for (let i = 0; i <= 10; i++) {
                    const tt = i / 10;
                    const mx = (tt - 0.5) * 2 * mouthHalfWidth;
                    const my =
                        mouthCenterY +
                        (isRestricted ? -1 : 1) *
                            mouthAmp *
                            Math.pow(2 * tt - 1, 2);
                    const mz =
                        Math.sqrt(
                            Math.max(
                                0.0001,
                                NPC_HEAD_R * NPC_HEAD_R - mx * mx - my * my,
                            ),
                        ) + 0.004;
                    mouthPoints.push(new THREE.Vector3(mx, my, mz));
                }
                const mouth = new THREE.Mesh(
                    new THREE.TubeGeometry(
                        new THREE.CatmullRomCurve3(mouthPoints),
                        12,
                        0.012,
                        5,
                        false,
                    ),
                    mat.mouth,
                );
                head.add(mouth);

                body.add(head);

                return {
                    body,
                    parts: {
                        body,
                        torso,
                        head,
                        eyes,
                        leftArm,
                        rightArm,
                        headBaseY: NPC_HEAD_Y,
                    },
                };
            }

            // Teleportation state
            let teleportTarget = null;
            let teleportProgress = 0;
            let teleportStartPos = new THREE.Vector3();
            const TELEPORT_SPEED = 0.06;
            let teleportMarker = null;

            // ── Gyroscope state (Native Bridge — expo-sensors → postMessage) ──
            // Android WebView does NOT fire deviceorientation events.
            // Instead, React Native reads DeviceMotion natively and posts
            // gyro_data messages to us at 60fps. We apply the standard
            // Three.js DeviceOrientationControls math to those values.
            let controlMode = "joystick"; // 'joystick' | 'gyroscope'
            let gyroEnabled = false;

            // Three.js DeviceOrientationControls constants
            // q1: -90° around X — flips "looking at floor" → "looking forward"
            const _zee = new THREE.Vector3(0, 0, 1);
            const _eu = new THREE.Euler();
            const _q0 = new THREE.Quaternion();
            const _q1 = new THREE.Quaternion(
                -Math.sqrt(0.5),
                0,
                0,
                Math.sqrt(0.5),
            );

            const _latestDeviceQuat = new THREE.Quaternion();
            const _targetCamQuat = new THREE.Quaternion();
            let _yawOffsetQuat = null;
            let _gyroDataReceived = false; // guard — don't apply until first packet

            // Called every time a gyro_data message arrives from React Native
            // orientAngleDeg is sent by RN (reliable) — 0=portrait, 90=landscape-right, 270=landscape-left
            function onGyroData(alphaDeg, betaDeg, gammaDeg, orientAngleDeg) {
                if (!gyroEnabled) return;

                const alpha = THREE.MathUtils.degToRad(alphaDeg);
                const beta = THREE.MathUtils.degToRad(betaDeg);
                const gamma = THREE.MathUtils.degToRad(gammaDeg);
                // Use orient from React Native — window.screen.orientation.angle is always 0 in Android WebViews
                const orient = THREE.MathUtils.degToRad(orientAngleDeg || 90);

                // Standard Three.js DeviceOrientationControls algorithm
                // Ref: https://github.com/mrdoob/three.js/blob/dev/examples/jsm/controls/DeviceOrientationControls.js
                _eu.set(beta, alpha, -gamma, "YXZ");
                _latestDeviceQuat.setFromEuler(_eu);
                _latestDeviceQuat.multiply(_q1); // correct "looking at floor"
                _latestDeviceQuat.multiply(_q0.setFromAxisAngle(_zee, -orient)); // correct for landscape

                // Calibrate YAW only on first reading so the camera starts looking where the joystick left off
                // (We don't calibrate pitch/roll so the horizon stays level regardless of start orientation)
                if (!_yawOffsetQuat && camera) {
                    const vCam = new THREE.Vector3(0, 0, -1).applyQuaternion(
                        camera.quaternion,
                    );
                    const vDev = new THREE.Vector3(0, 0, -1).applyQuaternion(
                        _latestDeviceQuat,
                    );
                    vCam.y = 0;
                    if (vCam.lengthSq() > 0.001) vCam.normalize();
                    else vCam.set(0, 0, -1);
                    vDev.y = 0;
                    if (vDev.lengthSq() > 0.001) vDev.normalize();
                    else vDev.set(0, 0, -1);

                    const angle =
                        Math.atan2(vCam.x, vCam.z) - Math.atan2(vDev.x, vDev.z);
                    _yawOffsetQuat = new THREE.Quaternion().setFromAxisAngle(
                        new THREE.Vector3(0, 1, 0),
                        angle,
                    );
                }

                _gyroDataReceived = true;
            }

            function startGyroscope() {
                gyroEnabled = true;
                document.getElementById("gyro-indicator").style.display =
                    "block";
                document.getElementById("camera-zone").style.pointerEvents =
                    "none";
                document.getElementById("instructions").textContent =
                    "Tilt & rotate phone to look \u00b7 Joystick to move";
                if (controls) controls.enabled = false;
                // Reset calibration so it grabs a fresh heading if toggled off and on
                _yawOffsetQuat = null;
                _gyroDataReceived = false;
            }

            function applyGyroToCamera() {
                if (
                    !gyroEnabled ||
                    !camera ||
                    !_yawOffsetQuat ||
                    !_gyroDataReceived
                )
                    return;

                // Apply the yaw offset to the absolute device orientation
                _targetCamQuat.multiplyQuaternions(
                    _yawOffsetQuat,
                    _latestDeviceQuat,
                );

                // Smooth interpolation
                camera.quaternion.slerp(_targetCamQuat, 0.25);

                // Sync OrbitControls target so joystick movement direction stays correct
                if (model) {
                    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(
                        camera.quaternion,
                    );
                    controls.target
                        .copy(camera.position)
                        .addScaledVector(dir, 0.5);
                }
            }

            // ── Panel helpers ──────────────────────────────────────────────
            window.closeInfoPanel = () => {
                document.getElementById("info-panel").style.display = "none";
            };

            window.toggleGhostMode = () => {
                ghostMode = !ghostMode;
                document.getElementById("ghost-btn").textContent = ghostMode
                    ? "PHYSICS: OFF (GHOST)"
                    : "PHYSICS: ON";
                document.getElementById("ghost-btn").style.background =
                    ghostMode
                        ? "rgba(255, 0, 0, 0.2)"
                        : "rgba(0, 229, 255, 0.2)";
                document.getElementById("ghost-btn").style.color = ghostMode
                    ? "#FF4444"
                    : "#00E5FF";
                document.getElementById("ghost-btn").style.borderColor =
                    ghostMode ? "#FF4444" : "#00E5FF";
            };

            // Allow tapping anywhere on the canvas / camera-zone to interact with hotspots/doors
            let pointerDownPos = new THREE.Vector2();
            document.addEventListener("pointerdown", (e) => {
                pointerDownPos.set(e.clientX, e.clientY);
            });
            let activeHotspot = null;

            document.addEventListener("pointerup", (e) => {
                // If dragged more than 10 pixels, it's a drag (looking around), not a tap.
                const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                if (dist > 10) return;

                if (e.target.id === "canvas" || e.target.id === "camera-zone") {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                    tapRaycaster.setFromCamera(mouse, camera);
                    const intersects = tapRaycaster.intersectObjects(
                        hotspots,
                        true,
                    );

                    if (intersects.length > 0) {
                        let hit = intersects[0].object;
                        if (hit.userData.isPortal) {
                            window.ReactNativeWebView?.postMessage(
                                JSON.stringify({
                                    type: "portal_clicked",
                                    sceneId: hit.userData.sceneId,
                                    sceneTitle: hit.userData.sceneTitle,
                                })
                            );
                            return;
                        }
                        if (hit.userData.title) {
                            activeHotspot = hit; 
                            document.getElementById("info-title").textContent = hit.userData.title;
                            document.getElementById("info-desc").textContent = hit.userData.desc;
                            document.getElementById("info-panel").style.display = "block";
                        }
                    } else if (model) {
                        // Handle Teleportation on Model Floor
                        const modelIntersects = tapRaycaster.intersectObject(model, true);
                        if (modelIntersects.length > 0) {
                            const hit = modelIntersects[0];
                            // Check if the surface is mostly flat/horizontal (it's a floor)
                            const normal = hit.face.normal.clone();
                            if (hit.object.matrixWorld) {
                                normal.transformDirection(hit.object.matrixWorld);
                            }
                            // y > 0.7 means it's pointing up (at least ~45 degrees)
                            if (normal.y > 0.7) {
                                // Start teleport
                                teleportStartPos.copy(camera.position);
                                // The new target is exactly the clicked point, plus eye height
                                teleportTarget = new THREE.Vector3(hit.point.x, hit.point.y + 1.6, hit.point.z);
                                teleportProgress = 0;
                                
                                // Show a marker briefly
                                if (!teleportMarker) {
                                    const markerGeom = new THREE.RingGeometry(0.2, 0.3, 32);
                                    const markerMat = new THREE.MeshBasicMaterial({ color: 0x00E5FF, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                                    teleportMarker = new THREE.Mesh(markerGeom, markerMat);
                                    teleportMarker.rotation.x = -Math.PI / 2;
                                    scene.add(teleportMarker);
                                }
                                teleportMarker.position.copy(hit.point);
                                teleportMarker.position.y += 0.05; // Slightly above ground
                                teleportMarker.material.opacity = 0.8;
                                teleportMarker.visible = true;
                            }
                        }
                    }
                }
            });

            // ── Scene Initialization ───────────────────────────────────────
            function ensureScene(mode) {
                if (scene) return;
                controlMode = mode || controlMode || "joystick";

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87ceeb); // Sky color

                camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000,
                );

                renderer = new THREE.WebGLRenderer({
                    canvas: document.getElementById("canvas"),
                    antialias: true,
                    powerPreference: "high-performance",
                    precision: "mediump",
                    depth: true,
                    stencil: false,
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

                renderer.domElement.addEventListener("webglcontextlost", (event) => {
                    event.preventDefault();
                    console.warn("WebGL Context Lost! Suspending animation loop.");
                    if (animFrameId) cancelAnimationFrame(animFrameId);
                }, false);

                renderer.domElement.addEventListener("webglcontextrestored", () => {
                    console.log("WebGL Context Restored! Resuming animation loop.");
                    animate();
                }, false);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(
                    0xffffff,
                    0.5,
                );
                directionalLight.position.set(5, 10, 7.5);
                scene.add(directionalLight);

                // First-person look controls bound ONLY to the right half of the screen
                controls = new OrbitControls(
                    camera,
                    document.getElementById("camera-zone"),
                );
                controls.enableDamping = true;
                controls.dampingFactor = 0.25; // Snappy, instant finger response without floaty drag
                controls.rotateSpeed = 0.85;  // Responsive head turning
                controls.enableZoom = false;
                controls.enablePan = false;

                initJoystick();
                animate();

                if (controlMode === "gyroscope") {
                    startGyroscope();
                }

                window.addEventListener("resize", onWindowResize);
            }

            function init(modelUrl, mode) {
                ensureScene(mode);
                if (modelUrl) {
                    loadModel(modelUrl);
                }
            }

            // ── Joystick ───────────────────────────────────────────────────
            function initJoystick() {
                const zone = document.getElementById("joystick-zone");
                zone.style.pointerEvents = "auto";

                joystickManager = nipplejs.create({
                    zone: zone,
                    mode: "static",
                    position: { left: "50%", top: "50%" },
                    color: "#00E5FF",
                    size: 100,
                });

                joystickManager.on("move", (evt, data) => {
                    const angle = data.angle.radian;
                    const force = Math.min(data.force, 1);
                    // Nipplejs angles: 0=right, PI/2=up
                    moveForward = Math.sin(angle) * force * MOVE_SPEED;
                    moveRight = Math.cos(angle) * force * MOVE_SPEED;
                });

                joystickManager.on("end", () => {
                    moveForward = 0;
                    moveRight = 0;
                });
            }

            // ── Model Loading ──────────────────────────────────────────────
            function onInteriorModelLoaded(gltf) {
                console.log("Model loaded successfully");
                        model = gltf.scene;
                        scene.add(model);

                        // Calculate bounding box to place camera
                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());

                        worldBounds = box.clone();
                        worldBounds.min.y -= 10;
                        worldBounds.max.y += 10;

                        // ── Smart Ground Floor Spawn Point Detection ─────────────────
                        let spawnX = center.x;
                        let spawnY = box.min.y + 1.6;
                        let spawnZ = center.z;
                        let spawnFacingAngle = 0; // will be overwritten by smart-facing

                        // 1. If building has hotspots, prefer the first hotspot (intentional admin placement)
                        if (window.buildingHotspots && window.buildingHotspots.length > 0) {
                            const firstSpot = window.buildingHotspots[0];
                            spawnX = Number(firstSpot.x);
                            spawnY = Number(firstSpot.y) + 1.6;
                            spawnZ = Number(firstSpot.z);
                        } else {
                            // 2. Grid Raycast — cast 5×5 = 25 rays across the building footprint.
                            //    Handles L-shapes, courtyards, and buildings where the center is open air.
                            //    Each ray is spaced at 20% of the building's X/Z dimensions.
                            const spawnRaycaster = new THREE.Raycaster();
                            const downDir = new THREE.Vector3(0, -1, 0);
                            const GRID = 5; // 5×5 grid
                            const allFloorHits = [];

                            for (let gx = 0; gx < GRID; gx++) {
                                for (let gz = 0; gz < GRID; gz++) {
                                    // Sample points evenly from 10%–90% of the footprint (avoid edges)
                                    const px = box.min.x + size.x * (0.1 + (gx / (GRID - 1)) * 0.8);
                                    const pz = box.min.z + size.z * (0.1 + (gz / (GRID - 1)) * 0.8);
                                    const origin = new THREE.Vector3(px, box.max.y + 5, pz);
                                    spawnRaycaster.set(origin, downDir);
                                    const hits = spawnRaycaster.intersectObject(model, true);

                                    // 3. Floor Cluster Filter — discard underground slabs and rooftops.
                                    //    Only keep hits in the lowest 2m band above the true model floor.
                                    const trueFloor = box.min.y + 0.05; // above any foundation slab
                                    const floorBandTop = trueFloor + 2.0; // 2m band = ground floor only
                                    hits.forEach(h => {
                                        if (h.point.y >= trueFloor && h.point.y <= floorBandTop) {
                                            allFloorHits.push(h.point);
                                        }
                                    });
                                }
                            }

                            if (allFloorHits.length > 0) {
                                // Pick the average position of all valid floor hits as the spawn center.
                                // More hits = denser area = more reliable interior location (majority vote).
                                const avgX = allFloorHits.reduce((s, p) => s + p.x, 0) / allFloorHits.length;
                                const avgY = allFloorHits.reduce((s, p) => s + p.y, 0) / allFloorHits.length;
                                const avgZ = allFloorHits.reduce((s, p) => s + p.z, 0) / allFloorHits.length;
                                spawnX = avgX;
                                spawnY = avgY + 1.6; // human eye height
                                spawnZ = avgZ;
                            } else {
                                // Fallback: brute-force 4 cardinal offsets if grid found nothing
                                const offsets = [
                                    [0, 0],
                                    [0,  size.z * 0.3],
                                    [0, -size.z * 0.3],
                                    [ size.x * 0.2, 0],
                                    [-size.x * 0.2, 0],
                                ];
                                let found = false;
                                for (const [dx, dz] of offsets) {
                                    const origin = new THREE.Vector3(center.x + dx, box.max.y + 5, center.z + dz);
                                    spawnRaycaster.set(origin, downDir);
                                    const hits = spawnRaycaster.intersectObject(model, true);
                                    const trueFloor = box.min.y + 0.05;
                                    const valid = hits.filter(h => h.point.y >= trueFloor);
                                    if (valid.length > 0) {
                                        const lowest = valid.sort((a, b) => a.point.y - b.point.y)[0];
                                        spawnX = lowest.point.x;
                                        spawnY = lowest.point.y + 1.6;
                                        spawnZ = lowest.point.z;
                                        found = true;
                                        break;
                                    }
                                }
                                // Last resort: use bounding box floor
                                if (!found) {
                                    spawnX = center.x;
                                    spawnY = box.min.y + 1.6;
                                    spawnZ = center.z;
                                }
                            }
                        }

                        // 4. Smart Facing Direction — fire 8 short raycasts around spawn point.
                        //    Pick the direction with the MOST free space so player faces into the room.
                        {
                            const facingRaycaster = new THREE.Raycaster();
                            facingRaycaster.far = 4.0;
                            const spawnEye = new THREE.Vector3(spawnX, spawnY, spawnZ);
                            const DIRECTIONS_8 = [0, 45, 90, 135, 180, 225, 270, 315]; // degrees
                            let bestAngle = 0;
                            let bestDist  = -1;

                            DIRECTIONS_8.forEach(deg => {
                                const rad = THREE.MathUtils.degToRad(deg);
                                const dir = new THREE.Vector3(Math.sin(rad), 0, Math.cos(rad));
                                facingRaycaster.set(spawnEye, dir);
                                const hits = facingRaycaster.intersectObject(model, true);
                                const dist = hits.length > 0 ? hits[0].distance : facingRaycaster.far;
                                if (dist > bestDist) {
                                    bestDist  = dist;
                                    bestAngle = rad;
                                }
                            });
                            spawnFacingAngle = bestAngle;
                        }

                        // Store default safe spawn position for void recovery
                        window.safeSpawnPos = new THREE.Vector3(spawnX, spawnY, spawnZ);

                        // Position camera at spawn point
                        camera.position.set(spawnX, spawnY, spawnZ);

                        // Face the most-open direction instead of always -Z
                        const facingTarget = new THREE.Vector3(
                            spawnX + Math.sin(spawnFacingAngle),
                            spawnY,
                            spawnZ + Math.cos(spawnFacingAngle),
                        );
                        controls.target.copy(facingTarget);
                        controls.update();

                        // Trigger spawn fade-in: black overlay fades out smoothly after 1 rendered frame
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                const fadeEl = document.getElementById('spawn-fade');
                                if (fadeEl) {
                                    fadeEl.classList.add('faded');
                                    // Remove from DOM after transition so it doesn't block pointer events
                                    fadeEl.addEventListener('transitionend', () => fadeEl.remove(), { once: true });
                                }
                            });
                        });

                        // Safety ground plane under model so the player never falls into the void
                        const groundGeom = new THREE.PlaneGeometry(Math.max(2000, size.x * 10), Math.max(2000, size.z * 10));
                        const groundMat = new THREE.MeshBasicMaterial({ color: 0x5a6a72, depthWrite: true });
                        const groundPlane = new THREE.Mesh(groundGeom, groundMat);
                        groundPlane.rotation.x = -Math.PI / 2;
                        groundPlane.position.set(center.x, box.min.y, center.z);
                        scene.add(groundPlane);

                        // ── Create Interactive Hotspots (NPC) ──────────────────────
                        const createHotspot = (x, y, z, title, desc, color, category) => {
                            const isRestricted = category === "restricted";
                            const accent = isRestricted
                                ? NPC_COLORS.danger
                                : NPC_COLORS.badge;

                            // Outer group owns placement + facing. The avatar
                            // lives in its own group so idle sway never tilts
                            // the shadow or the ring.
                            const npcGroup = new THREE.Group();
                            npcGroup.position.set(x, y, z);

                            const avatar = buildNPCAvatar(isRestricted);
                            npcGroup.add(avatar.body);

                            // Soft contact shadow so the NPC feels planted.
                            const shadow = new THREE.Mesh(
                                new THREE.CircleGeometry(0.34, 20),
                                new THREE.MeshBasicMaterial({
                                    map: getNpcShadowTexture(),
                                    transparent: true,
                                    depthWrite: false,
                                    opacity: 0.8,
                                }),
                            );
                            shadow.rotation.x = -Math.PI / 2;
                            shadow.position.y = 0.012;
                            shadow.renderOrder = 1;
                            npcGroup.add(shadow);

                            // Pulsing ring — the "this is a character" tell.
                            const ring = new THREE.Mesh(
                                new THREE.RingGeometry(0.3, 0.37, 40),
                                new THREE.MeshBasicMaterial({
                                    color: accent,
                                    transparent: true,
                                    opacity: 0.55,
                                    side: THREE.DoubleSide,
                                    depthWrite: false,
                                }),
                            );
                            ring.rotation.x = -Math.PI / 2;
                            ring.position.y = 0.02;
                            ring.renderOrder = 2;
                            npcGroup.add(ring);

                            // Floating quest gem above the head.
                            const gem = new THREE.Mesh(
                                new THREE.OctahedronGeometry(0.06, 0),
                                new THREE.MeshStandardMaterial({
                                    color: accent,
                                    emissive: accent,
                                    emissiveIntensity: 0.9,
                                    roughness: 0.25,
                                    metalness: 0.15,
                                }),
                            );
                            gem.position.y = NPC_GEM_Y;
                            npcGroup.add(gem);

                            // Invisible hitbox for tap raycasting (sized for
                            // fingers, a little wider than the chibi itself).
                            const hitBox = new THREE.Mesh(
                                new THREE.CylinderGeometry(0.5, 0.5, 1.7, 10),
                                new THREE.MeshBasicMaterial({ visible: false }),
                            );
                            hitBox.position.y = 0.85;
                            npcGroup.add(hitBox);

                            // Nameplate — the name is always visible.
                            const labelContainer =
                                document.getElementById("floating-labels");
                            const labelDiv = document.createElement("div");
                            labelDiv.className = "floating-label";
                            if (isRestricted) labelDiv.classList.add("restricted");
                            labelDiv.innerHTML =
                                '<span class="npc-dot"></span>' +
                                escapeHtml(title || "NPC");
                            labelDiv._lastHtml = title || "NPC";
                            labelContainer.appendChild(labelDiv);

                            // Speech bubble — only the description, and only
                            // while the player is close. The name stays put.
                            const bubbleDiv = document.createElement("div");
                            bubbleDiv.className = "npc-bubble";
                            if (isRestricted)
                                bubbleDiv.classList.add("restricted");
                            labelContainer.appendChild(bubbleDiv);

                            const parts = avatar.parts;
                            const blinkState = {
                                nextBlink:
                                    performance.now() * 0.001 +
                                    1.5 +
                                    Math.random() * 3,
                                blinkUntil: 0,
                            };

                            hitBox.userData = {
                                title,
                                desc,
                                category,
                                isRestricted,
                                parentGroup: npcGroup,
                                rightArm: parts.rightArm.shoulder, // kept for compatibility
                                labelDiv: labelDiv,
                                bubbleDiv: bubbleDiv,
                                labelHeight: NPC_LABEL_HEIGHT,
                                // Bubble hysteresis state (open 4.5m / close 5m).
                                bubbleState: { open: false },

                                // Called once per frame by the render loop.
                                update: (t, near) => {
                                    const breathe = Math.sin(t * 1.7);

                                    // Breathing (scales the torso group, so the
                                    // chest rises and settles like a real idle).
                                    parts.torso.scale.set(
                                        1 + breathe * 0.01,
                                        1 + breathe * 0.016,
                                        1 + breathe * 0.01,
                                    );
                                    parts.torso.position.y = breathe * 0.006;

                                    // Blink
                                    if (t > blinkState.nextBlink) {
                                        blinkState.blinkUntil = t + 0.1;
                                        blinkState.nextBlink =
                                            t + 2.4 + Math.random() * 3.6;
                                    }
                                    const eyeOpen =
                                        t < blinkState.blinkUntil ? 0.08 : 1;
                                    parts.eyes.forEach((eye) => {
                                        eye.scale.y +=
                                            (eyeOpen - eye.scale.y) * 0.5;
                                    });

                                    const r = parts.rightArm;
                                    const l = parts.leftArm;

                                    if (isRestricted) {
                                        // Arms folded high across the chest.
                                        // The round belly is deep, so the
                                        // forearms swing forward as well as
                                        // inward; different elbow bends keep
                                        // the mittens side by side.
                                        l.shoulder.rotation.z = -1.57;
                                        l.shoulder.rotation.x = -0.9;
                                        l.elbow.rotation.x = -0.3;

                                        r.shoulder.rotation.z = 1.6;
                                        r.shoulder.rotation.x = -0.9;
                                        r.elbow.rotation.x = -0.55;

                                        parts.head.rotation.y =
                                            Math.sin(t * (near ? 2.2 : 0.6)) *
                                            0.2;
                                    } else if (near) {
                                        // Friendly wave when you walk up.
                                        const wave = Math.sin(t * 6.2);
                                        r.shoulder.rotation.z =
                                            -2.02 + wave * 0.3;
                                        r.shoulder.rotation.x = -0.12;
                                        r.elbow.rotation.x =
                                            -0.5 + wave * 0.15;

                                        l.shoulder.rotation.z = NPC_ARM_REST;
                                        l.shoulder.rotation.x = 0;
                                        l.elbow.rotation.x = -0.1;

                                        parts.head.rotation.y *= 0.85;
                                    } else {
                                        // Idle: arms at rest, head drifts.
                                        l.shoulder.rotation.z = NPC_ARM_REST;
                                        l.shoulder.rotation.x = 0;
                                        l.elbow.rotation.x = -0.08;

                                        r.shoulder.rotation.z = -NPC_ARM_REST;
                                        r.shoulder.rotation.x = 0;
                                        r.elbow.rotation.x = -0.08;

                                        parts.head.rotation.y =
                                            Math.sin(t * 0.5) * 0.32;
                                    }

                                    // Whole-body sway + head bob
                                    parts.body.rotation.z =
                                        Math.sin(t * 0.85) * 0.014;
                                    parts.head.rotation.z =
                                        Math.sin(t * 0.85 + 0.6) * 0.02;
                                    parts.head.position.y =
                                        parts.headBaseY + breathe * 0.008;

                                    // Gem bobs and spins, ring breathes.
                                    gem.rotation.y = t * 1.8;
                                    gem.position.y =
                                        NPC_GEM_Y + Math.sin(t * 1.9) * 0.03;

                                    const pulse = 1 + Math.sin(t * 2.1) * 0.05;
                                    ring.scale.set(pulse, pulse, 1);
                                    ring.material.opacity = near ? 0.8 : 0.5;

                                    shadow.material.opacity = near ? 0.95 : 0.8;
                                },
                            };

                            npcGroup.add(hitBox);
                            scene.add(npcGroup);
                            hotspots.push(hitBox);
                        };

                        // Unit 30: 360 Panorama Portal Badges
                        const createPortalBadge = (sceneData) => {
                            const x = sceneData.anchor_x;
                            const y = sceneData.anchor_y != null ? sceneData.anchor_y : 1.6;
                            const z = sceneData.anchor_z;
                            const title = sceneData.title || "360° Room";

                            const portalGroup = new THREE.Group();
                            portalGroup.position.set(x, y, z);

                            // Outer Glowing Cyan Ring
                            const outerRingGeom = new THREE.RingGeometry(0.35, 0.42, 32);
                            const outerRingMat = new THREE.MeshBasicMaterial({
                                color: 0x00E5FF,
                                side: THREE.DoubleSide,
                                transparent: true,
                                opacity: 0.9,
                            });
                            const outerRing = new THREE.Mesh(outerRingGeom, outerRingMat);
                            portalGroup.add(outerRing);

                            // Inner Pulsing Cyan Accent Ring
                            const innerRingGeom = new THREE.RingGeometry(0.24, 0.28, 32);
                            const innerRingMat = new THREE.MeshBasicMaterial({
                                color: 0x96C0CE,
                                side: THREE.DoubleSide,
                                transparent: true,
                                opacity: 0.8,
                            });
                            const innerRing = new THREE.Mesh(innerRingGeom, innerRingMat);
                            portalGroup.add(innerRing);

                            // Center Disc with 360° Icon Canvas Texture
                            const pCanvas = document.createElement("canvas");
                            pCanvas.width = 128;
                            pCanvas.height = 128;
                            const pCtx = pCanvas.getContext("2d");
                            pCtx.fillStyle = "rgba(7, 42, 48, 0.88)";
                            pCtx.beginPath();
                            pCtx.arc(64, 64, 60, 0, Math.PI * 2);
                            pCtx.fill();
                            pCtx.lineWidth = 4;
                            pCtx.strokeStyle = "#00e5ff";
                            pCtx.stroke();
                            pCtx.fillStyle = "#ffffff";
                            pCtx.font = "bold 40px sans-serif";
                            pCtx.textAlign = "center";
                            pCtx.textBaseline = "middle";
                            pCtx.fillText("360°", 64, 64);

                            const pTexture = new THREE.CanvasTexture(pCanvas);
                            const centerGeom = new THREE.PlaneGeometry(0.44, 0.44);
                            const centerMat = new THREE.MeshBasicMaterial({
                                map: pTexture,
                                transparent: true,
                                side: THREE.DoubleSide,
                            });
                            const centerMesh = new THREE.Mesh(centerGeom, centerMat);
                            portalGroup.add(centerMesh);

                            // Clickable Invisible Hitbox
                            const hitBoxGeom = new THREE.SphereGeometry(0.55, 12, 12);
                            const hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
                            const hitBox = new THREE.Mesh(hitBoxGeom, hitBoxMat);

                            // HTML Floating Label
                            const labelDiv = document.createElement("div");
                            labelDiv.className = "floating-label portal-label";
                            labelDiv.innerHTML = `${title}<br><span style="font-size:10px;color:#00E5FF;font-weight:bold;">TAP TO ENTER 360°</span>`;
                            document.getElementById("floating-labels").appendChild(labelDiv);


                            hitBox.userData = {
                                isPortal: true,
                                sceneId: sceneData.id,
                                sceneTitle: title,
                                parentGroup: portalGroup,
                                pulseMesh: innerRing,
                                outerRing: outerRing,
                                labelDiv: labelDiv,
                            };

                            portalGroup.add(hitBox);
                            scene.add(portalGroup);
                            hotspots.push(hitBox);
                            portalBadges.push(hitBox);
                        };

                        // Load Dynamic Hotspots from the Database
                        if (
                            window.buildingHotspots &&
                            window.buildingHotspots.length > 0
                        ) {
                            window.buildingHotspots.forEach((h) => {
                                createHotspot(
                                    h.x,
                                    h.y,
                                    h.z,
                                    h.title,
                                    h.desc || "",
                                    0x00e5ff,
                                    h.category
                                );
                            });
                        }

                        // Load 360 Panorama Portals from window.panoramaScenes
                        if (
                            window.panoramaScenes &&
                            window.panoramaScenes.length > 0
                        ) {
                            window.panoramaScenes.forEach((sceneData) => {
                                createPortalBadge(sceneData);
                            });
                        }


                        document.getElementById("loading").style.display =
                            "none";
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({ type: "loaded" }),
                        );
            }

            function parseBase64Model(base64Data, fallbackUrl) {
                ensureScene(controlMode);
                document.getElementById("loading").textContent = "RENDERING INTERIOR...";

                try {
                    const binaryString = window.atob(base64Data);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }

                    const loader = new GLTFLoader();
                    const dracoLoader = new DRACOLoader();
                    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                    loader.setDRACOLoader(dracoLoader);

                    loader.parse(
                        bytes.buffer,
                        "",
                        (gltf) => {
                            onInteriorModelLoaded(gltf);
                        },
                        (error) => {
                            console.error("Cached interior model parse error:", error);
                            if (fallbackUrl) {
                                loadModel(fallbackUrl);
                            } else {
                                const errMsg = (error && error.message) ? error.message : "Failed to render cached interior model";
                                document.getElementById("loading").textContent = "LOAD ERROR";
                                window.ReactNativeWebView?.postMessage(
                                    JSON.stringify({ type: "error", message: errMsg }),
                                );
                            }
                        }
                    );
                } catch (e) {
                    console.error("Base64 decode error:", e);
                    if (fallbackUrl) {
                        loadModel(fallbackUrl);
                    } else {
                        document.getElementById("loading").textContent = "LOAD ERROR";
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({ type: "error", message: e.message }),
                        );
                    }
                }
            }

            function loadModel(url) {
                ensureScene(controlMode);
                console.log("Starting to load interior model from:", url);
                const loader = new GLTFLoader();
                
                const dracoLoader = new DRACOLoader();
                dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                loader.setDRACOLoader(dracoLoader);
                
                loader.load(
                    url,
                    (gltf) => {
                        onInteriorModelLoaded(gltf);
                    },
                    (progress) => {
                        if (progress.total > 0) {
                            const percent = Math.round(
                                (progress.loaded / progress.total) * 100,
                            );
                            const mb = (progress.loaded / 1048576).toFixed(1);
                            document.getElementById("loading").textContent =
                                `LOADING ${percent}% (${mb}MB)`;
                            window.ReactNativeWebView?.postMessage(
                                JSON.stringify({
                                    type: "progress",
                                    percent: percent,
                                }),
                            );
                        }
                    },
                    (error) => {
                        console.error("Model loading error:", error);
                        const errMsg = (error && error.message) ? error.message : "Failed to load interior model. Please verify connection.";
                        document.getElementById("loading").textContent =
                            "LOAD ERROR";
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({
                                type: "error",
                                message: errMsg,
                            }),
                        );
                    },
                );
            }

            // ✨ Animation Loop ✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨✨
            const velocity = new THREE.Vector3();
            let velocityY = 0;
            const direction = new THREE.Vector3();
            const tempVector = new THREE.Vector3();

            function animate() {
                animFrameId = requestAnimationFrame(animate);

                // Animate NPC hotspots: nameplate always, description bubble
                // only while the player is close.
                const time = performance.now() * 0.003;
                const npcTime = performance.now() * 0.001;

                hotspots.forEach((h) => {
                    if (h.userData.isPortal) return;
                    const npcGroup = h.userData.parentGroup;
                    const labelDiv = h.userData.labelDiv;
                    const bubbleDiv = h.userData.bubbleDiv;
                    if (!npcGroup || !labelDiv) return;

                    npcGroup.getWorldPosition(tempVector);
                    const dist = tempVector.distanceTo(camera.position);

                    // Hysteresis (open at 4.5m, close only past 5.0m) keeps the
                    // bubble from flickering while you drift along the edge.
                    const bubbleState = (h.userData.bubbleState ??= {
                        open: false,
                    });
                    bubbleState.open = bubbleState.open
                        ? dist < 5.0
                        : dist < 4.5;
                    const near = bubbleState.open;

                    // Turn to face the player, faster once close enough to talk.
                    const targetYaw = Math.atan2(
                        camera.position.x - npcGroup.position.x,
                        camera.position.z - npcGroup.position.z,
                    );
                    const yawDelta = Math.atan2(
                        Math.sin(targetYaw - npcGroup.rotation.y),
                        Math.cos(targetYaw - npcGroup.rotation.y),
                    );
                    npcGroup.rotation.y += yawDelta * (near ? 0.16 : 0.05);

                    h.userData.update?.(npcTime, near);

                    // Nameplate sits above the head.
                    tempVector.y += h.userData.labelHeight ?? 1.82;
                    tempVector.project(camera);

                    if (tempVector.z > 1) {
                        labelDiv.style.opacity = "0";
                        if (bubbleDiv) {
                            bubbleDiv.style.opacity = "0";
                            bubbleDiv.classList.remove("show");
                        }
                        return;
                    }

                    const x = (tempVector.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (tempVector.y * -0.5 + 0.5) * window.innerHeight;
                    labelDiv.style.left = `${x}px`;
                    labelDiv.style.top = `${y}px`;
                    labelDiv.style.opacity = "1";

                    const name = h.userData.title || "NPC";
                    if (labelDiv._lastHtml !== name) {
                        labelDiv.innerHTML =
                            '<span class="npc-dot"></span>' +
                            escapeHtml(name);
                        labelDiv._lastHtml = name;
                    }

                    // Speech bubble: description only, and it pops out of the
                    // head when you walk up, then tucks away when you leave.
                    if (!bubbleDiv) return;

                    const desc = String(h.userData.desc || "").trim();
                    bubbleDiv.style.opacity = "";

                    if (near && desc) {
                        bubbleDiv.style.left = `${x}px`;
                        bubbleDiv.style.top = `${y}px`;
                        if (bubbleDiv._lastHtml !== desc) {
                            bubbleDiv.innerHTML = escapeHtml(desc);
                            bubbleDiv._lastHtml = desc;
                        }
                        bubbleDiv.classList.add("show");
                    } else {
                        bubbleDiv.classList.remove("show");
                    }
                });

                // Animate 360 Portal Badges (Unit 30)
                portalBadges.forEach((p) => {
                    const pGroup = p.userData.parentGroup;
                    const labelDiv = p.userData.labelDiv;
                    // Always face the camera
                    pGroup.quaternion.copy(camera.quaternion);

                    // Pulse animation
                    if (p.userData.pulseMesh) {
                        const s = 1 + Math.sin(time * 3) * 0.08;
                        p.userData.pulseMesh.scale.set(s, s, s);
                    }

                    // Position floating HTML label above portal
                    pGroup.getWorldPosition(tempVector);
                    const dist = tempVector.distanceTo(camera.position);
                    tempVector.y += 0.55;
                    tempVector.project(camera);

                    if (tempVector.z > 1 || dist > 25) {
                        labelDiv.style.opacity = "0";
                    } else {
