<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape"
        />
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #000000;
            }
            #canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #00e5ff;
                font-weight: bold;
                font-family: system-ui;
                letter-spacing: 2px;
            }
            #joystick-zone {
                position: absolute;
                bottom: 20px;
                left: 20px;
                width: 120px;
                height: 120px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                border: 2px solid rgba(0, 229, 255, 0.3);
                pointer-events: none;
            }
            #instructions {
                position: absolute;
                bottom: 20px;
                right: 20px;
                text-align: right;
                color: rgba(255, 255, 255, 0.7);
                font-family: system-ui;
                font-size: 12px;
                pointer-events: none;
            }
            #ghost-btn {
                position: absolute;
                top: 80px;
                right: 20px;
                background: rgba(0, 229, 255, 0.2);
                color: #00e5ff;
                border: 1px solid #00e5ff;
                padding: 8px 12px;
                border-radius: 8px;
                font-family: system-ui;
                font-weight: bold;
                z-index: 100;
            }
            #camera-zone {
                position: absolute;
                top: 0;
                right: 0;
                width: 50%;
                height: 100%;
                z-index: 10;
            }
            #crosshair {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 6px;
                height: 6px;
                background: rgba(255, 255, 255, 0.8);
                border-radius: 50%;
                transform: translate(-50%, -50%);
                z-index: 50;
                pointer-events: none;
            }
            #info-panel {
                position: absolute;
                background: rgba(0, 0, 0, 0.85);
                border: 2px solid #00e5ff;
                color: white;
                padding: 15px;
                border-radius: 12px;
                width: 220px;
                text-align: center;
                font-family: system-ui;
                z-index: 200;
                display: none;
                pointer-events: auto;
                transform: translate(-50%, -100%);
                margin-top: -15px; /* Spacing above head */
                box-shadow: 0 10px 30px rgba(0, 229, 255, 0.2);
            }
            #info-panel::after {
                content: '';
                position: absolute;
                bottom: -10px;
                left: 50%;
                transform: translateX(-50%);
                border-width: 10px 10px 0;
                border-style: solid;
                border-color: #00e5ff transparent transparent transparent;
                display: block;
                width: 0;
            }
            #info-panel h2 {
                margin-top: 0;
                color: #00e5ff;
            }
            #info-close {
                margin-top: 15px;
                padding: 10px 20px;
                background: #00e5ff;
                color: black;
                font-weight: bold;
                border: none;
                border-radius: 6px;
                width: 100%;
            }
            .floating-label {
                position: absolute;
                background: rgba(0, 229, 255, 0.9);
                color: #000;
                font-weight: bold;
                padding: 6px 14px;
                border-radius: 14px;
                font-family: system-ui, sans-serif;
                font-size: 14px;
                pointer-events: none;
                transform: translate(-50%, -100%);
                opacity: 0;
                white-space: nowrap;
                box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                transition: opacity 0.2s;
                text-align: center;
                z-index: 150;
            }
            .floating-label::after {
                content: '';
                position: absolute;
                bottom: -6px;
                left: 50%;
                transform: translateX(-50%);
                border-width: 6px 6px 0;
                border-style: solid;
                border-color: rgba(0, 229, 255, 0.9) transparent transparent transparent;
                display: block;
                width: 0;
            }
            .floating-label.restricted {
                background: rgba(220, 53, 69, 0.9);
                color: #fff;
            }
            .floating-label.restricted::after {
                border-color: rgba(220, 53, 69, 0.9) transparent transparent transparent;
            }
            /* ── Gyroscope mode indicator pill ─────────────────────── */
            #gyro-indicator {
                position: absolute;
                top: 16px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(46, 204, 113, 0.15);
                border: 1px solid rgba(46, 204, 113, 0.6);
                color: #2ecc71;
                font-family: system-ui;
                font-size: 11px;
                font-weight: bold;
                letter-spacing: 2px;
                padding: 5px 14px;
                border-radius: 20px;
                z-index: 200;
                display: none;
                pointer-events: none;
                white-space: nowrap;
            }

            /* ── Gyroscope permission banner (iOS 13+ needs user gesture) ── */
            #gyro-permission-banner {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.92);
                border: 2px solid #2ecc71;
                color: white;
                padding: 24px 20px;
                border-radius: 14px;
                width: 280px;
                text-align: center;
                font-family: system-ui;
                z-index: 500;
                display: none;
            }
            #gyro-permission-banner h3 {
                margin: 0 0 10px;
                color: #2ecc71;
                font-size: 15px;
                letter-spacing: 1px;
            }
            #gyro-permission-banner p {
                margin: 0 0 16px;
                color: rgba(255, 255, 255, 0.75);
                font-size: 13px;
                line-height: 1.5;
            }
            #gyro-allow-btn {
                width: 100%;
                padding: 12px;
                background: #2ecc71;
                color: black;
                font-weight: bold;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                cursor: pointer;
            }
        </style>
        <!-- Include nipplejs for Joystick -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    </head>
    <body>
        <div id="loading">INITIALIZING...</div>
        <div id="instructions">
            Drag right side to look<br />Use joystick to move
        </div>
        <div id="joystick-zone"></div>
        <div id="camera-zone"></div>
        <button id="ghost-btn" onclick="toggleGhostMode()">PHYSICS: ON</button>
        <div id="crosshair"></div>

        <!-- Gyroscope mode indicator -->
        <div id="gyro-indicator">⬡ GYROSCOPE ACTIVE</div>

        <!-- Gyroscope permission banner (iOS 13+ DeviceOrientationEvent.requestPermission) -->
        <div id="gyro-permission-banner">
            <h3>GYROSCOPE ACCESS</h3>
            <p>
                This mode uses your phone's built-in gyroscope to look around.
                Please allow sensor access.
            </p>
            <button id="gyro-allow-btn" onclick="requestGyroPermission()">
                ALLOW GYROSCOPE
            </button>
        </div>

        <!-- Info panel is kept for backwards compatibility or clicks, but we'll use floating-labels for hover -->
        <div id="info-panel">
            <h2 id="info-title">Title</h2>
            <p id="info-desc">Description</p>
            <button id="info-close" onclick="closeInfoPanel()">CLOSE</button>
        </div>
        
        <div id="floating-labels"></div>

        <canvas id="canvas"></canvas>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
                }
            }
        </script>
        <script type="module">
            import * as THREE from "three";
            import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
            import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
            import { OrbitControls } from "three/addons/controls/OrbitControls.js";

            let scene, camera, renderer, controls, model;
            let moveForward = 0;
            let moveRight = 0;
            let joystickManager;
            let ghostMode = false;
            const MOVE_SPEED = 0.10;
            const COLLISION_DISTANCE = 0.3;
            const raycaster = new THREE.Raycaster();
            const centerRaycaster = new THREE.Raycaster();
            const downVector = new THREE.Vector3(0, -1, 0);
            let worldBounds;

            let hotspots = [];
            const tapRaycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            // Teleportation state
            let teleportTarget = null;
            let teleportProgress = 0;
            let teleportStartPos = new THREE.Vector3();
            const TELEPORT_SPEED = 0.04;
            let teleportMarker = null;

            // ── Gyroscope state (Native Bridge — expo-sensors → postMessage) ──
            // Android WebView does NOT fire deviceorientation events.
            // Instead, React Native reads DeviceMotion natively and posts
            // gyro_data messages to us at 60fps. We apply the standard
            // Three.js DeviceOrientationControls math to those values.
            let controlMode = "joystick"; // 'joystick' | 'gyroscope'
            let gyroEnabled = false;

            // Three.js DeviceOrientationControls constants
            // q1: -90° around X — flips "looking at floor" → "looking forward"
            const _zee = new THREE.Vector3(0, 0, 1);
            const _eu = new THREE.Euler();
            const _q0 = new THREE.Quaternion();
            const _q1 = new THREE.Quaternion(
                -Math.sqrt(0.5),
                0,
                0,
                Math.sqrt(0.5),
            );

            const _latestDeviceQuat = new THREE.Quaternion();
            const _targetCamQuat = new THREE.Quaternion();
            let _yawOffsetQuat = null;
            let _gyroDataReceived = false; // guard — don't apply until first packet

            // Called every time a gyro_data message arrives from React Native
            // orientAngleDeg is sent by RN (reliable) — 0=portrait, 90=landscape-right, 270=landscape-left
            function onGyroData(alphaDeg, betaDeg, gammaDeg, orientAngleDeg) {
                if (!gyroEnabled) return;

                const alpha = THREE.MathUtils.degToRad(alphaDeg);
                const beta = THREE.MathUtils.degToRad(betaDeg);
                const gamma = THREE.MathUtils.degToRad(gammaDeg);
                // Use orient from React Native — window.screen.orientation.angle is always 0 in Android WebViews
                const orient = THREE.MathUtils.degToRad(orientAngleDeg || 90);

                // Standard Three.js DeviceOrientationControls algorithm
                // Ref: https://github.com/mrdoob/three.js/blob/dev/examples/jsm/controls/DeviceOrientationControls.js
                _eu.set(beta, alpha, -gamma, "YXZ");
                _latestDeviceQuat.setFromEuler(_eu);
                _latestDeviceQuat.multiply(_q1); // correct "looking at floor"
                _latestDeviceQuat.multiply(_q0.setFromAxisAngle(_zee, -orient)); // correct for landscape

                // Calibrate YAW only on first reading so the camera starts looking where the joystick left off
                // (We don't calibrate pitch/roll so the horizon stays level regardless of start orientation)
                if (!_yawOffsetQuat && camera) {
                    const vCam = new THREE.Vector3(0, 0, -1).applyQuaternion(
                        camera.quaternion,
                    );
                    const vDev = new THREE.Vector3(0, 0, -1).applyQuaternion(
                        _latestDeviceQuat,
                    );
                    vCam.y = 0;
                    if (vCam.lengthSq() > 0.001) vCam.normalize();
                    else vCam.set(0, 0, -1);
                    vDev.y = 0;
                    if (vDev.lengthSq() > 0.001) vDev.normalize();
                    else vDev.set(0, 0, -1);

                    const angle =
                        Math.atan2(vCam.x, vCam.z) - Math.atan2(vDev.x, vDev.z);
                    _yawOffsetQuat = new THREE.Quaternion().setFromAxisAngle(
                        new THREE.Vector3(0, 1, 0),
                        angle,
                    );
                }

                _gyroDataReceived = true;
            }

            function startGyroscope() {
                gyroEnabled = true;
                document.getElementById("gyro-indicator").style.display =
                    "block";
                document.getElementById("camera-zone").style.pointerEvents =
                    "none";
                document.getElementById("instructions").textContent =
                    "Tilt & rotate phone to look \u00b7 Joystick to move";
                if (controls) controls.enabled = false;
                // Reset calibration so it grabs a fresh heading if toggled off and on
                _yawOffsetQuat = null;
                _gyroDataReceived = false;
            }

            function applyGyroToCamera() {
                if (
                    !gyroEnabled ||
                    !camera ||
                    !_yawOffsetQuat ||
                    !_gyroDataReceived
                )
                    return;

                // Apply the yaw offset to the absolute device orientation
                _targetCamQuat.multiplyQuaternions(
                    _yawOffsetQuat,
                    _latestDeviceQuat,
                );

                // Smooth interpolation
                camera.quaternion.slerp(_targetCamQuat, 0.25);

                // Sync OrbitControls target so joystick movement direction stays correct
                if (model) {
                    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(
                        camera.quaternion,
                    );
                    controls.target
                        .copy(camera.position)
                        .addScaledVector(dir, 0.5);
                }
            }

            // ── Panel helpers ──────────────────────────────────────────────
            window.closeInfoPanel = () => {
                document.getElementById("info-panel").style.display = "none";
            };

            window.toggleGhostMode = () => {
                ghostMode = !ghostMode;
                document.getElementById("ghost-btn").textContent = ghostMode
                    ? "PHYSICS: OFF (GHOST)"
                    : "PHYSICS: ON";
                document.getElementById("ghost-btn").style.background =
                    ghostMode
                        ? "rgba(255, 0, 0, 0.2)"
                        : "rgba(0, 229, 255, 0.2)";
                document.getElementById("ghost-btn").style.color = ghostMode
                    ? "#FF4444"
                    : "#00E5FF";
                document.getElementById("ghost-btn").style.borderColor =
                    ghostMode ? "#FF4444" : "#00E5FF";
            };

            // Allow tapping anywhere on the canvas / camera-zone to interact with hotspots/doors
            let pointerDownPos = new THREE.Vector2();
            document.addEventListener("pointerdown", (e) => {
                pointerDownPos.set(e.clientX, e.clientY);
            });
            let activeHotspot = null;

            document.addEventListener("pointerup", (e) => {
                // If dragged more than 10 pixels, it's a drag (looking around), not a tap.
                const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                if (dist > 10) return;

                if (e.target.id === "canvas" || e.target.id === "camera-zone") {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                    tapRaycaster.setFromCamera(mouse, camera);
                    const intersects = tapRaycaster.intersectObjects(
                        hotspots,
                        true,
                    );

                    if (intersects.length > 0) {
                        let hit = intersects[0].object;
                        if (hit.userData.title) {
                            activeHotspot = hit; 
                            document.getElementById("info-title").textContent = hit.userData.title;
                            document.getElementById("info-desc").textContent = hit.userData.desc;
                            document.getElementById("info-panel").style.display = "block";
                        }
                    } else if (model) {
                        // Handle Teleportation on Model Floor
                        const modelIntersects = tapRaycaster.intersectObject(model, true);
                        if (modelIntersects.length > 0) {
                            const hit = modelIntersects[0];
                            // Check if the surface is mostly flat/horizontal (it's a floor)
                            const normal = hit.face.normal.clone();
                            if (hit.object.matrixWorld) {
                                normal.transformDirection(hit.object.matrixWorld);
                            }
                            // y > 0.7 means it's pointing up (at least ~45 degrees)
                            if (normal.y > 0.7) {
                                // Start teleport
                                teleportStartPos.copy(camera.position);
                                // The new target is exactly the clicked point, plus eye height
                                teleportTarget = new THREE.Vector3(hit.point.x, hit.point.y + 1.6, hit.point.z);
                                teleportProgress = 0;
                                
                                // Show a marker briefly
                                if (!teleportMarker) {
                                    const markerGeom = new THREE.RingGeometry(0.2, 0.3, 32);
                                    const markerMat = new THREE.MeshBasicMaterial({ color: 0x00E5FF, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                                    teleportMarker = new THREE.Mesh(markerGeom, markerMat);
                                    teleportMarker.rotation.x = -Math.PI / 2;
                                    scene.add(teleportMarker);
                                }
                                teleportMarker.position.copy(hit.point);
                                teleportMarker.position.y += 0.05; // Slightly above ground
                                teleportMarker.material.opacity = 0.8;
                                teleportMarker.visible = true;
                            }
                        }
                    }
                }
            });

            // ── Scene Initialization ───────────────────────────────────────
            function init(modelUrl, mode) {
                controlMode = mode || "joystick";

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87ceeb); // Sky color

                camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000,
                );

                renderer = new THREE.WebGLRenderer({
                    canvas: document.getElementById("canvas"),
                    antialias: true,
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(
                    0xffffff,
                    0.5,
                );
                directionalLight.position.set(5, 10, 7.5);
                scene.add(directionalLight);

                // First-person look controls bound ONLY to the right half of the screen
                controls = new OrbitControls(
                    camera,
                    document.getElementById("camera-zone"),
                );
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.enableZoom = false;
                controls.enablePan = false;

                initJoystick();
                loadModel(modelUrl);
                animate();

                // Activate the selected control mode AFTER scene is initialised
                // Data arrives via postMessage from React Native (expo-sensors) —
                // no browser permission prompt needed at all.
                if (controlMode === "gyroscope") {
                    startGyroscope();
                }

                window.addEventListener("resize", onWindowResize);
            }

            // ── Joystick ───────────────────────────────────────────────────
            function initJoystick() {
                const zone = document.getElementById("joystick-zone");
                zone.style.pointerEvents = "auto";

                joystickManager = nipplejs.create({
                    zone: zone,
                    mode: "static",
                    position: { left: "50%", top: "50%" },
                    color: "#00E5FF",
                    size: 100,
                });

                joystickManager.on("move", (evt, data) => {
                    const angle = data.angle.radian;
                    const force = Math.min(data.force, 1);
                    // Nipplejs angles: 0=right, PI/2=up
                    moveForward = Math.sin(angle) * force * MOVE_SPEED;
                    moveRight = Math.cos(angle) * force * MOVE_SPEED;
                });

                joystickManager.on("end", () => {
                    moveForward = 0;
                    moveRight = 0;
                });
            }

            // ── Model Loading ──────────────────────────────────────────────
            function loadModel(url) {
                console.log("Starting to load interior model from:", url);
                const loader = new GLTFLoader();
                
                const dracoLoader = new DRACOLoader();
                dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                loader.setDRACOLoader(dracoLoader);
                
                loader.load(
                    url,
                    (gltf) => {
                        console.log("Model loaded successfully");
                        model = gltf.scene;
                        scene.add(model);

                        // Calculate bounding box to place camera
                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());

                        worldBounds = box.clone();
                        worldBounds.min.y -= 10;
                        worldBounds.max.y += 10;

                        // Spawn near the edge INSIDE the model's bounds at eye height
                        const startX = center.x;
                        const startY = box.min.y + 1.6;
                        const startZ = box.max.z - 2.0;

                        camera.position.set(startX, startY, startZ);
                        controls.target.set(startX, startY, startZ - 0.01);
                        controls.update();

                        // ── Create Interactive Hotspots (NPC) ──────────────────────
                        const createHotspot = (x, y, z, title, desc, color, category) => {
                            const npcGroup = new THREE.Group();
                            npcGroup.position.set(x, y, z);

                            const skinMat = new THREE.MeshBasicMaterial({ color: 0xffe0bd, depthTest: false });
                            const clothesMat = new THREE.MeshBasicMaterial({ color: 0x8a1538, depthTest: false }); // WMSU Crimson
                            const pantsMat = new THREE.MeshBasicMaterial({ color: 0x333333, depthTest: false });

                            // Torso
                            const torsoGeom = new THREE.BoxGeometry(0.4, 0.6, 0.2);
                            const torso = new THREE.Mesh(torsoGeom, clothesMat);
                            torso.position.y = 1.0;
                            torso.renderOrder = 999;
                            npcGroup.add(torso);

                            // Head
                            const headGroup = new THREE.Group();
                            headGroup.position.y = 1.45;

                            const headGeom = new THREE.SphereGeometry(0.18, 16, 16);
                            const head = new THREE.Mesh(headGeom, skinMat);
                            head.renderOrder = 999;
                            headGroup.add(head);

                            // Eyes
                            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000, depthTest: false });
                            const eyeGeom = new THREE.SphereGeometry(0.02, 8, 8);
                            const leftEye = new THREE.Mesh(eyeGeom, eyeMat);
                            leftEye.position.set(-0.06, 0.03, 0.16);
                            leftEye.renderOrder = 999;
                            const rightEye = new THREE.Mesh(eyeGeom, eyeMat);
                            rightEye.position.set(0.06, 0.03, 0.16);
                            rightEye.renderOrder = 999;
                            headGroup.add(leftEye);
                            headGroup.add(rightEye);

                            // Smile / Frown
                            const isRestricted = (category === "restricted");
                            const smileCurve = new THREE.EllipseCurve(0, -0.05, 0.08, 0.05, 0, Math.PI, false, 0);
                            const smilePoints = smileCurve.getPoints(10);
                            const smileGeom = new THREE.BufferGeometry().setFromPoints(smilePoints);
                            const smileLine = new THREE.Line(smileGeom, new THREE.LineBasicMaterial({ color: 0x000000, depthTest: false }));
                            
                            if (isRestricted) {
                                // Frown
                                smileLine.rotation.x = 0;
                                smileLine.position.set(0, -0.05, 0.17); // Adjust position for frown
                                
                                // Eyebrows
                                const eyebrowGeom = new THREE.BoxGeometry(0.06, 0.01, 0.01);
                                const leftEyebrow = new THREE.Mesh(eyebrowGeom, eyeMat);
                                leftEyebrow.position.set(-0.06, 0.07, 0.17);
                                leftEyebrow.rotation.z = -0.3; // Angle inwards
                                leftEyebrow.renderOrder = 999;
                                headGroup.add(leftEyebrow);
                                
                                const rightEyebrow = new THREE.Mesh(eyebrowGeom, eyeMat);
                                rightEyebrow.position.set(0.06, 0.07, 0.17);
                                rightEyebrow.rotation.z = 0.3; // Angle inwards
                                rightEyebrow.renderOrder = 999;
                                headGroup.add(rightEyebrow);
                            } else {
                                // Smile
                                smileLine.rotation.x = Math.PI;
                                smileLine.position.z = 0.17;
                            }
                            
                            smileLine.renderOrder = 999;
                            headGroup.add(smileLine);

                            npcGroup.add(headGroup);

                            // Arms
                            const armGeom = new THREE.BoxGeometry(0.12, 0.55, 0.12);
                            
                            const leftArmGroup = new THREE.Group();
                            leftArmGroup.position.set(0.28, 1.15, 0); // NPC's left arm (our right)
                            const leftArm = new THREE.Mesh(armGeom, clothesMat);
                            leftArm.position.set(0, -0.15, 0);
                            leftArm.renderOrder = 999;
                            leftArmGroup.add(leftArm);
                            
                            const rightArmGroup = new THREE.Group();
                            rightArmGroup.position.set(-0.28, 1.15, 0); // NPC's right arm (our left)
                            const rightArm = new THREE.Mesh(armGeom, clothesMat);
                            rightArm.position.set(0, -0.15, 0);
                            rightArm.renderOrder = 999;
                            rightArmGroup.add(rightArm);
                            
                            if (isRestricted) {
                                // Cross arms forming X in front of chest
                                leftArmGroup.rotation.x = -1.0;
                                rightArmGroup.rotation.x = -1.1; // Offset to prevent Z-fighting
                                leftArmGroup.rotation.z = 1.0;
                                rightArmGroup.rotation.z = -1.0;
                            }
                            
                            npcGroup.add(leftArmGroup);
                            npcGroup.add(rightArmGroup);

                            // Legs
                            const legGeom = new THREE.BoxGeometry(0.15, 0.7, 0.15);
                            const leftLeg = new THREE.Mesh(legGeom, pantsMat);
                            leftLeg.position.set(-0.1, 0.35, 0);
                            leftLeg.renderOrder = 999;
                            npcGroup.add(leftLeg);

                            const rightLeg = new THREE.Mesh(legGeom, pantsMat);
                            rightLeg.position.set(0.1, 0.35, 0);
                            rightLeg.renderOrder = 999;
                            npcGroup.add(rightLeg);

                            // Invisible Hitbox
                            const hitBoxGeom = new THREE.CylinderGeometry(0.5, 0.5, 1.8, 8);
                            const hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
                            const hitBox = new THREE.Mesh(hitBoxGeom, hitBoxMat);
                            hitBox.position.y = 0.9;
                            
                            // Create HTML Label
                            const labelDiv = document.createElement("div");
                            labelDiv.className = "floating-label";
                            if (isRestricted) {
                                labelDiv.classList.add("restricted");
                            }
                            labelDiv.innerHTML = title;
                            document.getElementById("floating-labels").appendChild(labelDiv);

                            hitBox.userData = { title, desc, category, isRestricted, parentGroup: npcGroup, rightArm: rightArmGroup, labelDiv: labelDiv };

                            npcGroup.add(hitBox);
                            scene.add(npcGroup);
                            hotspots.push(hitBox);
                        };

                        // Load Dynamic Hotspots from the Database
                        if (
                            window.buildingHotspots &&
                            window.buildingHotspots.length > 0
                        ) {
                            window.buildingHotspots.forEach((h) => {
                                createHotspot(
                                    h.x,
                                    h.y,
                                    h.z,
                                    h.title,
                                    h.desc || "",
                                    0x00e5ff,
                                    h.category
                                );
                            });
                        }

                        document.getElementById("loading").style.display =
                            "none";
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({ type: "loaded" }),
                        );
                    },
                    (progress) => {
                        if (progress.total > 0) {
                            const percent = Math.round(
                                (progress.loaded / progress.total) * 100,
                            );
                            const mb = (progress.loaded / 1048576).toFixed(1);
                            document.getElementById("loading").textContent =
                                `LOADING ${percent}% (${mb}MB)`;
                            window.ReactNativeWebView?.postMessage(
                                JSON.stringify({
                                    type: "progress",
                                    percent: percent,
                                }),
                            );
                        }
                    },
                    (error) => {
                        console.error("Model loading error:", error);
                        document.getElementById("loading").textContent =
                            "LOAD ERROR";
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({
                                type: "error",
                                message: error.message || "Unknown error",
                            }),
                        );
                    },
                );
            }

            // ── Animation Loop ─────────────────────────────────────────────
            const velocity = new THREE.Vector3();
            const direction = new THREE.Vector3();
            const tempVector = new THREE.Vector3();

            function animate() {
                requestAnimationFrame(animate);

                // Auto-detect nearby NPCs and update labels
                let minDist = 3.5;
                const time = performance.now() * 0.003;

                hotspots.forEach((h) => {
                    const npcGroup = h.userData.parentGroup;
                    const rightArm = h.userData.rightArm;
                    const labelDiv = h.userData.labelDiv;
                    
                    npcGroup.getWorldPosition(tempVector);
                    const dist = tempVector.distanceTo(camera.position);
                    
                    // Face camera
                    const targetPos = camera.position.clone();
                    targetPos.y = npcGroup.position.y;
                    npcGroup.lookAt(targetPos);
                    
                    // Wave and expand bubble if close
                    if (dist < minDist) {
                        if (!h.userData.isRestricted) {
                            rightArm.rotation.z = -2.0 + Math.sin(time * 1.5) * 0.5;
                            rightArm.rotation.x = Math.sin(time) * 0.2;
                        }
                        labelDiv.innerHTML = h.userData.title + (h.userData.desc ? "<br><span style='font-size:12px;font-weight:normal;'>" + h.userData.desc + "</span>" : "");
                    } else {
                        if (!h.userData.isRestricted) {
                            rightArm.rotation.z = 0;
                            rightArm.rotation.x = 0;
                        }
                        labelDiv.innerHTML = h.userData.title;
                    }

                    // Update label position
                    tempVector.y += 1.8; // Above head
                    tempVector.project(camera);
                    
                    if (tempVector.z > 1) {
                        labelDiv.style.opacity = "0";
                    } else {
                        labelDiv.style.opacity = "1";
                        const x = (tempVector.x *  0.5 + 0.5) * window.innerWidth;
                        const y = (tempVector.y * -0.5 + 0.5) * window.innerHeight;
                        labelDiv.style.left = `${x}px`;
                        labelDiv.style.top = `${y}px`;
                    }
                });

                if (model) {
                    // Apply gyroscope camera rotation FIRST (before movement processing)
                    if (controlMode === "gyroscope") {
                        applyGyroToCamera();
                    }

                    // In joystick mode: save the look-target offset so movement doesn't break the angle
                    const targetOffset =
                        controlMode !== "gyroscope"
                            ? controls.target.clone().sub(camera.position)
                            : null;

                    // Animate NPC hotspots
                    // Removed old spinning loop

                    // Handle Teleport Animation OR Gravity
                    if (teleportTarget) {
                        teleportProgress += TELEPORT_SPEED;
                        if (teleportProgress >= 1) {
                            camera.position.copy(teleportTarget);
                            teleportTarget = null;
                            if (teleportMarker) teleportMarker.visible = false;
                        } else {
                            // Smooth easing (ease-out cubic)
                            const t = teleportProgress;
                            const ease = 1 - Math.pow(1 - t, 3);
                            
                            // To prevent weird camera jitter while teleporting, we interpolate the position
                            // directly rather than applying gravity or movement.
                            camera.position.lerpVectors(teleportStartPos, teleportTarget, ease);
                            
                            // Fade out the marker
                            if (teleportMarker) {
                                teleportMarker.material.opacity = 0.8 * (1 - ease);
                            }
                        }
                    } else {
                        // Downward Raycast for Floor Height (Stairs / Gravity)
                        const origin = camera.position.clone();
                        origin.y += 1.0; // Cast from slightly above eye level to detect stairs
                        raycaster.set(origin, downVector);
                        const floorHits = raycaster.intersectObject(model, true);

                        const validHit = floorHits.find(hit => hit.point.y < camera.position.y + 0.5);

                        if (validHit && !ghostMode) {
                            const floorY = validHit.point.y;
                            const targetY = floorY + 1.6;
                            const diff = targetY - camera.position.y;
                            
                            if (diff > 0 && diff < 2.5) {
                                // Going up stairs (snap up smoothly)
                                camera.position.y += diff * 0.15;
                            } else if (diff < 0) {
                                // Going down stairs or falling
                                if (diff > -2.5) {
                                    // Small drop (like stairs), snap down smoothly
                                    camera.position.y += diff * 0.15;
                                } else {
                                    // Large drop (falling off ledge), fall at constant gravity speed
                                    camera.position.y -= 0.15;
                                }
                            }
                        }
                    }

                    // Movement (joystick input — works in both modes)
                    if (moveForward !== 0 || moveRight !== 0) {
                        const forwardVector = new THREE.Vector3(
                            0,
                            0,
                            -1,
                        ).applyQuaternion(camera.quaternion);
                        forwardVector.y = 0;
                        forwardVector.normalize();

                        const rightVector = new THREE.Vector3(
                            1,
                            0,
                            0,
                        ).applyQuaternion(camera.quaternion);
                        rightVector.y = 0;
                        rightVector.normalize();

                        let transX =
                            forwardVector.x * moveForward +
                            rightVector.x * moveRight;
                        let transZ =
                            forwardVector.z * moveForward +
                            rightVector.z * moveRight;

                        // Horizontal wall collision raycasts
                        const moveVector = new THREE.Vector3(transX, 0, transZ);
                        if (moveVector.lengthSq() > 0) {
                            const moveDir = moveVector.clone().normalize();

                            const isSolid = (hit) => {
                                let obj = hit.object;
                                while (obj) {
                                    if (obj.userData.isOpen) return false;
                                    obj = obj.parent;
                                }
                                return true;
                            };

                            // Eye-level check
                            raycaster.set(camera.position, moveDir);
                            const eyeHits = raycaster
                                .intersectObject(model, true)
                                .filter(isSolid);

                            // Knee-level check
                            const kneeOrigin = camera.position.clone();
                            kneeOrigin.y -= 1.1;
                            raycaster.set(kneeOrigin, moveDir);
                            const kneeHits = raycaster
                                .intersectObject(model, true)
                                .filter(isSolid);

                            const eyeDist =
                                eyeHits.length > 0
                                    ? eyeHits[0].distance
                                    : Infinity;
                            const kneeDist =
                                kneeHits.length > 0
                                    ? kneeHits[0].distance
                                    : Infinity;

                            if (
                                !ghostMode &&
                                Math.min(eyeDist, kneeDist) < COLLISION_DISTANCE
                            ) {
                                transX = 0;
                                transZ = 0;
                            }
                        }

                        camera.position.x += transX;
                        camera.position.z += transZ;

                        if (worldBounds) {
                            camera.position.clamp(
                                worldBounds.min,
                                worldBounds.max,
                            );
                        }
                    }

                    // In joystick mode: reapply look angle after position move
                    if (controlMode !== "gyroscope" && targetOffset) {
                        controls.target.copy(camera.position).add(targetOffset);
                    }
                }

                // Only call OrbitControls.update() in joystick mode —
                // in gyro mode it would overwrite the quaternion we just set
                if (controlMode !== "gyroscope") {
                    controls.update();
                }
                renderer.render(scene, camera);
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            // ── Dispose / Cleanup ──────────────────────────────────────────
            function dispose() {
                window.removeEventListener("resize", onWindowResize);
                // Gyro data came from RN postMessage — no DOM listener to remove
                gyroEnabled = false;
                if (model) {
                    scene.remove(model);
                    model.traverse((child) => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach((m) => m.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                }
                renderer.dispose();
                controls.dispose();
            }

            // ── Message Handlers (window + document for Android WebView) ──
            function handleIncomingMessage(data) {
                if (data.type === "init") {
                    window.buildingHotspots = data.hotspots || [];
                    init(data.modelUrl, data.controlMode || "joystick");
                } else if (data.type === "gyro_data") {
                    // Native sensor data bridged from React Native expo-sensors DeviceMotion
                    onGyroData(
                        data.alpha,
                        data.beta,
                        data.gamma,
                        data.orientAngle,
                    );
                } else if (data.type === "dispose") {
                    dispose();
                }
            }

            window.addEventListener("message", (event) => {
                try {
                    const data =
                        typeof event.data === "string"
                            ? JSON.parse(event.data)
                            : event.data;
                    handleIncomingMessage(data);
                } catch (e) {
                    console.error("Message parse error:", e);
                }
            });

            document.addEventListener("message", (event) => {
                try {
                    const data =
                        typeof event.data === "string"
                            ? JSON.parse(event.data)
                            : event.data;
                    handleIncomingMessage(data);
                } catch (e) {
                    console.error("Message parse error:", e);
                }
            });
        </script>
    </body>
</html>
