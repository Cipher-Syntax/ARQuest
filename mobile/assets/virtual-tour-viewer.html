                        const opacity = dist < 8 ? "1" : Math.max(0, 1 - (dist - 8) / 8).toFixed(2);
                        labelDiv.style.opacity = opacity;
                        const lx = (tempVector.x * 0.5 + 0.5) * window.innerWidth;
                        const ly = (tempVector.y * -0.5 + 0.5) * window.innerHeight;
                        labelDiv.style.left = `${lx}px`;
                        labelDiv.style.top = `${ly}px`;
                    }
                });

                // Broadcast camera position at ~10 FPS for mobile proximity HUD (Unit 30)
                const now = performance.now();
                if (now - lastCamBroadcastTime > 100) {
                    lastCamBroadcastTime = now;
                    window.ReactNativeWebView?.postMessage(
                        JSON.stringify({
                            type: "camera_position",
                            x: Number(camera.position.x.toFixed(2)),
                            y: Number(camera.position.y.toFixed(2)),
                            z: Number(camera.position.z.toFixed(2)),
                        })
                    );
                }


                if (model) {
                    // Apply gyroscope camera rotation FIRST (before movement processing)
                    if (controlMode === "gyroscope") {
                        applyGyroToCamera();
                    }

                    // In joystick mode: save the look-target offset so movement doesn't break the angle
                    const targetOffset =
                        controlMode !== "gyroscope"
                            ? controls.target.clone().sub(camera.position)
                            : null;

                    // Animate NPC hotspots
                    // Removed old spinning loop

                    // Handle Teleport Animation OR Gravity
                    if (teleportTarget) {
                        teleportProgress += TELEPORT_SPEED;
                        if (teleportProgress >= 1) {
                            camera.position.copy(teleportTarget);
                            teleportTarget = null;
                            if (teleportMarker) teleportMarker.visible = false;
                        } else {
                            // Smooth easing (ease-out cubic)
                            const t = teleportProgress;
                            const ease = 1 - Math.pow(1 - t, 3);
                            
                            // To prevent weird camera jitter while teleporting, we interpolate the position
                            // directly rather than applying gravity or movement.
                            camera.position.lerpVectors(teleportStartPos, teleportTarget, ease);
                            
                            // Fade out the marker
                            if (teleportMarker) {
                                teleportMarker.material.opacity = 0.8 * (1 - ease);
                            }
                        }
                    } else {
                        // Downward Raycast for Floor Height (Stairs / Gravity)
                        // Runs when moving OR airborne — gravity must apply even when joystick is released mid-air
                        const isActiveOrAirborne = (moveForward !== 0 || moveRight !== 0 || velocityY !== 0);
                        if (!ghostMode && isActiveOrAirborne) {
                            const origin = camera.position.clone();
                            origin.y += 0.8; // Cast from eye level downwards
                            floorRaycaster.set(origin, downVector);
                            const floorHits = floorRaycaster.intersectObject(model, true);

                            const validHit = floorHits.find(hit => hit.point.y < camera.position.y + 0.5);

                            if (validHit) {
                                const floorY = validHit.point.y;
                                const targetY = floorY + 1.6;
                                const diff = targetY - camera.position.y;
                                
                                if (diff > 0 && diff <= 0.6) {
                                    // Step Up: Only snap up if the obstacle is a real stair (< 0.6m)
                                    camera.position.y += diff * 0.25;
                                    velocityY = 0; // Grounded
                                } else if (diff < 0 && diff >= -0.6) {
                                    // Step Down: Small drop like walking down stairs
                                    camera.position.y += diff * 0.25;
                                    velocityY = 0; // Grounded
                                } else if (diff < -0.6) {
                                    // Free Fall: The floor is far below us
                                    velocityY -= 0.008; // Real Gravity acceleration
                                    camera.position.y += Math.max(diff, velocityY); // Fall but do not clip through floor
                                } else {
                                    // Hitting a Wall/Ladder: obstacle is > 0.6m high (too tall to step up)
                                    if (camera.position.y > targetY + 0.1) {
                                        velocityY -= 0.008;
                                        camera.position.y += velocityY;
                                    } else {
                                        velocityY = 0; // Grounded against base of wall
                                    }
                                }
                            } else {
                                // Laser missed interior geometry: stay grounded on the campus base plane
                                const baseGroundY = box.min.y + 1.6;
                                if (camera.position.y < box.min.y - 1.0) {
                                    // Player fell into the void -> Auto-respawn to safe location!
                                    if (window.safeSpawnPos) {
                                        camera.position.copy(window.safeSpawnPos);
                                        velocityY = 0;
                                    }
                                } else if (camera.position.y > baseGroundY) {
                                    velocityY -= 0.008;
                                    camera.position.y = Math.max(baseGroundY, camera.position.y + velocityY);
                                    if (camera.position.y === baseGroundY) velocityY = 0;
                                } else {
                                    camera.position.y = baseGroundY;
                                    velocityY = 0;
                                }
                            }
                        }
                    }

                    // Movement (joystick input — works in both modes)
                    if (moveForward !== 0 || moveRight !== 0) {
                        const forwardVector = new THREE.Vector3(
                            0,
                            0,
                            -1,
                        ).applyQuaternion(camera.quaternion);
                        forwardVector.y = 0;
                        forwardVector.normalize();

                        const rightVector = new THREE.Vector3(
                            1,
                            0,
                            0,
                        ).applyQuaternion(camera.quaternion);
                        rightVector.y = 0;
                        rightVector.normalize();

                        let transX =
                            forwardVector.x * moveForward +
                            rightVector.x * moveRight;
                        let transZ =
                            forwardVector.z * moveForward +
                            rightVector.z * moveRight;

                        // Horizontal wall collision raycasts (only when actively moving)
                        const moveVector = new THREE.Vector3(transX, 0, transZ);
                        if (moveVector.lengthSq() > 0.0001) {
                            const moveDir = moveVector.clone().normalize();

                            const isSolid = (hit) => {
                                let obj = hit.object;
                                while (obj) {
                                    if (obj.userData.isOpen) return false;
                                    obj = obj.parent;
                                }
                                return true;
                            };

                            // Eye-level check (bounded to 1.0m)
                            wallRaycaster.set(camera.position, moveDir);
                            const eyeHits = wallRaycaster
                                .intersectObject(model, true)
                                .filter(isSolid);

                            // Waist-level check (bounded to 1.0m)
                            const waistOrigin = camera.position.clone();
                            waistOrigin.y -= 0.8;
                            wallRaycaster.set(waistOrigin, moveDir);
                            const waistHits = wallRaycaster
                                .intersectObject(model, true)
                                .filter(isSolid);

                            const eyeDist =
                                eyeHits.length > 0
                                    ? eyeHits[0].distance
                                    : Infinity;
                            const waistDist =
                                waistHits.length > 0
                                    ? waistHits[0].distance
                                    : Infinity;

                            if (
                                !ghostMode &&
                                Math.min(eyeDist, waistDist) < COLLISION_DISTANCE
                            ) {
                                // ── Wall Sliding (axis-split collision) ──────────────────
                                // Instead of a hard full-stop, test each axis independently.
                                // This lets the player slide along walls when moving at an angle.
                                let canX = true;
                                let canZ = true;

                                // Test X-only movement
                                if (Math.abs(transX) > 0.0001) {
                                    const xDir = new THREE.Vector3(Math.sign(transX), 0, 0);
                                    wallRaycaster.set(camera.position, xDir);
                                    const xEye = wallRaycaster.intersectObject(model, true).filter(isSolid);
                                    wallRaycaster.set(waistOrigin, xDir);
                                    const xWaist = wallRaycaster.intersectObject(model, true).filter(isSolid);
                                    const xDist = Math.min(
                                        xEye.length > 0 ? xEye[0].distance : Infinity,
                                        xWaist.length > 0 ? xWaist[0].distance : Infinity
                                    );
                                    if (xDist < COLLISION_DISTANCE) canX = false;
                                }

                                // Test Z-only movement
                                if (Math.abs(transZ) > 0.0001) {
                                    const zDir = new THREE.Vector3(0, 0, Math.sign(transZ));
                                    wallRaycaster.set(camera.position, zDir);
                                    const zEye = wallRaycaster.intersectObject(model, true).filter(isSolid);
                                    wallRaycaster.set(waistOrigin, zDir);
                                    const zWaist = wallRaycaster.intersectObject(model, true).filter(isSolid);
                                    const zDist = Math.min(
                                        zEye.length > 0 ? zEye[0].distance : Infinity,
                                        zWaist.length > 0 ? zWaist[0].distance : Infinity
                                    );
                                    if (zDist < COLLISION_DISTANCE) canZ = false;
                                }

                                if (!canX) transX = 0;
                                if (!canZ) transZ = 0;
                            }
                        }

                        camera.position.x += transX;
                        camera.position.z += transZ;

                        if (worldBounds) {
                            camera.position.clamp(
                                worldBounds.min,
                                worldBounds.max,
                            );
                        }
                    }

                    // In joystick mode: reapply look angle after position move
                    if (controlMode !== "gyroscope" && targetOffset) {
                        controls.target.copy(camera.position).add(targetOffset);
                    }
                }

                // Only call OrbitControls.update() in joystick mode —
                // in gyro mode it would overwrite the quaternion we just set
                if (controlMode !== "gyroscope") {
                    controls.update();
                }
                renderer.render(scene, camera);
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            // ── Dispose / Cleanup ──────────────────────────────────────────
            function dispose() {
                if (animFrameId) {
                    cancelAnimationFrame(animFrameId);
                    animFrameId = null;
                }
                window.removeEventListener("resize", onWindowResize);
                // Gyro data came from RN postMessage — no DOM listener to remove
                gyroEnabled = false;
                if (model && scene) {
                    scene.remove(model);
                    model.traverse((child) => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach((m) => m.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                }
                if (hotspots && hotspots.length > 0) {
                    hotspots.forEach((h) => {
                        if (h.userData.labelDiv && h.userData.labelDiv.parentNode) {
                            h.userData.labelDiv.parentNode.removeChild(
                                h.userData.labelDiv,
                            );
                        }
                        if (h.userData.bubbleDiv && h.userData.bubbleDiv.parentNode) {
                            h.userData.bubbleDiv.parentNode.removeChild(
                                h.userData.bubbleDiv,
                            );
                        }
                        if (scene && h.userData.parentGroup) {
                            scene.remove(h.userData.parentGroup);
                        }
                    });
                    hotspots = [];
                }
                if (portalBadges && portalBadges.length > 0) {
                    portalBadges.forEach((p) => {
                        if (p.userData && p.userData.labelDiv && p.userData.labelDiv.parentNode) {
                            p.userData.labelDiv.parentNode.removeChild(p.userData.labelDiv);
                        }
                        if (scene) scene.remove(p);
                    });
                    portalBadges = [];
                }
                if (renderer) renderer.dispose();
                if (controls) controls.dispose();
            }

            function refreshPortalBadges() {
                if (portalBadges && portalBadges.length > 0) {
                    portalBadges.forEach((p) => {
                        if (p.userData && p.userData.labelDiv && p.userData.labelDiv.parentNode) {
                            p.userData.labelDiv.parentNode.removeChild(p.userData.labelDiv);
                        }
                        if (scene) scene.remove(p);
                    });
                    portalBadges = [];
                }
                if (window.panoramaScenes && window.panoramaScenes.length > 0) {
                    window.panoramaScenes.forEach((sceneData) => {
                        createPortalBadge(sceneData);
                    });
                }
            }


            function resetToEntrance() {
                if (!window.safeSpawnPos || !camera || !controls) return;
                camera.position.copy(window.safeSpawnPos);
                velocityY = 0;
                moveForward = 0;
                moveRight = 0;

                // Run 8-direction raycast to find the most open facing direction
                const facingRaycaster = new THREE.Raycaster();
                facingRaycaster.far = 4.0;
                const spawnEye = camera.position.clone();
                const DIRECTIONS_8 = [0, 45, 90, 135, 180, 225, 270, 315];
                let bestAngle = 0;
                let bestDist = -1;
                DIRECTIONS_8.forEach((deg) => {
                    const rad = THREE.MathUtils.degToRad(deg);
                    const dir = new THREE.Vector3(Math.sin(rad), 0, Math.cos(rad));
                    facingRaycaster.set(spawnEye, dir);
                    const hits = facingRaycaster.intersectObject(model, true);
                    const dist = hits.length > 0 ? hits[0].distance : facingRaycaster.far;
                    if (dist > bestDist) {
                        bestDist = dist;
                        bestAngle = rad;
                    }
                });
                const facingTarget = new THREE.Vector3(
                    camera.position.x + Math.sin(bestAngle),
                    camera.position.y,
                    camera.position.z + Math.cos(bestAngle),
                );
                controls.target.copy(facingTarget);
                controls.update();

                // Smooth fade-in overlay transition
                let fadeEl = document.getElementById("spawn-fade");
                if (!fadeEl) {
                    fadeEl = document.createElement("div");
                    fadeEl.id = "spawn-fade";
                    document.body.appendChild(fadeEl);
                }
                fadeEl.classList.remove("faded");
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        fadeEl.classList.add("faded");
                        fadeEl.addEventListener(
                            "transitionend",
                            () => fadeEl.remove(),
                            { once: true },
                        );
                    });
                });
            }

            // ── Message Handlers (window + document for Android WebView) ──
            function handleIncomingMessage(data) {
                if (data.type === "model_chunk_start") {
                    if (data.controlMode) controlMode = data.controlMode;
                    ensureScene(data.controlMode || "joystick");
                    window.buildingHotspots = data.hotspots || window.buildingHotspots || [];
                    window.panoramaScenes = (data.panoramaScenes || window.panoramaScenes || []).filter(
                        (s) => s.anchor_x != null && s.anchor_z != null
                    );
                    chunkCollector = {
                        totalChunks: data.totalChunks,
                        chunks: new Array(data.totalChunks),
                        receivedCount: 0,
                        fallbackUrl: data.fallbackUrl,
                    };
                    document.getElementById("loading").textContent = "LOADING FROM STORAGE...";
                } else if (data.type === "model_chunk") {
                    if (chunkCollector.chunks && !chunkCollector.chunks[data.index]) {
                        chunkCollector.chunks[data.index] = data.chunk;
                        chunkCollector.receivedCount++;
                        const pct = Math.round((chunkCollector.receivedCount / chunkCollector.totalChunks) * 100);
                        document.getElementById("loading").textContent = `LOADING FROM STORAGE... ${pct}%`;
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({ type: "progress", percent: pct }),
                        );
                        if (chunkCollector.receivedCount === chunkCollector.totalChunks) {
                            const fullBase64 = chunkCollector.chunks.join("");
                            chunkCollector.chunks = null; // free memory immediately
                            parseBase64Model(fullBase64, chunkCollector.fallbackUrl);
                        }
                    }
                } else if (data.type === "init") {
                    window.buildingHotspots = data.hotspots || [];
                    // Unit 30: Store panorama scene anchors for portal badge spawning
                    window.panoramaScenes = (data.panoramaScenes || []).filter(
                        (s) => s.anchor_x != null && s.anchor_z != null
                    );
                    init(data.modelUrl, data.controlMode || "joystick");
                } else if (data.type === "update_panorama_scenes") {
                    // Update portal badges dynamically without tearing down Three.js model
                    window.panoramaScenes = (data.panoramaScenes || []).filter(
                        (s) => s.anchor_x != null && s.anchor_z != null
                    );
                    if (scene && model) {
                        refreshPortalBadges();
                    }
                } else if (data.type === "gyro_data") {
                    // Native sensor data bridged from React Native expo-sensors DeviceMotion
                    onGyroData(
                        data.alpha,
                        data.beta,
                        data.gamma,
                        data.orientAngle,
                    );
                } else if (data.type === "reset_entrance") {
                    resetToEntrance();
                } else if (data.type === "set_control_mode") {
                    controlMode = data.mode || "joystick";
                    if (data.mode === "gyroscope") {
                        startGyroscope();
                    } else {
                        gyroEnabled = false;
                        const gyroInd = document.getElementById("gyro-indicator");
                        if (gyroInd) gyroInd.style.display = "none";
                        const camZone = document.getElementById("camera-zone");
                        if (camZone) camZone.style.pointerEvents = "auto";
                        const inst = document.getElementById("instructions");
                        if (inst) inst.innerHTML = "Drag right side to look<br />Use joystick to move";
                        if (controls) controls.enabled = true;
                    }
                } else if (data.type === "set_speed") {
                    MOVE_SPEED = Number(data.speed) || 0.18;
                } else if (data.type === "set_sensitivity") {
                    if (controls) controls.rotateSpeed = Number(data.sensitivity) || 0.85;
                } else if (data.type === "set_labels_visible") {
                    const labelsEl = document.getElementById("floating-labels");
                    if (labelsEl) labelsEl.style.display = data.visible ? "block" : "none";
                } else if (data.type === "set_ghost_mode") {
                    ghostMode = Boolean(data.enabled);
                } else if (data.type === "dispose") {
                    dispose();
                }
            }

            window.addEventListener("message", (event) => {
                try {
                    const data =
                        typeof event.data === "string"
                            ? JSON.parse(event.data)
                            : event.data;
                    handleIncomingMessage(data);
                } catch (e) {
                    console.error("Message parse error:", e);
                }
            });

            document.addEventListener("message", (event) => {
                try {
                    const data =
                        typeof event.data === "string"
                            ? JSON.parse(event.data)
                            : event.data;
                    handleIncomingMessage(data);
                } catch (e) {
                    console.error("Message parse error:", e);
                }
            });
        </script>
    </body>
</html>
