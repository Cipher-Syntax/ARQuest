<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #F9F9F9; }
        #canvas { width: 100%; height: 100%; display: block; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #B21830; font-weight: bold; font-family: system-ui; }
    </style>
</head>
<body>
    <div id="loading">Loading 3D Model...</div>
    <canvas id="canvas"></canvas>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        let scene, camera, renderer, controls, model;
        
        function init(modelUrl) {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 1;
            controls.maxDistance = 50;
            
            loadModel(modelUrl);
            animate();
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function loadModel(url) {
            console.log('Starting to load model from:', url);
            const loader = new GLTFLoader();
            loader.load(
                url,
                (gltf) => {
                    console.log('Model loaded successfully');
                    model = gltf.scene;
                    scene.add(model);
                    
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    model.position.sub(center);
                    
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.5;
                    
                    // Shift the camera target slightly down to push the model UP on the screen
                    const yOffset = -maxDim * 0.15; 
                    
                    camera.position.set(cameraZ, cameraZ * 0.5 + yOffset, cameraZ);
                    camera.lookAt(0, yOffset, 0);
                    
                    controls.target.set(0, yOffset, 0);
                    controls.update();
                    
                    document.getElementById('loading').style.display = 'none';
                    window.ReactNativeWebView?.postMessage(JSON.stringify({ type: 'loaded' }));
                },
                (progress) => {
                    if (progress.total > 0) {
                        const percent = Math.round((progress.loaded / progress.total) * 100);
                        const mb = (progress.loaded / 1048576).toFixed(1);
                        document.getElementById('loading').textContent = `Loading ${percent}% (${mb}MB)`;
                        window.ReactNativeWebView?.postMessage(JSON.stringify({ 
                            type: 'progress', 
                            percent: percent 
                        }));
                    }
                },
                (error) => {
                    console.error('Model loading error:', error);
                    document.getElementById('loading').textContent = 'Failed to load model';
                    window.ReactNativeWebView?.postMessage(JSON.stringify({ type: 'error', message: error.message || 'Unknown error' }));
                }
            );
        }
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function dispose() {
            window.removeEventListener('resize', onWindowResize);
            if (model) {
                scene.remove(model);
                model.traverse((child) => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                });
            }
            renderer.dispose();
            controls.dispose();
        }
        
        window.addEventListener('message', (event) => {
            try {
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                console.log('Received message:', data);
                if (data.type === 'init') {
                    init(data.modelUrl);
                } else if (data.type === 'dispose') {
                    dispose();
                }
            } catch (e) {
                console.error('Message parse error:', e);
            }
        });
        
        document.addEventListener('message', (event) => {
            try {
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                console.log('Received message:', data);
                if (data.type === 'init') {
                    init(data.modelUrl);
                } else if (data.type === 'dispose') {
                    dispose();
                }
            } catch (e) {
                console.error('Message parse error:', e);
            }
        });
    </script>
</body>
</html>
