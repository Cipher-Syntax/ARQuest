<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: transparent;
            }
            #canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
                }
            }
        </script>
        <script type="module">
            import * as THREE from "three";
            import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

            let scene, camera, renderer, model;
            let initialCameraDistance = 0;
            let initialCameraY = 0;

            function init(modelUrl) {
                scene = new THREE.Scene();

                camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000,
                );
                camera.position.set(0, 2, 5);

                renderer = new THREE.WebGLRenderer({
                    canvas: document.getElementById("canvas"),
                    antialias: true,
                    alpha: true,
                    preserveDrawingBuffer: true,
                });
                renderer.setClearColor(0x000000, 0);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(
                    0xffffff,
                    0.8,
                );
                directionalLight.position.set(5, 10, 7.5);
                scene.add(directionalLight);

                loadModel(modelUrl);
                animate();

                window.addEventListener("resize", onWindowResize);
            }

            function loadModel(url) {
                const loader = new GLTFLoader();
                loader.load(
                    url,
                    (gltf) => {
                        model = gltf.scene;
                        scene.add(model);

                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());

                        model.position.sub(center);

                        const maxDim = Math.max(size.x, size.y, size.z);
                        const fov = camera.fov * (Math.PI / 180);
                        let cameraZ =
                            Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.0; // More space
                        camera.position.set(cameraZ, cameraZ * 0.3, cameraZ);
                        camera.lookAt(0, 0, 0);

                        // Store initial camera distance for rotation
                        initialCameraDistance = Math.sqrt(
                            camera.position.x * camera.position.x +
                                camera.position.z * camera.position.z,
                        );
                        initialCameraY = camera.position.y;

                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({ type: "loaded" }),
                        );
                    },
                    undefined,
                    (error) => {
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({
                                type: "error",
                                message: error.message || "Unknown error",
                            }),
                        );
                    },
                );
            }

            function animate() {
                requestAnimationFrame(animate);

                // Rotate camera around Y-axis only (turntable rotation)
                if (model && initialCameraDistance > 0) {
                    const time = Date.now() * 0.0005;
                    camera.position.x = Math.sin(time) * initialCameraDistance;
                    camera.position.z = Math.cos(time) * initialCameraDistance;
                    camera.position.y = initialCameraY; // Keep Y constant
                    camera.lookAt(0, 0, 0);
                }

                renderer.render(scene, camera);
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function dispose() {
                window.removeEventListener("resize", onWindowResize);
                if (model) {
                    scene.remove(model);
                    model.traverse((child) => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach((m) => m.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                }
                renderer.dispose();
            }

            window.addEventListener("message", (event) => {
                try {
                    const data =
                        typeof event.data === "string"
                            ? JSON.parse(event.data)
                            : event.data;
                    if (data.type === "init") {
                        init(data.modelUrl);
                    } else if (data.type === "dispose") {
                        dispose();
                    } else if (data.type === "request_snapshot") {
                        if (renderer && scene && camera)
                            renderer.render(scene, camera);
                        const base64 = document
                            .getElementById("canvas")
                            .toDataURL("image/png");
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({ type: "snapshot", data: base64 }),
                        );
                    }
                } catch (e) {
                    console.error("Message parse error:", e);
                }
            });

            document.addEventListener("message", (event) => {
                try {
                    const data =
                        typeof event.data === "string"
                            ? JSON.parse(event.data)
                            : event.data;
                    if (data.type === "init") {
                        init(data.modelUrl);
                    } else if (data.type === "dispose") {
                        dispose();
                    } else if (data.type === "request_snapshot") {
                        if (renderer && scene && camera)
                            renderer.render(scene, camera);
                        const base64 = document
                            .getElementById("canvas")
                            .toDataURL("image/png");
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({ type: "snapshot", data: base64 }),
                        );
                    }
                } catch (e) {
                    console.error("Message parse error:", e);
                }
            });
        </script>
    </body>
</html>
