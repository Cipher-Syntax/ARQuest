<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #000;
            }
            #canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #fff;
                font-family: system-ui;
                font-size: 18px;
            }
            #hotspots {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
                max-width: 90%;
                z-index: 10;
            }
            .hotspot-btn {
                background: rgba(138, 21, 56, 0.9);
                color: #fff;
                border: 2px solid #fff;
                padding: 12px 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: bold;
            }
            #floating-labels {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 5;
            }
            .floating-label {
                position: absolute;
                background: rgba(0, 229, 255, 0.9);
                color: #000;
                font-weight: bold;
                padding: 6px 14px;
                border-radius: 14px;
                font-family: system-ui, sans-serif;
                font-size: 14px;
                pointer-events: none;
                transform: translate(-50%, -100%);
                opacity: 0;
                white-space: nowrap;
                box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                transition: opacity 0.2s;
                text-align: center;
            }
            .floating-label::after {
                content: '';
                position: absolute;
                top: 100%;
                left: 50%;
                margin-left: -6px;
                border-width: 6px;
                border-style: solid;
                border-color: rgba(0, 229, 255, 0.9) transparent transparent transparent;
            }
            .floating-label.restricted {
                background: rgba(220, 53, 69, 0.9);
                color: #fff;
            }
            .floating-label.restricted::after {
                border-color: rgba(220, 53, 69, 0.9) transparent transparent transparent;
            }
        </style>
    </head>
    <body>
        <div id="loading">Initializing...</div>
        <canvas id="canvas"></canvas>
        <div id="floating-labels"></div>
        <div id="hotspots"></div>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
                }
            }
        </script>
        <script type="module">
            import * as THREE from "three";

            let scene, camera, renderer, sphere, texture;
            let lon = 0,
                lat = 0,
                isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let currentHotspots = [];
            let hotspotMeshes = [];
            let fov = 75;
            let maxFov = 75;
            let maxLat = 0;

            function init(imageUrl, hotspots) {
                currentHotspots = hotspots || [];

                if (sphere) {
                    scene.remove(sphere);
                    sphere.geometry.dispose();
                    sphere.material.dispose();
                    if (texture) texture.dispose();
                }

                hotspotMeshes.forEach((mesh) => {
                    if (mesh.userData && mesh.userData.parentGroup) {
                        scene.remove(mesh.userData.parentGroup);
                        mesh.userData.parentGroup.children.forEach(child => {
                            if (child.geometry) child.geometry.dispose();
                            if (child.material) child.material.dispose();
                        });
                    } else {
                        scene.remove(mesh);
                        mesh.geometry.dispose();
                        mesh.material.dispose();
                    }
                });
                hotspotMeshes = [];
                document.getElementById("floating-labels").innerHTML = "";

                if (!scene) {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(
                        fov,
                        window.innerWidth / window.innerHeight,
                        0.1,
                        1000,
                    );
                    camera.position.set(0, 0, 0.1);
                    renderer = new THREE.WebGLRenderer({
                        canvas: document.getElementById("canvas"),
                        antialias: true,
                    });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    setupControls();
                    window.addEventListener("resize", () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });
                }

                document.getElementById("loading").style.display = "block";

                const loader = new THREE.TextureLoader();
                loader.setCrossOrigin("anonymous");
                loader.load(
                    imageUrl,
                    (loadedTexture) => {
                        texture = loadedTexture;
                        // Better quality filtering
                        texture.minFilter = THREE.LinearMipmapLinearFilter;
                        texture.magFilter = THREE.LinearFilter;

                        // Dynamically calculate cylinder height to perfectly match image aspect ratio
                        const imgWidth = texture.image.width || 4000;
                        const imgHeight = texture.image.height || 1000;
                        const radius = 500;
                        const circumference = 2 * Math.PI * radius;
                        const cylinderHeight =
                            (imgHeight / imgWidth) * circumference;

                        const geometry = new THREE.CylinderGeometry(
                            radius,
                            radius,
                            cylinderHeight,
                            60,
                            1,
                            true,
                        );
                        geometry.scale(-1, 1, 1);

                        const material = new THREE.MeshBasicMaterial({
                            map: texture,
                        });
                        sphere = new THREE.Mesh(geometry, material);
                        scene.add(sphere);

                        // Calculate Max FOV to prevent seeing above/below the cylinder
                        maxFov =
                            2 *
                            Math.atan(cylinderHeight / 2 / radius) *
                            (180 / Math.PI);
                        fov = Math.min(75, maxFov); // start at 75 or maxFov
                        camera.fov = fov;
                        camera.updateProjectionMatrix();

                        maxLat = Math.max(0, (maxFov - fov) / 2);
                        lat = 0;

                        document.getElementById("loading").style.display =
                            "none";
                        create3DHotspots();
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({ type: "loaded" }),
                        );
                        if (!renderer.info.render.frame) animate();
                    },
                    undefined,
                    (error) => {
                        document.getElementById("loading").textContent =
                            "Failed to load";
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({
                                type: "error",
                                message: "Load failed",
                            }),
                        );
                    },
                );
            }

            function setupControls() {
                const canvas = document.getElementById("canvas");
                let initialPinchDistance = 0;

                canvas.addEventListener("touchstart", (e) => {
                    if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
                    } else if (e.touches.length === 1) {
                        isDragging = true;
                        previousMousePosition = {
                            x: e.touches[0].clientX,
                            y: e.touches[0].clientY,
                        };
                    }
                });

                canvas.addEventListener("touchmove", (e) => {
                    if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const delta = distance - initialPinchDistance;
                        fov -= delta * 0.1;
                        fov = Math.max(30, Math.min(maxFov, fov));
                        camera.fov = fov;
                        camera.updateProjectionMatrix();
                        initialPinchDistance = distance;

                        // Update maxLat based on new fov
                        maxLat = Math.max(0, (maxFov - fov) / 2);
                        lat = Math.max(-maxLat, Math.min(maxLat, lat));
                    } else if (isDragging && e.touches.length === 1) {
                        const deltaX =
                            e.touches[0].clientX - previousMousePosition.x;
                        const deltaY =
                            e.touches[0].clientY - previousMousePosition.y;
                        lon -= deltaX * 0.1;
                        lat += deltaY * 0.1;
                        lat = Math.max(-maxLat, Math.min(maxLat, lat));
                        previousMousePosition = {
                            x: e.touches[0].clientX,
                            y: e.touches[0].clientY,
                        };
                    }
                });

                canvas.addEventListener("touchend", () => {
                    isDragging = false;
                });

                canvas.addEventListener("click", (e) => {
                    const raycaster = new THREE.Raycaster();
                    const mouse = new THREE.Vector2(
                        (e.clientX / window.innerWidth) * 2 - 1,
                        -(e.clientY / window.innerHeight) * 2 + 1,
                    );
                    raycaster.setFromCamera(mouse, camera);
                    const intersects =
                        raycaster.intersectObjects(hotspotMeshes);
                    if (intersects.length > 0) {
                        const hotspot = intersects[0].object.userData.hotspot;
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({
                                type: "hotspot_clicked",
                                target_scene_id: hotspot.target_scene_id,
                            }),
                        );
                    }
                });
            }

            function create3DHotspots() {
                currentHotspots.forEach((hotspot) => {
                    const phi = THREE.MathUtils.degToRad(90 - hotspot.pitch);
                    const theta = THREE.MathUtils.degToRad(hotspot.yaw - 90); // Offset by 90 to match Web

                    const distance = 300;
                    const x = distance * Math.sin(phi) * Math.cos(theta);
                    const y = distance * Math.cos(phi);
                    const z = distance * Math.sin(phi) * Math.sin(theta);

                    const dotGroup = new THREE.Group();
                    dotGroup.position.set(x, y, z);
                    dotGroup.userData = { originalY: y };
                    
                    // The main red dot
                    const dotGeom = new THREE.SphereGeometry(8, 32, 32);
                    const isRestricted = (hotspot.category === "restricted");
                    const dotColor = isRestricted ? 0xff0000 : 0xff0000; 
                    const dotMat = new THREE.MeshBasicMaterial({ color: dotColor });
                    const dot = new THREE.Mesh(dotGeom, dotMat);
                    dotGroup.add(dot);
                    
                    // A larger, semi-transparent sphere for a glowing pulse effect
                    const glowGeom = new THREE.SphereGeometry(14, 32, 32);
                    const glowMat = new THREE.MeshBasicMaterial({ 
                        color: dotColor,
                        transparent: true,
                        opacity: 0.5
                    });
                    const glow = new THREE.Mesh(glowGeom, glowMat);
                    dotGroup.add(glow);

                    // Hitbox for raycaster (clicking)
                    const hitBoxGeom = new THREE.SphereGeometry(20, 16, 16);
                    const hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
                    const hitBox = new THREE.Mesh(hitBoxGeom, hitBoxMat);
                    
                    hitBox.userData = { 
                        hotspot: hotspot, 
                        labelId: "label-" + hotspotMeshes.length,
                        parentGroup: dotGroup,
                        glowMesh: glow,
                        isHotspot: true,
                        isRestricted: isRestricted
                    };
                    dotGroup.add(hitBox);
                    
                    // Make it always face the camera center (0,0,0)
                    dotGroup.lookAt(0, 0, 0);

                    scene.add(dotGroup);
                    hotspotMeshes.push(hitBox);

                    // Create Floating Label
                    const labelContainer =
                        document.getElementById("floating-labels");
                    const labelDiv = document.createElement("div");
                    labelDiv.className = "floating-label";
                    if (isRestricted) {
                        labelDiv.classList.add("restricted");
                    }
                    labelDiv.id = hitBox.userData.labelId;
                    labelDiv.textContent =
                        hotspot.label ||
                        hotspot.target_scene_title ||
                        "Next Scene";
                    labelContainer.appendChild(labelDiv);
                });
            }

            function renderHotspots() {
                const container = document.getElementById("hotspots");
                container.innerHTML = "";
                currentHotspots.forEach((hotspot) => {
                    const btn = document.createElement("button");
                    btn.className = "hotspot-btn";
                    btn.textContent = hotspot.label;
                    btn.onclick = () => {
                        window.ReactNativeWebView?.postMessage(
                            JSON.stringify({
                                type: "hotspot_clicked",
                                target_scene_id: hotspot.target_scene_id,
                            }),
                        );
                    };
                    container.appendChild(btn);
                });
            }

            function animate() {
                requestAnimationFrame(animate);
                const phi = THREE.MathUtils.degToRad(90 - lat);
                const theta = THREE.MathUtils.degToRad(lon - 90); // Offset by 90 to match Web
                
                const cameraTarget = new THREE.Vector3(
                    500 * Math.sin(phi) * Math.cos(theta),
                    500 * Math.cos(phi),
                    500 * Math.sin(phi) * Math.sin(theta)
                );
                camera.lookAt(cameraTarget);

                // Animation and floating labels
                const time = Date.now() * 0.005;
                const cameraDirection = new THREE.Vector3();
                camera.getWorldDirection(cameraDirection);

                hotspotMeshes.forEach((mesh, index) => {
                    if (mesh.userData.isHotspot) {
                        const group = mesh.userData.parentGroup;
                        const glowMesh = mesh.userData.glowMesh;
                        
                        // Check if the user is looking at this hotspot
                        const hotspotDirection = group.position.clone().normalize();
                        const angle = cameraDirection.angleTo(hotspotDirection);
                        
                        // Float slightly for "breathing" effect
                        group.position.y = group.userData.originalY + Math.sin(time * 2 + index) * 5.0;

                        // Pulse glow effect
                        const scale = 1.0 + Math.abs(Math.sin(time * 3 + index)) * 0.3;
                        glowMesh.scale.set(scale, scale, scale);
                        
                        if (angle < 0.4) {
                            // User is looking directly at it! Make glow more opaque
                            glowMesh.material.opacity = 0.8;
                            
                            const label = document.getElementById(mesh.userData.labelId);
                            const title = mesh.userData.hotspot.label || mesh.userData.hotspot.target_scene_title || "Next Scene";
                            const desc = mesh.userData.hotspot.desc || mesh.userData.hotspot.description || "";
                            if (label) label.innerHTML = title + (desc ? "<br><span style='font-size:12px;font-weight:normal;'>" + desc + "</span>" : "");
                        } else {
                            // Idle
                            glowMesh.material.opacity = 0.5;
                            
                            const label = document.getElementById(mesh.userData.labelId);
                            const title = mesh.userData.hotspot.label || mesh.userData.hotspot.target_scene_title || "Next Scene";
                            if (label) label.innerHTML = title;
                        }
                    }

                    // 3D to 2D projection for floating label
                    let pos;
                    if (mesh.userData.isHotspot) {
                        pos = mesh.userData.parentGroup.position.clone();
                        pos.y += 30.0; // Above dot
                    } else {
                        pos = mesh.position.clone();
                    }
                    pos.project(camera);

                    const label = document.getElementById(
                        mesh.userData.labelId,
                    );
                    if (label) {
                        if (
                            pos.z > 1 ||
                            pos.x < -1.1 ||
                            pos.x > 1.1 ||
                            pos.y < -1.1 ||
                            pos.y > 1.1
                        ) {
                            label.style.opacity = "0"; // Hide smoothly if behind camera or far off screen
                        } else {
                            label.style.opacity = "1";
                            const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
                            const y = (pos.y * -0.5 + 0.5) * window.innerHeight;
                            label.style.left = x + "px";
                            label.style.top = y + "px";
                        }
                    }
                });

                renderer.render(scene, camera);
            }

            window.addEventListener("message", (event) => {
                const data =
                    typeof event.data === "string"
                        ? JSON.parse(event.data)
                        : event.data;
                if (data.type === "init") init(data.imageUrl, data.hotspots);
            });

            document.addEventListener("message", (event) => {
                const data =
                    typeof event.data === "string"
                        ? JSON.parse(event.data)
                        : event.data;
                if (data.type === "init") init(data.imageUrl, data.hotspots);
            });
        </script>
    </body>
</html>
