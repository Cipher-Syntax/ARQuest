<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>360° Virtual Walkthrough</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                overflow: hidden;
                background: #09090b;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                user-select: none;
                -webkit-user-select: none;
            }
            #canvas {
                width: 100vw;
                height: 100vh;
                display: block;
                cursor: grab;
            }
            #canvas:active {
                cursor: grabbing;
            }
            #canvas.pointer-cursor {
                cursor: pointer;
            }

            /* Loading Overlay */
            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #ffffff;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.3px;
                background: rgba(15, 17, 23, 0.88);
                padding: 12px 22px;
                border-radius: 24px;
                pointer-events: none;
                z-index: 30;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                display: flex;
                align-items: center;
                gap: 10px;
                border: 1px solid rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(10px);
            }
            .spinner {
                width: 18px;
                height: 18px;
                border: 2px solid rgba(255, 255, 255, 0.2);
                border-top-color: #8A1538;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            /* Google Street View Top Header Card */
            #top-header {
                position: absolute;
                top: 18px;
                left: 20px;
                display: flex;
                flex-direction: column;
                gap: 4px;
                z-index: 20;
                pointer-events: none;
            }
            .header-glass-card {
                pointer-events: auto;
                background: rgba(15, 17, 23, 0.82);
                color: #ffffff;
                padding: 10px 18px;
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.14);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(12px);
                max-width: 380px;
            }
            .building-tag {
                font-size: 10px;
                font-weight: 800;
                letter-spacing: 1.2px;
                text-transform: uppercase;
                color: rgba(255, 255, 255, 0.65);
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 2px;
            }
            .building-tag .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #8A1538;
            }
            .scene-title {
                font-size: 15px;
                font-weight: 700;
                color: #ffffff;
                letter-spacing: -0.2px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .interaction-hint {
                font-size: 11px;
                color: rgba(255, 255, 255, 0.6);
                margin-top: 3px;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            /* Google Street View Floating Toolbar (Right Side) */
            #controls-toolbar {
                position: absolute;
                top: 20px;
                right: 20px;
                display: flex;
                flex-direction: column;
                gap: 6px;
                z-index: 20;
            }
            .ctrl-box {
                background: rgba(15, 17, 23, 0.85);
                border-radius: 10px;
                border: 1px solid rgba(255, 255, 255, 0.14);
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
                backdrop-filter: blur(10px);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .ctrl-btn {
                width: 38px;
                height: 38px;
                background: transparent;
                color: #ffffff;
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 15px;
                font-weight: 700;
                transition: all 0.15s ease;
            }
            .ctrl-btn:hover {
                background: rgba(255, 255, 255, 0.15);
                color: #ffffff;
            }
            .ctrl-btn:active {
                background: #8A1538;
            }
            .ctrl-divider {
                width: 100%;
                height: 1px;
                background: rgba(255, 255, 255, 0.1);
            }

            /* Google Street View Compass Dial */
            #compass-widget {
                width: 38px;
                height: 38px;
                background: rgba(15, 17, 23, 0.85);
                border-radius: 50%;
                border: 1px solid rgba(255, 255, 255, 0.15);
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
                backdrop-filter: blur(10px);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                position: relative;
                margin-bottom: 4px;
                transition: transform 0.15s ease;
            }
            #compass-widget:hover {
                transform: scale(1.08);
                border-color: rgba(255, 255, 255, 0.3);
            }
            #compass-needle {
                width: 22px;
                height: 22px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: transform 0.05s linear;
            }

            /* Floating 3D Hover Tooltip */
            #floating-labels {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 10;
            }
            .floating-label {
                position: absolute;
                background: rgba(15, 17, 23, 0.92);
                color: #ffffff;
                font-weight: 700;
                padding: 6px 14px;
                border-radius: 18px;
                font-size: 12px;
                pointer-events: none;
                transform: translate(-50%, -100%);
                opacity: 0;
                white-space: nowrap;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
                transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
                text-align: center;
                border: 1px solid rgba(255, 255, 255, 0.8);
                display: flex;
                align-items: center;
                gap: 6px;
                backdrop-filter: blur(8px);
            }
            .floating-label .arrow-icon {
                color: #ff476f;
                font-size: 12px;
            }
            .floating-label::after {
                content: '';
                position: absolute;
                top: 100%;
                left: 50%;
                margin-left: -5px;
                border-width: 5px;
                border-style: solid;
                border-color: rgba(15, 17, 23, 0.92) transparent transparent transparent;
            }

            /* Google Street View Connected Rooms / Hotspots Dock */
            #hotspots-dock {
                position: absolute;
                bottom: 56px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
                max-width: 88vw;
                z-index: 20;
                pointer-events: none;
            }
            .hotspot-chip {
                pointer-events: auto;
                background: rgba(15, 17, 23, 0.88);
                color: #ffffff;
                border: 1px solid rgba(255, 255, 255, 0.22);
                padding: 8px 18px;
                border-radius: 22px;
                cursor: pointer;
                font-size: 13px;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 8px;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
                backdrop-filter: blur(10px);
                transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .hotspot-chip:hover {
                background: #8A1538;
                border-color: rgba(255, 255, 255, 0.6);
                transform: translateY(-2px) scale(1.04);
                box-shadow: 0 8px 24px rgba(138, 21, 56, 0.6);
            }
            .hotspot-chip .chip-arrow {
                color: #ff476f;
                font-size: 13px;
                transition: transform 0.15s ease;
            }
            .hotspot-chip:hover .chip-arrow {
                color: #ffffff;
                transform: translateX(2px);
            }

            /* Google Street View Collapsible Bottom Filmstrip Drawer */
            #bottom-dock {
                position: absolute;
                bottom: 16px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                z-index: 20;
                transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }
            #toggle-filmstrip-btn {
                background: rgba(15, 17, 23, 0.85);
                color: #ffffff;
                border: 1px solid rgba(255, 255, 255, 0.16);
                border-radius: 20px;
                padding: 6px 14px;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.3px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 6px;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
                backdrop-filter: blur(10px);
                transition: all 0.15s ease;
            }
            #toggle-filmstrip-btn:hover {
                background: #8A1538;
                border-color: rgba(255, 255, 255, 0.3);
            }
            #filmstrip-container {
                display: none;
                margin-top: 10px;
                background: rgba(12, 14, 20, 0.92);
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-radius: 14px;
                padding: 10px 14px;
                box-shadow: 0 10px 32px rgba(0, 0, 0, 0.55);
                backdrop-filter: blur(14px);
                max-width: 90vw;
                overflow-x: auto;
                scrollbar-width: thin;
                scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
            }
            #filmstrip-container::-webkit-scrollbar {
                height: 5px;
            }
            #filmstrip-container::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.3);
                border-radius: 4px;
            }
            #filmstrip-cards {
                display: flex;
                gap: 10px;
                align-items: center;
            }
            .filmstrip-card {
                width: 105px;
                flex-shrink: 0;
                cursor: pointer;
                border-radius: 8px;
                overflow: hidden;
                border: 1.5px solid rgba(255, 255, 255, 0.15);
                background: #18181b;
                transition: all 0.18s ease;
                display: flex;
                flex-direction: column;
            }
            .filmstrip-card:hover {
                border-color: #ffffff;
                transform: translateY(-2px);
            }
            .filmstrip-card.active {
                border-color: #8A1538;
                box-shadow: 0 0 12px rgba(138, 21, 56, 0.7);
            }
            .filmstrip-card img {
                width: 100%;
                height: 54px;
                object-fit: cover;
                display: block;
            }
            .filmstrip-card-title {
                padding: 4px 6px;
                font-size: 10px;
                font-weight: 600;
                color: #ffffff;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                text-align: center;
                background: rgba(0, 0, 0, 0.6);
            }

            /* Cinematic Dolly Crossfade Transition Overlay */
            #crossfade-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #000000;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.35s ease;
                z-index: 25;
            }
        </style>
    </head>
    <body>
        <!-- Google Street View Top Header Card -->
        <div id="top-header">
            <div class="header-glass-card">
                <div class="building-tag">
                    <span class="dot"></span>
                    <span id="building-name-text">ARQuest Campus Tour</span>
                </div>
                <div class="scene-title" id="scene-title-text">
                    360° Panorama Walkthrough
                </div>
                <div class="interaction-hint">
                    <span>🖱️ Drag to look</span>
                    <span>•</span>
                    <span>👆 Click floor chevrons to walk</span>
                </div>
            </div>
        </div>

        <!-- Google Street View Controls Panel (Right Side) -->
        <div id="controls-toolbar">
            <!-- Compass Needle Dial -->
            <div id="compass-widget" title="Face North (Click to Reorient)">
                <div id="compass-needle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <polygon points="12,2 16,12 12,9 8,12" fill="#e11d48"/>
                        <polygon points="12,22 16,12 12,9 8,12" fill="#ffffff" opacity="0.8"/>
                    </svg>
                </div>
            </div>

            <!-- Zoom & View Tools -->
            <div class="ctrl-box">
                <button class="ctrl-btn" id="btn-zoom-in" title="Zoom In (+)">+</button>
                <div class="ctrl-divider"></div>
                <button class="ctrl-btn" id="btn-zoom-out" title="Zoom Out (−)">−</button>
                <div class="ctrl-divider"></div>
                <button class="ctrl-btn" id="btn-reset" title="Reset to Entrance (Start Scene)">🔄</button>
                <div class="ctrl-divider"></div>
                <button class="ctrl-btn" id="btn-fullscreen" title="Toggle Fullscreen">⛶</button>
            </div>
        </div>

        <!-- Connected Rooms / Hotspots Navigation Chips -->
        <div id="hotspots-dock"></div>

        <!-- Collapsible Bottom Filmstrip Drawer -->
        <div id="bottom-dock">
            <button id="toggle-filmstrip-btn" title="Show or hide scenes strip">
                <span>🖼️ Browse Scenes</span>
                <span id="filmstrip-arrow">▴</span>
            </button>
            <div id="filmstrip-container">
                <div id="filmstrip-cards"></div>
            </div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <span id="loading-text">Loading 360° Scene...</span>
        </div>
        <div id="crossfade-overlay"></div>
        <canvas id="canvas"></canvas>
        <div id="floating-labels"></div>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
                }
            }
        </script>
        <script type="module">
            import * as THREE from "three";

            let scene, camera, renderer, sphereMesh, texture, animFrameId;
            let lon = 0,
                lat = 0,
                isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let velocityLon = 0,
                velocityLat = 0;
            let mouseMovedDistance = 0;
            let currentHotspots = [];
            let allScenesList = [];
            let currentSceneTitle = "";
            let hotspotGroups = [];
            let clickableHitboxes = [];
            let hoveredHitbox = null;
            let rippleMeshes = [];
            let fov = 75;
            let defaultFov = 75;
            let minFov = 30;
            let maxFov = 85;
            let chevronTexture = null;
            let isTransitioning = false;
            let filmstripOpen = false;

            // Generate authentic Google Street View Ground Chevron Texture
            function createGoogleStreetViewChevronTexture() {
                const canvas = document.createElement("canvas");
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext("2d");

                ctx.clearRect(0, 0, 256, 256);

                // 1. Soft Ambient Floor Shadow
                const shadowGrad = ctx.createRadialGradient(128, 134, 40, 128, 134, 108);
                shadowGrad.addColorStop(0, "rgba(0, 0, 0, 0.35)");
                shadowGrad.addColorStop(0.8, "rgba(0, 0, 0, 0.15)");
                shadowGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
                ctx.beginPath();
                ctx.arc(128, 134, 108, 0, Math.PI * 2);
                ctx.fillStyle = shadowGrad;
                ctx.fill();

                // 2. Google Street View Frosted Glass Disc Body
                const discGrad = ctx.createRadialGradient(128, 128, 20, 128, 128, 96);
                discGrad.addColorStop(0, "rgba(255, 255, 255, 0.65)");
                discGrad.addColorStop(0.7, "rgba(255, 255, 255, 0.45)");
                discGrad.addColorStop(1, "rgba(255, 255, 255, 0.22)");

                ctx.beginPath();
                ctx.arc(128, 128, 96, 0, Math.PI * 2);
                ctx.fillStyle = discGrad;
                ctx.fill();

                // Disc rim
                ctx.lineWidth = 3;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
                ctx.stroke();

                // 3. Crisp High-Contrast Forward Double Chevron Arrow
                ctx.lineJoin = "round";
                ctx.lineCap = "round";

                // Function to draw chevron with shadow & stroke for 100% ground visibility
                function drawChevron(yOffset) {
                    ctx.beginPath();
                    ctx.moveTo(128, yOffset);
                    ctx.lineTo(176, yOffset + 48);
                    ctx.lineTo(162, yOffset + 62);
                    ctx.lineTo(128, yOffset + 28);
                    ctx.lineTo(94, yOffset + 62);
                    ctx.lineTo(80, yOffset + 48);
                    ctx.closePath();

                    // Dark outline for contrast on white tile floors
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = "rgba(0, 0, 0, 0.35)";
                    ctx.stroke();

                    // Pure white fill
                    ctx.fillStyle = "#ffffff";
                    ctx.fill();
                }

                drawChevron(56);
                drawChevron(112);

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.needsUpdate = true;
                return tex;
            }

            chevronTexture = createGoogleStreetViewChevronTexture();

            let currentImageUrl = "";
            let currentLoadRequestId = 0;

            function createFallbackGridTexture(title) {
                const canvas = document.createElement("canvas");
                canvas.width = 2048;
                canvas.height = 1024;
                const ctx = canvas.getContext("2d");

                // Deep modern dark gradient
                const grad = ctx.createLinearGradient(0, 0, 0, 1024);
                grad.addColorStop(0, "#080c14");
                grad.addColorStop(0.48, "#141c2c");
                grad.addColorStop(0.52, "#101624");
                grad.addColorStop(1, "#070a12");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 2048, 1024);

                // Horizon accent band
                ctx.strokeStyle = "rgba(138, 21, 56, 0.45)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 512);
                ctx.lineTo(2048, 512);
                ctx.stroke();

                // Spatial coordinate grid
                ctx.strokeStyle = "rgba(255, 255, 255, 0.07)";
                ctx.lineWidth = 1.5;
                for (let x = 0; x <= 2048; x += 128) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, 1024);
                    ctx.stroke();
                }
                for (let y = 0; y <= 1024; y += 64) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(2048, y);
                    ctx.stroke();
                }

                // Centered Room Title
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 44px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(title || "360° Panorama Studio", 1024, 460);

                ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
                ctx.font = "24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
                ctx.fillText("Interactive Walkthrough • Click chevrons or chips to navigate", 1024, 550);

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.needsUpdate = true;
                return tex;
            }

            function cleanupHotspots() {
                hotspotGroups.forEach((group) => {
                    scene.remove(group);
                    group.traverse((child) => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) child.material.dispose();
                    });
                });
                hotspotGroups = [];
                clickableHitboxes = [];
                hoveredHitbox = null;
                const labels = document.getElementById("floating-labels");
                if (labels) labels.innerHTML = "";
            }

            function renderHotspotChips() {
                const container = document.getElementById("hotspots-dock");
                if (!container) return;
                container.innerHTML = "";
                if (!currentHotspots || currentHotspots.length === 0) return;

                currentHotspots.forEach((hotspot) => {
                    const chip = document.createElement("button");
                    chip.className = "hotspot-chip";
                    chip.innerHTML = `<span class="chip-arrow">➔</span> <span>${hotspot.label || hotspot.target_scene_title || "Next Room"}</span>`;
                    chip.onclick = (e) => {
                        e.stopPropagation();
                        triggerGoogleStreetViewStep(hotspot);
                    };
                    container.appendChild(chip);
                });
            }

            function applyTextureToSphere(loadedTexture, isFallback = false) {
                if (sphereMesh) {
                    scene.remove(sphereMesh);
                    sphereMesh.geometry.dispose();
                    sphereMesh.material.dispose();
                    sphereMesh = null;
                    if (texture) {
                        texture.dispose();
                        texture = null;
                    }
                }
                texture = loadedTexture;

                const maxAnisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 16;
                texture.anisotropy = maxAnisotropy;
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                texture.generateMipmaps = false;
                texture.colorSpace = THREE.SRGBColorSpace;

                const imgWidth = texture.image ? (texture.image.width || 4000) : 4000;
                const imgHeight = texture.image ? (texture.image.height || 2000) : 2000;
                const aspectRatio = imgWidth / imgHeight;

                let geometry;
                if (aspectRatio >= 1.6 && aspectRatio <= 2.4) {
                    geometry = new THREE.SphereGeometry(500, 64, 40);
                    geometry.scale(-1, 1, 1);
                } else {
                    const radius = 500;
                    const circumference = 2 * Math.PI * radius;
                    const cylinderHeight = (imgHeight / imgWidth) * circumference;
                    geometry = new THREE.CylinderGeometry(radius, radius, cylinderHeight, 64, 1, true);
                    geometry.scale(-1, 1, 1);
                }

                const material = new THREE.MeshBasicMaterial({ map: texture });
                sphereMesh = new THREE.Mesh(geometry, material);
                scene.add(sphereMesh);

                fov = defaultFov;
                camera.fov = fov;
                camera.updateProjectionMatrix();
                lat = 0;
                lon = 0;
                velocityLon = 0;
                velocityLat = 0;

                const loadingEl = document.getElementById("loading");
                if (loadingEl) loadingEl.style.display = "none";

                createGoogleStreetViewHotspots();
                renderHotspotChips();
                renderFilmstrip();

                isTransitioning = false;
                const crossfade = document.getElementById("crossfade-overlay");
                if (crossfade) crossfade.style.opacity = "0";

                notifyParent({ type: isFallback ? "fallback_loaded" : "loaded" });
                if (!renderer.info.render.frame) animate();
            }

            function init(imageUrl, hotspots, sceneTitle, buildingName, allScenes) {
                currentHotspots = hotspots || [];
                currentSceneTitle = sceneTitle || "360° Scene";
                if (allScenes && Array.isArray(allScenes)) {
                    allScenesList = allScenes;
                }
                renderFilmstrip();
                renderHotspotChips();

                if (sceneTitle) {
                    const badge = document.getElementById("scene-title-text");
                    if (badge) badge.textContent = sceneTitle;
                }
                if (buildingName) {
                    const bText = document.getElementById("building-name-text");
                    if (bText) bText.textContent = buildingName;
                }

                // If texture is already loaded for this same image URL, just rebuild hotspots without reloading image
                if (sphereMesh && texture && currentImageUrl === imageUrl) {
                    createGoogleStreetViewHotspots();
                    renderHotspotChips();
                    renderFilmstrip();
                    isTransitioning = false;
                    const loadingEl = document.getElementById("loading");
                    if (loadingEl) loadingEl.style.display = "none";
                    const crossfade = document.getElementById("crossfade-overlay");
                    if (crossfade) crossfade.style.opacity = "0";
                    return;
                }

                currentImageUrl = imageUrl;
                cleanupHotspots();

                if (!scene) {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(
                        fov,
                        window.innerWidth / window.innerHeight,
                        0.1,
                        1100,
                    );
                    camera.position.set(0, 0, 0.1);
                    renderer = new THREE.WebGLRenderer({
                        canvas: document.getElementById("canvas"),
                        antialias: true,
                        powerPreference: "high-performance",
                    });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                    renderer.outputColorSpace = THREE.SRGBColorSpace;

                    setupControls();
                    setupToolbarEvents();
                    window.addEventListener("resize", () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });
                }

                const loadingEl = document.getElementById("loading");
                if (loadingEl) {
                    loadingEl.style.display = "flex";
                    document.getElementById("loading-text").textContent = "Loading 360° Scene...";
                }

                const requestId = ++currentLoadRequestId;
                const timeoutId = setTimeout(() => {
                    if (requestId === currentLoadRequestId && !sphereMesh) {
                        console.warn("Panorama load timeout reached. Applying fallback grid...");
                        applyTextureToSphere(createFallbackGridTexture(currentSceneTitle), true);
                    }
                }, 4000);

                if (!imageUrl) {
                    clearTimeout(timeoutId);
                    applyTextureToSphere(createFallbackGridTexture(currentSceneTitle), true);
                    return;
                }

                function loadPanoramaTexture(url, retryWithProxy = true) {
                    const loader = new THREE.TextureLoader();
                    loader.setCrossOrigin("anonymous");
                    loader.load(
                        url,
                        (loadedTexture) => {
                            clearTimeout(timeoutId);
                            if (requestId !== currentLoadRequestId) {
                                loadedTexture.dispose();
                                return;
                            }
                            applyTextureToSphere(loadedTexture, false);
                        },
                        undefined,
                        (error) => {
                            const isPrivate = url.includes("localhost") || url.includes("127.0.0.1") || url.includes("10.") || url.includes("192.168.");
                            if (retryWithProxy && url.startsWith("http") && !isPrivate && !url.includes("images.weserv.nl")) {
                                console.warn("Direct texture load failed. Retrying via CORS proxy fallback...");
                                const proxyUrl = `https://images.weserv.nl/?url=${encodeURIComponent(url)}&output=jpg&q=100&we`;
                                loadPanoramaTexture(proxyUrl, false);
                                return;
                            }
                            clearTimeout(timeoutId);
                            console.warn("Texture load failed. Applying schematic grid fallback...", error);
                            if (requestId === currentLoadRequestId) {
                                applyTextureToSphere(createFallbackGridTexture(currentSceneTitle), true);
                            }
                        },
                    );
                }

                loadPanoramaTexture(imageUrl, true);
            }

            function setupToolbarEvents() {
                // Compass click -> smoothly face North (lon = 0)
                document.getElementById("compass-widget").onclick = () => {
                    const duration = 300;
                    const startLon = lon;
                    const startTime = performance.now();
                    function animCompass(now) {
                        const prog = Math.min((now - startTime) / duration, 1.0);
                        const ease = prog * (2 - prog);
                        lon = startLon * (1 - ease);
                        if (prog < 1.0) requestAnimationFrame(animCompass);
                    }
                    requestAnimationFrame(animCompass);
                };

                // Zoom In
                document.getElementById("btn-zoom-in").onclick = () => {
                    fov = Math.max(minFov, fov - 10);
                    camera.fov = fov;
                    camera.updateProjectionMatrix();
                };

                // Zoom Out
                document.getElementById("btn-zoom-out").onclick = () => {
                    fov = Math.min(maxFov, fov + 10);
                    camera.fov = fov;
                    camera.updateProjectionMatrix();
                };

                // Reset View (Reset to Start Scene & forward orientation)
                document.getElementById("btn-reset").onclick = () => {
                    lon = 0;
                    lat = 0;
                    velocityLon = 0;
                    velocityLat = 0;
                    fov = defaultFov;
                    camera.fov = fov;
                    camera.updateProjectionMatrix();

                    notifyParent({ type: "reset_to_start" });
                };

                // Fullscreen
                document.getElementById("btn-fullscreen").onclick = () => {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else {
                        document.exitFullscreen().catch(() => {});
                    }
                };

                // Toggle Bottom Filmstrip Drawer
                const toggleBtn = document.getElementById("toggle-filmstrip-btn");
                const filmstripBox = document.getElementById("filmstrip-container");
                const arrowSpan = document.getElementById("filmstrip-arrow");
                toggleBtn.onclick = () => {
                    filmstripOpen = !filmstripOpen;
                    const hotspotsDock = document.getElementById("hotspots-dock");
                    if (filmstripOpen) {
                        filmstripBox.style.display = "block";
                        arrowSpan.textContent = "▾";
                        if (hotspotsDock) hotspotsDock.style.bottom = "165px";
                    } else {
                        filmstripBox.style.display = "none";
                        arrowSpan.textContent = "▴";
                        if (hotspotsDock) hotspotsDock.style.bottom = "56px";
                    }
                };
            }

            function setupControls() {
                const canvas = document.getElementById("canvas");

                // Mouse Drag with Momentum Tracking
                canvas.addEventListener("mousedown", (e) => {
                    isDragging = true;
                    velocityLon = 0;
                    velocityLat = 0;
                    mouseMovedDistance = 0;
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                window.addEventListener("mousemove", (e) => {
                    if (isDragging) {
                        const deltaX = e.clientX - previousMousePosition.x;
                        const deltaY = e.clientY - previousMousePosition.y;
                        mouseMovedDistance += Math.abs(deltaX) + Math.abs(deltaY);

                        velocityLon = -deltaX * 0.12;
                        velocityLat = deltaY * 0.12;

                        lon += velocityLon;
                        lat += velocityLat;
                        lat = Math.max(-85, Math.min(85, lat));
                        previousMousePosition = { x: e.clientX, y: e.clientY };
                    }

                    // Hover Raycasting for Ground Chevron Glow & Pointer
                    if (!isDragging && clickableHitboxes.length > 0) {
                        const raycaster = new THREE.Raycaster();
                        const mouse = new THREE.Vector2(
                            (e.clientX / window.innerWidth) * 2 - 1,
                            -(e.clientY / window.innerHeight) * 2 + 1,
                        );
                        raycaster.setFromCamera(mouse, camera);
                        const intersects = raycaster.intersectObjects(clickableHitboxes);

                        if (intersects.length > 0) {
                            canvas.classList.add("pointer-cursor");
                            const hit = intersects[0].object;
                            if (hoveredHitbox !== hit) {
                                if (hoveredHitbox) setChevronHoverState(hoveredHitbox, false);
                                hoveredHitbox = hit;
                                setChevronHoverState(hoveredHitbox, true);
                            }
                        } else {
                            canvas.classList.remove("pointer-cursor");
                            if (hoveredHitbox) {
                                setChevronHoverState(hoveredHitbox, false);
                                hoveredHitbox = null;
                            }
                        }
                    }
                });

                window.addEventListener("mouseup", () => {
                    isDragging = false;
                });

                // Smooth Mouse Wheel Zoom
                canvas.addEventListener("wheel", (e) => {
                    e.preventDefault();
                    fov += e.deltaY * 0.05;
                    fov = Math.max(minFov, Math.min(maxFov, fov));
                    camera.fov = fov;
                    camera.updateProjectionMatrix();
                }, { passive: false });

                // Touch Drag & Pinch Zoom
                let initialPinchDistance = 0;
                canvas.addEventListener("touchstart", (e) => {
                    if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
                    } else if (e.touches.length === 1) {
                        isDragging = true;
                        velocityLon = 0;
                        velocityLat = 0;
                        mouseMovedDistance = 0;
                        previousMousePosition = {
                            x: e.touches[0].clientX,
                            y: e.touches[0].clientY,
                        };
                    }
                });

                canvas.addEventListener("touchmove", (e) => {
                    if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const delta = distance - initialPinchDistance;
                        fov -= delta * 0.1;
                        fov = Math.max(minFov, Math.min(maxFov, fov));
                        camera.fov = fov;
                        camera.updateProjectionMatrix();
                        initialPinchDistance = distance;
                    } else if (isDragging && e.touches.length === 1) {
                        const deltaX = e.touches[0].clientX - previousMousePosition.x;
                        const deltaY = e.touches[0].clientY - previousMousePosition.y;
                        mouseMovedDistance += Math.abs(deltaX) + Math.abs(deltaY);

                        velocityLon = -deltaX * 0.12;
                        velocityLat = deltaY * 0.12;

                        lon += velocityLon;
                        lat += velocityLat;
                        lat = Math.max(-85, Math.min(85, lat));
                        previousMousePosition = {
                            x: e.touches[0].clientX,
                            y: e.touches[0].clientY,
                        };
                    }
                });

                canvas.addEventListener("touchend", () => {
                    isDragging = false;
                });

                // Single Click on Floor Chevron
                canvas.addEventListener("click", (e) => {
                    if (mouseMovedDistance > 10 || isTransitioning) return;

                    const raycaster = new THREE.Raycaster();
                    const mouse = new THREE.Vector2(
                        (e.clientX / window.innerWidth) * 2 - 1,
                        -(e.clientY / window.innerHeight) * 2 + 1,
                    );
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(clickableHitboxes);
                    if (intersects.length > 0) {
                        const hotspot = intersects[0].object.userData.hotspot;
                        triggerGoogleStreetViewStep(hotspot, intersects[0].point);
                    }
                });

                // Double Click anywhere on ground to step towards that doorway
                canvas.addEventListener("dblclick", (e) => {
                    if (isTransitioning || clickableHitboxes.length === 0) return;

                    const raycaster = new THREE.Raycaster();
                    const mouse = new THREE.Vector2(
                        (e.clientX / window.innerWidth) * 2 - 1,
                        -(e.clientY / window.innerHeight) * 2 + 1,
                    );
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(clickableHitboxes);
                    if (intersects.length > 0) {
                        const hotspot = intersects[0].object.userData.hotspot;
                        triggerGoogleStreetViewStep(hotspot, intersects[0].point);
                        return;
                    }

                    // Otherwise find closest hotspot in view direction
                    const camDir = new THREE.Vector3();
                    camera.getWorldDirection(camDir);

                    let closestHotspot = null;
                    let closestAngle = Infinity;

                    clickableHitboxes.forEach((mesh) => {
                        const hsDir = mesh.position.clone().normalize();
                        const angle = camDir.angleTo(hsDir);
                        if (angle < closestAngle && angle < 0.8) {
                            closestAngle = angle;
                            closestHotspot = mesh.userData.hotspot;
                        }
                    });

                    if (closestHotspot) {
                        triggerGoogleStreetViewStep(closestHotspot);
                    }
                });
            }

            function setChevronHoverState(hitboxMesh, isHovered) {
                const group = hitboxMesh.userData.parentGroup;
                const label = document.getElementById(hitboxMesh.userData.labelId);
                const chevron = hitboxMesh.userData.chevronMesh;

                if (isHovered) {
                    if (chevron) chevron.scale.set(1.12, 1.12, 1.12);
                    if (label) {
                        label.style.opacity = "1";
                        label.style.transform = "translate(-50%, -100%) scale(1.05)";
                    }
                } else {
                    if (chevron) chevron.scale.set(1.0, 1.0, 1.0);
                    if (label) {
                        label.style.opacity = "0";
                        label.style.transform = "translate(-50%, -100%) scale(1.0)";
                    }
                }
            }

            // Google Street View Forward Dolly & Crossfade Walkthrough Animation
            function triggerGoogleStreetViewStep(hotspot, clickPoint) {
                if (isTransitioning) return;
                isTransitioning = true;

                if (clickPoint) {
                    spawnClickRipple(clickPoint);
                }

                const rawTargetId = hotspot.target_scene_id || hotspot.target_scene;
                const targetSceneId = (typeof rawTargetId === "object" && rawTargetId) ? rawTargetId.id : rawTargetId;
                if (!targetSceneId) {
                    console.warn("Hotspot has no target scene:", hotspot);
                    isTransitioning = false;
                    return;
                }

                const startFov = camera.fov;
                const targetFov = 38; // Dolly zoom forward into room
                const duration = 280;
                const startTime = performance.now();

                const crossfade = document.getElementById("crossfade-overlay");
                if (crossfade) crossfade.style.opacity = "0.45";

                function animateStep(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1.0);
                    const ease = progress * (2 - progress); // smooth quadratic ease-out

                    camera.fov = startFov + (targetFov - startFov) * ease;
                    camera.updateProjectionMatrix();

                    if (progress < 1.0) {
                        requestAnimationFrame(animateStep);
                    } else {
                        notifyParent({
                            type: "hotspot_clicked",
                            target_scene_id: targetSceneId,
                            label: hotspot.label,
                        });

                        setTimeout(() => {
                            if (crossfade) crossfade.style.opacity = "0";
                            camera.fov = defaultFov;
                            camera.updateProjectionMatrix();
                            isTransitioning = false;
                        }, 200);
                    }
                }
                requestAnimationFrame(animateStep);
            }

            function spawnClickRipple(point) {
                const geom = new THREE.RingGeometry(2, 8, 32);
                const mat = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.85,
                    side: THREE.DoubleSide,
                });
                const ripple = new THREE.Mesh(geom, mat);
                ripple.position.copy(point);
                ripple.lookAt(camera.position);
                scene.add(ripple);

                rippleMeshes.push({
                    mesh: ripple,
                    startTime: performance.now(),
                    duration: 380,
                });
            }

            function createGoogleStreetViewHotspots() {
                cleanupHotspots();
                currentHotspots.forEach((hotspot) => {
                    const yaw = hotspot.yaw || 0;
                    const pitch = (hotspot.pitch !== undefined && hotspot.pitch !== 0) ? hotspot.pitch : -18;
                    const phi = THREE.MathUtils.degToRad(90 - pitch);
                    const theta = THREE.MathUtils.degToRad(yaw - 90);

                    const distance = 280;
                    const x = distance * Math.sin(phi) * Math.cos(theta);
                    const y = distance * Math.cos(phi);
                    const z = distance * Math.sin(phi) * Math.sin(theta);

                    const group = new THREE.Group();
                    group.position.set(x, y, z);
                    group.lookAt(0, y, 0); // Always point group directly towards camera/origin so -Z points forward
                    group.userData = { originalY: y, yaw: yaw };

                    // 1. Google Street View Floor Chevron Disc
                    const discGeom = new THREE.PlaneGeometry(62, 62);
                    const discMat = new THREE.MeshBasicMaterial({
                        map: chevronTexture,
                        transparent: true,
                        side: THREE.DoubleSide,
                        depthWrite: false,
                    });
                    const chevronMesh = new THREE.Mesh(discGeom, discMat);
                    chevronMesh.rotation.x = -Math.PI / 2.3;
                    group.add(chevronMesh);

                    // 2. Subtle Ground Outer Ring
                    const groundRingGeom = new THREE.RingGeometry(34, 37, 32);
                    const groundRingMat = new THREE.MeshBasicMaterial({
                        color: 0xffffff,
                        transparent: true,
                        opacity: 0.45,
                        side: THREE.DoubleSide,
                        depthWrite: false,
                    });
                    const groundRing = new THREE.Mesh(groundRingGeom, groundRingMat);
                    groundRing.rotation.x = -Math.PI / 2.3;
                    group.add(groundRing);

                    // 3. Invisible Raycast Hitbox Sphere
                    const hitBoxGeom = new THREE.SphereGeometry(36, 16, 16);
                    const hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
                    const hitBox = new THREE.Mesh(hitBoxGeom, hitBoxMat);
                    hitBox.userData = {
                        hotspot: hotspot,
                        parentGroup: group,
                        chevronMesh: chevronMesh,
                        groundRing: groundRing,
                        labelId: "label-" + clickableHitboxes.length,
                    };
                    group.add(hitBox);

                    scene.add(group);
                    hotspotGroups.push(group);
                    clickableHitboxes.push(hitBox);

                    // 4. Floating Destination Label Badge
                    const labelContainer = document.getElementById("floating-labels");
                    const labelDiv = document.createElement("div");
                    labelDiv.className = "floating-label";
                    labelDiv.id = hitBox.userData.labelId;
                    labelDiv.innerHTML = `<span class="arrow-icon">➔</span> <span>${hotspot.label || hotspot.target_scene_title || "Walk Forward"}</span>`;
                    labelContainer.appendChild(labelDiv);
                });
            }

            function renderFilmstrip() {
                const container = document.getElementById("filmstrip-cards");
                if (!container) return;
                container.innerHTML = "";

                allScenesList.forEach((sceneItem) => {
                    const card = document.createElement("div");
                    card.className = "filmstrip-card" + (sceneItem.title === currentSceneTitle ? " active" : "");
                    card.innerHTML = `
                        <img src="${sceneItem.image_url}" alt="${sceneItem.title}" onerror="this.style.display='none'" />
                        <div class="filmstrip-card-title">${sceneItem.title}</div>
                    `;
                    card.onclick = () => {
                        triggerGoogleStreetViewStep({ target_scene_id: sceneItem.id, label: sceneItem.title });
                    };
                    container.appendChild(card);
                });
            }

            function animate() {
                animFrameId = requestAnimationFrame(animate);

                // Inertia & Friction Momentum Damping
                if (!isDragging) {
                    lon += velocityLon;
                    lat += velocityLat;
                    velocityLon *= 0.88;
                    velocityLat *= 0.88;
                    if (Math.abs(velocityLon) < 0.001) velocityLon = 0;
                    if (Math.abs(velocityLat) < 0.001) velocityLat = 0;
                }
                lat = Math.max(-85, Math.min(85, lat));

                // Camera Look Target
                const phi = THREE.MathUtils.degToRad(90 - lat);
                const theta = THREE.MathUtils.degToRad(lon - 90);
                const cameraTarget = new THREE.Vector3(
                    500 * Math.sin(phi) * Math.cos(theta),
                    500 * Math.cos(phi),
                    500 * Math.sin(phi) * Math.sin(theta)
                );
                camera.lookAt(cameraTarget);

                // Update Compass Needle Orientation
                const compassNeedle = document.getElementById("compass-needle");
                if (compassNeedle) {
                    compassNeedle.style.transform = `rotate(${-lon}deg)`;
                }

                const time = Date.now() * 0.004;

                // Animate chevron arrows and floating badges
                clickableHitboxes.forEach((mesh, index) => {
                    const group = mesh.userData.parentGroup;
                    const ring = mesh.userData.groundRing;

                    // Subtle breathing pulse
                    const pulse = 1.0 + Math.abs(Math.sin(time * 2.5 + index)) * 0.18;
                    if (ring) {
                        ring.scale.set(pulse, pulse, pulse);
                        ring.material.opacity = 0.5 - (pulse - 1.0) * 1.5;
                    }

                    // 3D to 2D screen projection for floating label badge
                    const pos = group.position.clone();
                    pos.y += 24.0;
                    pos.project(camera);

                    const label = document.getElementById(mesh.userData.labelId);
                    if (label) {
                        if (pos.z > 1 || pos.x < -1.1 || pos.x > 1.1 || pos.y < -1.1 || pos.y > 1.1) {
                            label.style.display = "none";
                        } else {
                            label.style.display = "flex";
                            const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
                            const y = (pos.y * -0.5 + 0.5) * window.innerHeight;
                            label.style.left = x + "px";
                            label.style.top = y + "px";
                        }
                    }
                });

                // Animate click ripples
                const now = performance.now();
                for (let i = rippleMeshes.length - 1; i >= 0; i--) {
                    const r = rippleMeshes[i];
                    const elapsed = now - r.startTime;
                    const prog = elapsed / r.duration;
                    if (prog >= 1.0) {
                        scene.remove(r.mesh);
                        r.mesh.geometry.dispose();
                        r.mesh.material.dispose();
                        rippleMeshes.splice(i, 1);
                    } else {
                        const scale = 1.0 + prog * 4.0;
                        r.mesh.scale.set(scale, scale, scale);
                        r.mesh.material.opacity = 0.85 * (1.0 - prog);
                    }
                }

                renderer.render(scene, camera);
            }

            function notifyParent(data) {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(data, "*");
                }
            }

            window.addEventListener("message", (event) => {
                try {
                    const data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
                    if (data && data.type === "init") {
                        init(data.imageUrl, data.hotspots, data.title, data.buildingName, data.allScenes);
                    }
                } catch (e) {
                    console.error("Message parse error:", e);
                }
            });
        </script>
    </body>
