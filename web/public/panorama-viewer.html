<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>ARQuest 360 Panorama Walkthrough</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                overflow: hidden;
                background: #09090b;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                user-select: none;
                -webkit-user-select: none;
            }
            #canvas {
                width: 100vw;
                height: 100vh;
                display: block;
                cursor: grab;
            }
            #canvas:active {
                cursor: grabbing;
            }
            #canvas.pointer-cursor {
                cursor: pointer;
            }

            /* Loading Overlay */
            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #ffffff;
                font-size: 14px;
                font-weight: 600;
                letter-spacing: 0.3px;
                background: rgba(18, 18, 20, 0.88);
                padding: 14px 24px;
                border-radius: 12px;
                pointer-events: none;
                z-index: 30;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                display: flex;
                align-items: center;
                gap: 12px;
                border: 1px solid rgba(255, 255, 255, 0.12);
                backdrop-filter: blur(8px);
            }
            .spinner {
                width: 20px;
                height: 20px;
                border: 2.5px solid rgba(255, 255, 255, 0.2);
                border-top-color: #e11d48;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            /* Glassmorphism Header Bar */
            #top-bar {
                position: absolute;
                top: 16px;
                left: 20px;
                right: 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                pointer-events: none;
                z-index: 20;
            }
            .header-badge {
                pointer-events: auto;
                background: rgba(15, 17, 23, 0.82);
                color: #ffffff;
                padding: 8px 16px;
                border-radius: 20px;
                font-size: 13px;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 8px;
                border: 1px solid rgba(255, 255, 255, 0.15);
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
                backdrop-filter: blur(10px);
            }
            .hint-pill {
                pointer-events: auto;
                background: rgba(15, 17, 23, 0.75);
                color: rgba(255, 255, 255, 0.85);
                padding: 7px 16px;
                border-radius: 20px;
                font-size: 12px;
                font-weight: 500;
                border: 1px solid rgba(255, 255, 255, 0.12);
                backdrop-filter: blur(10px);
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            }

            /* Floating Controls (Zoom, Reset, Fullscreen) */
            #controls-toolbar {
                position: absolute;
                bottom: 24px;
                right: 24px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                z-index: 20;
            }
            .ctrl-btn {
                width: 40px;
                height: 40px;
                border-radius: 10px;
                background: rgba(15, 17, 23, 0.85);
                color: #ffffff;
                border: 1px solid rgba(255, 255, 255, 0.15);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 16px;
                font-weight: bold;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
                backdrop-filter: blur(8px);
                transition: all 0.15s ease;
            }
            .ctrl-btn:hover {
                background: #8A1538;
                border-color: rgba(255, 255, 255, 0.3);
                transform: scale(1.06);
            }
            .ctrl-btn:active {
                transform: scale(0.95);
            }

            /* Hotspots Navigation Dock */
            #hotspots {
                position: absolute;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
                max-width: 80%;
                z-index: 15;
            }
            .hotspot-btn {
                background: rgba(138, 21, 56, 0.92);
                color: #ffffff;
                border: 1.5px solid rgba(255, 255, 255, 0.85);
                padding: 10px 18px;
                border-radius: 24px;
                font-size: 13px;
                font-weight: 700;
                cursor: pointer;
                transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
                display: flex;
                align-items: center;
                gap: 8px;
                backdrop-filter: blur(6px);
            }
            .hotspot-btn:hover {
                background: #a31b44;
                transform: translateY(-2px) scale(1.03);
                box-shadow: 0 6px 18px rgba(138, 21, 56, 0.6);
            }

            /* Floating 3D Destination Labels */
            #floating-labels {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 10;
            }
            .floating-label {
                position: absolute;
                background: rgba(15, 17, 23, 0.9);
                color: #ffffff;
                font-weight: 700;
                padding: 6px 16px;
                border-radius: 20px;
                font-size: 13px;
                pointer-events: none;
                transform: translate(-50%, -100%);
                opacity: 0;
                white-space: nowrap;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
                transition: opacity 0.2s;
                text-align: center;
                border: 1.5px solid rgba(255, 255, 255, 0.9);
                display: flex;
                align-items: center;
                gap: 6px;
                backdrop-filter: blur(6px);
            }
            .floating-label .arrow-icon {
                color: #ff6b8b;
                font-size: 14px;
            }
            .floating-label::after {
                content: '';
                position: absolute;
                top: 100%;
                left: 50%;
                margin-left: -6px;
                border-width: 6px;
                border-style: solid;
                border-color: rgba(15, 17, 23, 0.9) transparent transparent transparent;
            }

            /* Camera Walk Flash Transition */
            #flash-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #ffffff;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s ease;
                z-index: 25;
            }
        </style>
    </head>
    <body>
        <!-- Top Bar with Scene Title & Instructions -->
        <div id="top-bar">
            <div class="header-badge" id="scene-badge">
                <span>📍</span>
                <span id="scene-title-text">360° Panorama</span>
            </div>
            <div class="hint-pill">
                <span>🖱️ Drag to look around</span>
                <span style="opacity: 0.5; margin: 0 6px;">•</span>
                <span>👆 Click ground arrows to walk</span>
            </div>
        </div>

        <!-- Floating Controls Toolbar -->
        <div id="controls-toolbar">
            <button class="ctrl-btn" id="btn-zoom-in" title="Zoom In">+</button>
            <button class="ctrl-btn" id="btn-zoom-out" title="Zoom Out">−</button>
            <button class="ctrl-btn" id="btn-reset" title="Reset View">🔄</button>
            <button class="ctrl-btn" id="btn-fullscreen" title="Toggle Fullscreen">⛶</button>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <span id="loading-text">Loading 360° Scene...</span>
        </div>
        <div id="flash-overlay"></div>
        <canvas id="canvas"></canvas>
        <div id="floating-labels"></div>
        <div id="hotspots"></div>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
                }
            }
        </script>
        <script type="module">
            import * as THREE from "three";

            let scene, camera, renderer, sphere, texture, animFrameId;
            let lon = 0,
                lat = 0,
                isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let mouseMovedDistance = 0;
            let currentHotspots = [];
            let hotspotGroups = [];
            let clickableHitboxes = [];
            let rippleMeshes = [];
            let fov = 75;
            let defaultFov = 75;
            let maxFov = 75;
            let maxLat = 0;
            let chevronTexture = null;
            let isTransitioning = false;

            // Generate crisp Google Street View Ground Chevron Arrow Texture
            function createGoogleStreetViewChevronTexture() {
                const canvas = document.createElement("canvas");
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext("2d");

                ctx.clearRect(0, 0, 256, 256);

                // Subtle shadow
                ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 4;

                // Outer pulsing rim
                ctx.beginPath();
                ctx.arc(128, 128, 108, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
                ctx.fill();

                // Disc body with brand maroon
                ctx.beginPath();
                ctx.arc(128, 128, 96, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(138, 21, 56, 0.9)";
                ctx.fill();
                ctx.lineWidth = 5;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                ctx.shadowColor = "transparent";

                // Double Chevron Arrow pointing UP (Forward)
                ctx.fillStyle = "#ffffff";

                // Top Chevron Arrow
                ctx.beginPath();
                ctx.moveTo(128, 56);
                ctx.lineTo(176, 104);
                ctx.lineTo(162, 118);
                ctx.lineTo(128, 84);
                ctx.lineTo(94, 118);
                ctx.lineTo(80, 104);
                ctx.closePath();
                ctx.fill();

                // Bottom Chevron Arrow
                ctx.beginPath();
                ctx.moveTo(128, 112);
                ctx.lineTo(176, 160);
                ctx.lineTo(162, 174);
                ctx.lineTo(128, 140);
                ctx.lineTo(94, 174);
                ctx.lineTo(80, 160);
                ctx.closePath();
                ctx.fill();

                const tex = new THREE.CanvasTexture(canvas);
                tex.needsUpdate = true;
                return tex;
            }

            chevronTexture = createGoogleStreetViewChevronTexture();

            function init(imageUrl, hotspots, sceneTitle) {
                currentHotspots = hotspots || [];

                if (sceneTitle) {
                    const badge = document.getElementById("scene-title-text");
                    if (badge) badge.textContent = sceneTitle;
                }

                if (sphere) {
                    scene.remove(sphere);
                    sphere.geometry.dispose();
                    sphere.material.dispose();
                    if (texture) texture.dispose();
                }

                // Cleanup existing hotspots
                hotspotGroups.forEach((group) => {
                    scene.remove(group);
                    group.traverse((child) => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) child.material.dispose();
                    });
                });
                hotspotGroups = [];
                clickableHitboxes = [];
                document.getElementById("floating-labels").innerHTML = "";
                document.getElementById("hotspots").innerHTML = "";

                if (!scene) {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(
                        fov,
                        window.innerWidth / window.innerHeight,
                        0.1,
                        1000,
                    );
                    camera.position.set(0, 0, 0.1);
                    renderer = new THREE.WebGLRenderer({
                        canvas: document.getElementById("canvas"),
                        antialias: true,
                        powerPreference: "high-performance",
                    });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                    renderer.outputColorSpace = THREE.SRGBColorSpace;

                    setupControls();
                    setupToolbarEvents();
                    window.addEventListener("resize", () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });
                }

                document.getElementById("loading").style.display = "flex";
                document.getElementById("loading-text").textContent = "Loading 360° Scene...";

                function loadPanoramaTexture(url, retryWithProxy = true) {
                    const loader = new THREE.TextureLoader();
                    loader.setCrossOrigin("anonymous");
                    loader.load(
                        url,
                        (loadedTexture) => {
                            texture = loadedTexture;

                            // Direct crisp 1:1 pixel rendering
                            const maxAnisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 16;
                            texture.anisotropy = maxAnisotropy;
                            texture.minFilter = THREE.LinearFilter;
                            texture.magFilter = THREE.LinearFilter;
                            texture.generateMipmaps = false;
                            texture.colorSpace = THREE.SRGBColorSpace;

                            // Exact Cylinder Geometry Matching Mobile App
                            const imgWidth = texture.image.width || 4000;
                            const imgHeight = texture.image.height || 1000;
                            const radius = 500;
                            const circumference = 2 * Math.PI * radius;
                            const cylinderHeight = (imgHeight / imgWidth) * circumference;

                            const geometry = new THREE.CylinderGeometry(
                                radius,
                                radius,
                                cylinderHeight,
                                64,
                                1,
                                true,
                            );
                            geometry.scale(-1, 1, 1);

                            // Unlit basic material preserves true image brightness & vibrant colors
                            const material = new THREE.MeshBasicMaterial({
                                map: texture,
                            });
                            sphere = new THREE.Mesh(geometry, material);
                            scene.add(sphere);

                            // Calculate ideal FOV and vertical bounds
                            maxFov = 2 * Math.atan(cylinderHeight / 2 / radius) * (180 / Math.PI);
                            defaultFov = Math.min(75, maxFov);
                            fov = defaultFov;
                            camera.fov = fov;
                            camera.updateProjectionMatrix();

                            maxLat = Math.max(0, (maxFov - fov) / 2);
                            lat = 0;

                            document.getElementById("loading").style.display = "none";
                            createGoogleStreetViewHotspots();
                            renderHotspots();

                            notifyParent({ type: "loaded" });
                            if (!renderer.info.render.frame) animate();
                        },
                        undefined,
                        (error) => {
                            if (retryWithProxy && url.startsWith("http") && !url.includes("images.weserv.nl")) {
                                console.warn("Direct texture load failed (likely S3 CORS). Retrying via high-res CORS proxy fallback...");
                                const proxyUrl = `https://images.weserv.nl/?url=${encodeURIComponent(url)}&output=jpg&q=100&we`;
                                loadPanoramaTexture(proxyUrl, false);
                                return;
                            }
                            console.error("Texture load failed:", error);
                            document.getElementById("loading-text").innerHTML = "Failed to load panorama image";
                            notifyParent({ type: "error", message: "Failed to load panorama image" });
                        },
                    );
                }

                loadPanoramaTexture(imageUrl, true);
            }

            function setupToolbarEvents() {
                // Zoom In
                document.getElementById("btn-zoom-in").onclick = () => {
                    fov = Math.max(25, fov - 10);
                    camera.fov = fov;
                    camera.updateProjectionMatrix();
                    maxLat = Math.max(0, (maxFov - fov) / 2);
                    lat = Math.max(-maxLat, Math.min(maxLat, lat));
                };

                // Zoom Out
                document.getElementById("btn-zoom-out").onclick = () => {
                    fov = Math.min(maxFov, fov + 10);
                    camera.fov = fov;
                    camera.updateProjectionMatrix();
                    maxLat = Math.max(0, (maxFov - fov) / 2);
                    lat = Math.max(-maxLat, Math.min(maxLat, lat));
                };

                // Reset View
                document.getElementById("btn-reset").onclick = () => {
                    lon = 0;
                    lat = 0;
                    fov = defaultFov;
                    camera.fov = fov;
                    camera.updateProjectionMatrix();
                };

                // Fullscreen
                document.getElementById("btn-fullscreen").onclick = () => {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else {
                        document.exitFullscreen().catch(() => {});
                    }
                };
            }

            function setupControls() {
                const canvas = document.getElementById("canvas");

                // Mouse Drag
                canvas.addEventListener("mousedown", (e) => {
                    isDragging = true;
                    mouseMovedDistance = 0;
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                window.addEventListener("mousemove", (e) => {
                    if (isDragging) {
                        const deltaX = e.clientX - previousMousePosition.x;
                        const deltaY = e.clientY - previousMousePosition.y;
                        mouseMovedDistance += Math.abs(deltaX) + Math.abs(deltaY);

                        lon -= deltaX * 0.15;
                        lat += deltaY * 0.15;
                        lat = Math.max(-maxLat, Math.min(maxLat, lat));
                        previousMousePosition = { x: e.clientX, y: e.clientY };
                    }

                    // Hover raycasting for pointer cursor
                    if (!isDragging && clickableHitboxes.length > 0) {
                        const raycaster = new THREE.Raycaster();
                        const mouse = new THREE.Vector2(
                            (e.clientX / window.innerWidth) * 2 - 1,
                            -(e.clientY / window.innerHeight) * 2 + 1,
                        );
                        raycaster.setFromCamera(mouse, camera);
                        const intersects = raycaster.intersectObjects(clickableHitboxes);
                        if (intersects.length > 0) {
                            canvas.classList.add("pointer-cursor");
                        } else {
                            canvas.classList.remove("pointer-cursor");
                        }
                    }
                });

                window.addEventListener("mouseup", () => {
                    isDragging = false;
                });

                // Mouse wheel zoom
                canvas.addEventListener("wheel", (e) => {
                    e.preventDefault();
                    fov += e.deltaY * 0.05;
                    fov = Math.max(25, Math.min(maxFov, fov));
                    camera.fov = fov;
                    camera.updateProjectionMatrix();
                    maxLat = Math.max(0, (maxFov - fov) / 2);
                    lat = Math.max(-maxLat, Math.min(maxLat, lat));
                }, { passive: false });

                // Touch Drag & Pinch Zoom
                let initialPinchDistance = 0;
                canvas.addEventListener("touchstart", (e) => {
                    if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
                    } else if (e.touches.length === 1) {
                        isDragging = true;
                        mouseMovedDistance = 0;
                        previousMousePosition = {
                            x: e.touches[0].clientX,
                            y: e.touches[0].clientY,
                        };
                    }
                });

                canvas.addEventListener("touchmove", (e) => {
                    if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const delta = distance - initialPinchDistance;
                        fov -= delta * 0.1;
                        fov = Math.max(25, Math.min(maxFov, fov));
                        camera.fov = fov;
                        camera.updateProjectionMatrix();
                        initialPinchDistance = distance;
                        maxLat = Math.max(0, (maxFov - fov) / 2);
                        lat = Math.max(-maxLat, Math.min(maxLat, lat));
                    } else if (isDragging && e.touches.length === 1) {
                        const deltaX = e.touches[0].clientX - previousMousePosition.x;
                        const deltaY = e.touches[0].clientY - previousMousePosition.y;
                        mouseMovedDistance += Math.abs(deltaX) + Math.abs(deltaY);
                        lon -= deltaX * 0.15;
                        lat += deltaY * 0.15;
                        lat = Math.max(-maxLat, Math.min(maxLat, lat));
                        previousMousePosition = {
                            x: e.touches[0].clientX,
                            y: e.touches[0].clientY,
                        };
                    }
                });

                canvas.addEventListener("touchend", () => {
                    isDragging = false;
                });

                // Single Click on Arrow
                canvas.addEventListener("click", (e) => {
                    if (mouseMovedDistance > 12 || isTransitioning) return;

                    const raycaster = new THREE.Raycaster();
                    const mouse = new THREE.Vector2(
                        (e.clientX / window.innerWidth) * 2 - 1,
                        -(e.clientY / window.innerHeight) * 2 + 1,
                    );
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(clickableHitboxes);
                    if (intersects.length > 0) {
                        const hotspot = intersects[0].object.userData.hotspot;
                        triggerStreetViewStep(hotspot, intersects[0].point);
                    }
                });

                // Double Click / Double Tap to step forward
                canvas.addEventListener("dblclick", (e) => {
                    if (isTransitioning || clickableHitboxes.length === 0) return;

                    const raycaster = new THREE.Raycaster();
                    const mouse = new THREE.Vector2(
                        (e.clientX / window.innerWidth) * 2 - 1,
                        -(e.clientY / window.innerHeight) * 2 + 1,
                    );
                    raycaster.setFromCamera(mouse, camera);
                    
                    const intersects = raycaster.intersectObjects(clickableHitboxes);
                    if (intersects.length > 0) {
                        const hotspot = intersects[0].object.userData.hotspot;
                        triggerStreetViewStep(hotspot, intersects[0].point);
                        return;
                    }

                    // Otherwise find closest hotspot in view direction
                    const camDir = new THREE.Vector3();
                    camera.getWorldDirection(camDir);

                    let closestHotspot = null;
                    let closestAngle = Infinity;

                    clickableHitboxes.forEach((mesh) => {
                        const hsDir = mesh.position.clone().normalize();
                        const angle = camDir.angleTo(hsDir);
                        if (angle < closestAngle && angle < 0.8) {
                            closestAngle = angle;
                            closestHotspot = mesh.userData.hotspot;
                        }
                    });

                    if (closestHotspot) {
                        triggerStreetViewStep(closestHotspot);
                    }
                });
            }

            // Google Street View Zoom-Glide Forward Walk Animation
            function triggerStreetViewStep(hotspot, clickPoint) {
                if (isTransitioning) return;
                isTransitioning = true;

                if (clickPoint) {
                    spawnClickRipple(clickPoint);
                }

                const targetSceneId = hotspot.target_scene_id || hotspot.target_scene;
                const startFov = camera.fov;
                const targetFov = 35; // Forward walk compression
                const duration = 260;
                const startTime = performance.now();

                const flash = document.getElementById("flash-overlay");
                if (flash) flash.style.opacity = "0.35";

                function animateZoom(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1.0);
                    const ease = progress * progress;

                    camera.fov = startFov + (targetFov - startFov) * ease;
                    camera.updateProjectionMatrix();

                    if (progress < 1.0) {
                        requestAnimationFrame(animateZoom);
                    } else {
                        notifyParent({
                            type: "hotspot_clicked",
                            target_scene_id: targetSceneId,
                            label: hotspot.label,
                        });

                        setTimeout(() => {
                            if (flash) flash.style.opacity = "0";
                            camera.fov = defaultFov;
                            camera.updateProjectionMatrix();
                            isTransitioning = false;
                        }, 200);
                    }
                }
                requestAnimationFrame(animateZoom);
            }

            function spawnClickRipple(point) {
                const geom = new THREE.RingGeometry(2, 6, 32);
                const mat = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.9,
                    side: THREE.DoubleSide,
                });
                const ripple = new THREE.Mesh(geom, mat);
                ripple.position.copy(point);
                ripple.lookAt(camera.position);
                scene.add(ripple);

                rippleMeshes.push({
                    mesh: ripple,
                    startTime: performance.now(),
                    duration: 380,
                });
            }

            function createGoogleStreetViewHotspots() {
                currentHotspots.forEach((hotspot) => {
                    const yaw = hotspot.yaw || 0;
                    // Lower ground angle for Google Street View look
                    const pitch = (hotspot.pitch !== undefined && hotspot.pitch !== 0) ? hotspot.pitch : -18;
                    const phi = THREE.MathUtils.degToRad(90 - pitch);
                    const theta = THREE.MathUtils.degToRad(yaw - 90);

                    const distance = 280;
                    const x = distance * Math.sin(phi) * Math.cos(theta);
                    const y = distance * Math.cos(phi);
                    const z = distance * Math.sin(phi) * Math.sin(theta);

                    const group = new THREE.Group();
                    group.position.set(x, y, z);
                    group.userData = { originalY: y, yaw: yaw };

                    // 1. Street View Floor Chevron Disc
                    const discGeom = new THREE.PlaneGeometry(62, 62);
                    const discMat = new THREE.MeshBasicMaterial({
                        map: chevronTexture,
                        transparent: true,
                        side: THREE.DoubleSide,
                        depthWrite: false,
                    });
                    const chevronMesh = new THREE.Mesh(discGeom, discMat);
                    chevronMesh.rotation.x = -Math.PI / 2.3;
                    chevronMesh.rotation.z = THREE.MathUtils.degToRad(90 - yaw);
                    group.add(chevronMesh);

                    // 2. Animated Pulsing Outer Ring
                    const groundRingGeom = new THREE.RingGeometry(34, 38, 32);
                    const groundRingMat = new THREE.MeshBasicMaterial({
                        color: 0xffffff,
                        transparent: true,
                        opacity: 0.6,
                        side: THREE.DoubleSide,
                        depthWrite: false,
                    });
                    const groundRing = new THREE.Mesh(groundRingGeom, groundRingMat);
                    groundRing.rotation.x = -Math.PI / 2.3;
                    group.add(groundRing);

                    // 3. Clickable Hitbox Sphere
                    const hitBoxGeom = new THREE.SphereGeometry(36, 16, 16);
                    const hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
                    const hitBox = new THREE.Mesh(hitBoxGeom, hitBoxMat);
                    hitBox.userData = {
                        hotspot: hotspot,
                        parentGroup: group,
                        chevronMesh: chevronMesh,
                        groundRing: groundRing,
                        labelId: "label-" + clickableHitboxes.length,
                    };
                    group.add(hitBox);

                    scene.add(group);
                    hotspotGroups.push(group);
                    clickableHitboxes.push(hitBox);

                    // 4. Floating Destination Label Badge
                    const labelContainer = document.getElementById("floating-labels");
                    const labelDiv = document.createElement("div");
                    labelDiv.className = "floating-label";
                    labelDiv.id = hitBox.userData.labelId;
                    labelDiv.innerHTML = `<span class="arrow-icon">➔</span> <span>${hotspot.label || hotspot.target_scene_title || "Next Scene"}</span>`;
                    labelContainer.appendChild(labelDiv);
                });
            }

            function renderHotspots() {
                const container = document.getElementById("hotspots");
                container.innerHTML = "";
                currentHotspots.forEach((hotspot) => {
                    const btn = document.createElement("button");
                    btn.className = "hotspot-btn";
                    btn.innerHTML = `<span>➔</span> <span>${hotspot.label || hotspot.target_scene_title || "Next Scene"}</span>`;
                    btn.onclick = () => triggerStreetViewStep(hotspot);
                    container.appendChild(btn);
                });
            }

            function animate() {
                animFrameId = requestAnimationFrame(animate);

                const phi = THREE.MathUtils.degToRad(90 - lat);
                const theta = THREE.MathUtils.degToRad(lon - 90);
                const cameraTarget = new THREE.Vector3(
                    500 * Math.sin(phi) * Math.cos(theta),
                    500 * Math.cos(phi),
                    500 * Math.sin(phi) * Math.sin(theta)
                );
                camera.lookAt(cameraTarget);

                const time = Date.now() * 0.005;

                // Animate chevron arrows and floating badges
                clickableHitboxes.forEach((mesh, index) => {
                    const group = mesh.userData.parentGroup;
                    const chevron = mesh.userData.chevronMesh;
                    const ring = mesh.userData.groundRing;

                    // Subtle floating bob
                    group.position.y = group.userData.originalY + Math.sin(time * 2.5 + index) * 3.5;

                    // Pulse outer ring
                    const pulse = 1.0 + Math.abs(Math.sin(time * 3 + index)) * 0.25;
                    if (ring) {
                        ring.scale.set(pulse, pulse, pulse);
                        ring.material.opacity = 0.7 - (pulse - 1.0) * 1.5;
                    }

                    // 3D to 2D projection for floating label badge
                    const pos = group.position.clone();
                    pos.y += 24.0;
                    pos.project(camera);

                    const label = document.getElementById(mesh.userData.labelId);
                    if (label) {
                        if (pos.z > 1 || pos.x < -1.1 || pos.x > 1.1 || pos.y < -1.1 || pos.y > 1.1) {
                            label.style.opacity = "0";
                        } else {
                            label.style.opacity = "1";
                            const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
                            const y = (pos.y * -0.5 + 0.5) * window.innerHeight;
                            label.style.left = x + "px";
                            label.style.top = y + "px";
                        }
                    }
                });

                // Animate click ripples
                const now = performance.now();
                for (let i = rippleMeshes.length - 1; i >= 0; i--) {
                    const r = rippleMeshes[i];
                    const elapsed = now - r.startTime;
                    const prog = elapsed / r.duration;
                    if (prog >= 1.0) {
                        scene.remove(r.mesh);
                        r.mesh.geometry.dispose();
                        r.mesh.material.dispose();
                        rippleMeshes.splice(i, 1);
                    } else {
                        const scale = 1.0 + prog * 4.0;
                        r.mesh.scale.set(scale, scale, scale);
                        r.mesh.material.opacity = 0.9 * (1.0 - prog);
                    }
                }

                renderer.render(scene, camera);
            }

            function notifyParent(data) {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(data, "*");
                }
            }

            window.addEventListener("message", (event) => {
                try {
                    const data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
                    if (data && data.type === "init") {
                        init(data.imageUrl, data.hotspots, data.title);
                    }
                } catch (e) {
                    console.error("Message parse error:", e);
                }
            });
        </script>
    </body>
</html>
