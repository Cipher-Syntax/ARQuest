<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>3D Hotspot Editor</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #1a1a1a;
                font-family: system-ui;
            }
            #canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #00e5ff;
                font-weight: bold;
                letter-spacing: 2px;
                pointer-events: none;
            }

            #ui-overlay {
                position: absolute;
                top: 20px;
                left: 20px;
                color: white;
                pointer-events: none;
            }
            #ui-overlay h3 {
                margin: 0 0 5px 0;
                color: #00e5ff;
            }
            #ui-overlay p {
                margin: 0;
                font-size: 14px;
                color: #ccc;
            }

            #hotspot-form {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: #2a2a2a;
                border: 1px solid #444;
                padding: 20px;
                border-radius: 8px;
                width: 300px;
                display: none;
                color: white;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }
            #hotspot-form input,
            #hotspot-form textarea {
                width: 100%;
                box-sizing: border-box;
                margin-bottom: 15px;
                padding: 10px;
                background: #1a1a1a;
                border: 1px solid #444;
                color: white;
                border-radius: 4px;
            }
            .btn-group {
                display: flex;
                gap: 10px;
            }
            .btn {
                flex: 1;
                padding: 10px;
                border: none;
                border-radius: 4px;
                font-weight: bold;
                cursor: pointer;
            }
            .btn-save {
                background: #00e5ff;
                color: black;
            }
            .btn-cancel {
                background: #444;
                color: white;
            }

            .btn-save-all {
                position: absolute;
                bottom: 20px;
                right: 20px;
                background: #00e5ff;
                color: black;
                border: none;
                padding: 12px 24px;
                border-radius: 6px;
                font-weight: bold;
                font-size: 16px;
                cursor: pointer;
                box-shadow: 0 4px 12px rgba(0, 229, 255, 0.3);
            }

            #floating-labels {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 10;
            }
            .floating-label {
                position: absolute;
                background: rgba(0, 229, 255, 0.9);
                color: #000;
                font-weight: bold;
                padding: 6px 14px;
                border-radius: 14px;
                font-family: system-ui, sans-serif;
                font-size: 14px;
                pointer-events: none;
                transform: translate(-50%, -100%);
                display: none;
                white-space: nowrap;
                box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                text-align: center;
            }
            .floating-label::after {
                content: '';
                position: absolute;
                top: 100%;
                left: 50%;
                margin-left: -6px;
                border-width: 6px;
                border-style: solid;
                border-color: rgba(0, 229, 255, 0.9) transparent transparent transparent;
            }
            .floating-label.restricted {
                background: rgba(220, 53, 69, 0.9);
                color: #fff;
            }
            .floating-label.restricted::after {
                border-color: rgba(220, 53, 69, 0.9) transparent transparent transparent;
            }
        </style>
    </head>
    <body>
        <div id="floating-labels"></div>
        <div id="loading">LOADING EDITOR...</div>

        <div id="ui-overlay">
            <h3>Hotspot Editor</h3>
            <p>1. Right-Click and drag to move camera.</p>
            <p>2. Double-Click anywhere on the model to place a hotspot.</p>
            <p>3. Click on an existing hotspot to Edit or Delete it.</p>
            <p>4. Click "Save All Hotspots" when finished.</p>
        </div>

        <div id="hotspot-form">
            <h3 id="form-title" style="margin-top: 0; color: #00e5ff">
                New Hotspot
            </h3>
            <input type="text" id="hs-title" placeholder="e.g. Server Room" />
            <textarea
                id="hs-desc"
                placeholder="Description..."
                rows="3"
            ></textarea>
            <select id="hs-category" style="width: 100%; box-sizing: border-box; margin-bottom: 15px; padding: 10px; background: #1a1a1a; border: 1px solid #444; color: white; border-radius: 4px;">
                <option value="normal">Normal</option>
                <option value="restricted">Restricted</option>
            </select>
            <div class="btn-group">
                <button class="btn btn-cancel" onclick="cancelHotspot()">
                    Cancel
                </button>
                <button class="btn btn-save" onclick="saveHotspot()">
                    Save
                </button>
            </div>
            <button
                id="btn-delete"
                class="btn btn-cancel"
                style="width: 100%; margin-top: 10px; background: #ff4444"
                onclick="deleteHotspot()"
                style="display: none"
            >
                Delete Hotspot
            </button>
        </div>

        <button class="btn-save-all" onclick="sendDataToReact()">
            SAVE ALL HOTSPOTS
        </button>

        <canvas id="canvas"></canvas>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
                }
            }
        </script>

        <script type="module">
            import * as THREE from "three";
            import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
            import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
            import { OrbitControls } from "three/addons/controls/OrbitControls.js";

            let scene, camera, renderer, controls, model;
            let hotspotsData = [];
            let hotspotMeshes = [];
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let pendingCoordinate = null;
            let editingHotspotId = null;
            
            // Teleportation state
            let teleportTargetControls = null;
            let teleportTargetCamera = null;
            let teleportProgress = 0;
            let teleportStartControls = new THREE.Vector3();
            let teleportStartCamera = new THREE.Vector3();
            const TELEPORT_SPEED = 0.04;
            let pointerDownPos = new THREE.Vector2();
            
            // Keyboard state for FPS movement
            const keys = { w: false, a: false, s: false, d: false };

            // Initialize from React iframe message
            window.addEventListener("message", (event) => {
                const data = event.data;
                if (data.type === "INIT_EDITOR") {
                    if (data.hotspots) hotspotsData = data.hotspots;
                    init(data.modelUrl);
                }
            });

            // Fallback for direct testing (if opened without React)
            if (!window.parent || window === window.parent) {
                // Un-comment to test directly with a valid URL
                // init('YOUR_MODEL_URL_HERE');
            }

            function init(modelUrl) {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x222222);

                camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000,
                );

                renderer = new THREE.WebGLRenderer({
                    canvas: document.getElementById("canvas"),
                    antialias: true,
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);

                const ambient = new THREE.AmbientLight(0xffffff, 0.8);
                scene.add(ambient);
                const directional = new THREE.DirectionalLight(0xffffff, 0.5);
                directional.position.set(5, 10, 7.5);
                scene.add(directional);

                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.rotateSpeed = 0.6;
                controls.zoomSpeed = 0.8;
                controls.panSpeed = 0.8;

                document.addEventListener("dblclick", onDoubleClick);
                document.addEventListener("pointerdown", onPointerDown);
                document.addEventListener("pointerup", onPointerUp);
                
                // Escape hatch to easily zoom out from first-person mode
                document.addEventListener("wheel", (e) => {
                    const dist = camera.position.distanceTo(controls.target);
                    if (dist < 0.5 && e.deltaY > 0) {
                        const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
                        camera.position.add(dir.multiplyScalar(2.0));
                        controls.update();
                    }
                });

                // Keyboard Controls (WASD)
                document.addEventListener("keydown", (event) => {
                    // Ignore keydown if they are typing in an input field
                    if (document.activeElement && document.activeElement.tagName === "INPUT") return;
                    
                    switch (event.key.toLowerCase()) {
                        case "w": case "arrowup": keys.w = true; break;
                        case "a": case "arrowleft": keys.a = true; break;
                        case "s": case "arrowdown": keys.s = true; break;
                        case "d": case "arrowright": keys.d = true; break;
                    }
                });

                document.addEventListener("keyup", (event) => {
                    switch (event.key.toLowerCase()) {
                        case "w": case "arrowup": keys.w = false; break;
                        case "a": case "arrowleft": keys.a = false; break;
                        case "s": case "arrowdown": keys.s = false; break;
                        case "d": case "arrowright": keys.d = false; break;
                    }
                });

                loadModel(modelUrl);
                animate();
            }

            function loadModel(url) {
                if (!url) return;
                const loader = new GLTFLoader();
                
                const dracoLoader = new DRACOLoader();
                dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                loader.setDRACOLoader(dracoLoader);
                
                loader.load(
                    url,
                    (gltf) => {
                        model = gltf.scene;
                        scene.add(model);

                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());

                        camera.position.set(
                            center.x,
                            center.y + size.y / 2,
                            center.z + size.z,
                        );
                        controls.target.copy(center);
                        controls.update();

                        document.getElementById("loading").style.display =
                            "none";

                        // Re-render saved hotspots
                        hotspotsData.forEach((h) => {
                            if (!h.id)
                                h.id = Math.random().toString(36).substr(2, 9);
                            createHotspotMesh(h);
                        });
                    },
                    undefined,
                    (err) => console.error(err),
                );
            }

            function onDoubleClick(event) {
                if (event.target.id !== "canvas") return;
                if (!model) return;

                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(model, true);

                if (intersects.length > 0) {
                    pendingCoordinate = intersects[0].point;
                    editingHotspotId = null;
                    document.getElementById("form-title").innerText =
                        "New Hotspot";
                    document.getElementById("btn-delete").style.display =
                        "none";
                    document.getElementById("hs-title").value = "";
                    document.getElementById("hs-desc").value = "";
                    document.getElementById("hotspot-form").style.display =
                        "block";
                    document.getElementById("hs-title").focus();
                }
            }

            function onPointerDown(event) {
                if (event.target.id !== "canvas") return;
                pointerDownPos.set(event.clientX, event.clientY);

                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(
                    hotspotMeshes,
                    false,
                );

                if (intersects.length > 0) {
                    const mesh = intersects[0].object;
                    const hsData = mesh.userData.hotspot;

                    editingHotspotId = hsData.id;
                    pendingCoordinate = new THREE.Vector3(
                        hsData.x,
                        hsData.y,
                        hsData.z,
                    );

                    document.getElementById("form-title").innerText =
                        "Edit Hotspot";
                    document.getElementById("btn-delete").style.display =
                        "block";
                    document.getElementById("hs-title").value =
                        hsData.title || "";
                    document.getElementById("hs-desc").value =
                        hsData.desc || "";
                    document.getElementById("hs-category").value =
                        hsData.category || "normal";
                    document.getElementById("hotspot-form").style.display =
                        "block";
                }
            }

            let clickTimeout = null;

            function onPointerUp(event) {
                if (event.target.id !== "canvas") return;
                const dist = Math.hypot(event.clientX - pointerDownPos.x, event.clientY - pointerDownPos.y);
                if (dist > 10) return; // Ignore drag
                
                if (document.getElementById("hotspot-form").style.display === "block") return;

                if (clickTimeout !== null) {
                    // This is the second click of a double-click! Cancel the teleport.
                    clearTimeout(clickTimeout);
                    clickTimeout = null;
                    return;
                }

                // Wait 250ms to see if the user double-clicks before teleporting
                clickTimeout = setTimeout(() => {
                    clickTimeout = null;
                    
                    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);
                    const hsIntersects = raycaster.intersectObjects(hotspotMeshes, true);
                    if (hsIntersects.length > 0) return;

                    if (model) {
                        const intersects = raycaster.intersectObject(model, true);
                        if (intersects.length > 0) {
                            const hit = intersects[0];
                            
                            teleportStartControls.copy(controls.target);
                            teleportStartCamera.copy(camera.position);
                            
                            // Move camera exactly to where they clicked, at eye level (1.5m)
                            teleportTargetCamera = new THREE.Vector3(hit.point.x, hit.point.y + 1.5, hit.point.z);
                            
                            // Find the direction the camera is currently looking, flattened horizontally
                            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                            dir.y = 0;
                            if (dir.lengthSq() < 0.01) dir.set(0, 0, -1);
                            dir.normalize();
                            
                            // Set the rotation pivot point extremely close (5 centimeters) in front of the camera
                            // This makes dragging rotate the camera in place like a head, rather than swinging wide
                            teleportTargetControls = teleportTargetCamera.clone().add(dir.multiplyScalar(0.05));
                            
                            teleportProgress = 0;
                        }
                    }
                }, 250);
            }

            window.cancelHotspot = () => {
                document.getElementById("hotspot-form").style.display = "none";
                document.getElementById("hs-title").value = "";
                document.getElementById("hs-desc").value = "";
                pendingCoordinate = null;
                editingHotspotId = null;
            };

            window.saveHotspot = () => {
                const title = document.getElementById("hs-title").value;
                const desc = document.getElementById("hs-desc").value;
                const category = document.getElementById("hs-category").value;
                if (!title || !pendingCoordinate) return;

                if (editingHotspotId) {
                    const hs = hotspotsData.find(
                        (h) => h.id === editingHotspotId,
                    );
                    if (hs) {
                        hs.title = title;
                        hs.desc = desc;
                        hs.category = category;
                        const mesh = hotspotMeshes.find(
                            (m) => m.userData.hotspot.id === editingHotspotId,
                        );
                        if (mesh) {
                            mesh.userData.hotspot = hs;
                            
                            // Immediately update style in editor visually
                            const label = document.getElementById(mesh.userData.labelId);
                            if (label) {
                                label.textContent = hs.title;
                                if (hs.category === "restricted") {
                                    label.classList.add("restricted");
                                } else {
                                    label.classList.remove("restricted");
                                }
                            }
                            // Important: Re-render NPC features based on category (arms, face) would require re-creating the NPC or toggling parts.
                            // For simplicity in the admin editor, a page reload or standard update is fine, but the label updates instantly!
                        }
                    }
                } else {
                    const newHotspot = {
                        id: Math.random().toString(36).substr(2, 9),
                        title: title,
                        desc: desc,
                        category: category,
                        x: pendingCoordinate.x,
                        y: pendingCoordinate.y,
                        z: pendingCoordinate.z,
                    };
                    hotspotsData.push(newHotspot);
                    createHotspotMesh(newHotspot);
                }

                cancelHotspot();
            };

            window.deleteHotspot = () => {
                if (!editingHotspotId) return;

                hotspotsData = hotspotsData.filter(
                    (h) => h.id !== editingHotspotId,
                );
                const meshIndex = hotspotMeshes.findIndex(
                    (m) => m.userData.hotspot.id === editingHotspotId,
                );
                if (meshIndex > -1) {
                    const mesh = hotspotMeshes[meshIndex];
                    scene.remove(mesh.userData.parentGroup);
                    const label = document.getElementById(mesh.userData.labelId);
                    if (label) label.remove();
                    hotspotMeshes.splice(meshIndex, 1);
                }
                cancelHotspot();
            };

            function createHotspotMesh(hs) {
                const npcGroup = new THREE.Group();
                npcGroup.position.set(hs.x, hs.y, hs.z);

                // WMSU Staff Colors
                const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.6, metalness: 0.1 });
                const shirtMat = new THREE.MeshStandardMaterial({ color: 0x8A1538, roughness: 0.8, metalness: 0.1 }); // Crimson
                const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9, metalness: 0.1 }); // Dark

                // Torso
                const torsoGeom = new THREE.BoxGeometry(0.4, 0.6, 0.2);
                const torso = new THREE.Mesh(torsoGeom, shirtMat);
                torso.position.y = 1.0; 
                npcGroup.add(torso);

                // Head
                const headGeom = new THREE.SphereGeometry(0.18, 16, 16);
                const head = new THREE.Mesh(headGeom, skinMat);
                head.position.y = 1.45; 

                // Face: Eyes
                const eyeGeom = new THREE.SphereGeometry(0.025, 8, 8);
                const faceMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                
                const leftEye = new THREE.Mesh(eyeGeom, faceMat);
                leftEye.position.set(-0.06, 0.05, 0.16); // Left of face, slightly up, forward
                head.add(leftEye);
                
                const rightEye = new THREE.Mesh(eyeGeom, faceMat);
                rightEye.position.set(0.06, 0.05, 0.16); // Right of face
                head.add(rightEye);

                const isRestricted = (hs.category === "restricted");

                // Face: Smiling Mouth (half torus)
                const smileGeom = new THREE.TorusGeometry(0.06, 0.015, 8, 16, Math.PI);
                const smile = new THREE.Mesh(smileGeom, faceMat);
                
                if (isRestricted) {
                    smile.position.set(0, -0.05, 0.17);
                    smile.rotation.z = 0; // Frown
                    
                    const eyebrowGeom = new THREE.BoxGeometry(0.06, 0.015, 0.01);
                    const leftEyebrow = new THREE.Mesh(eyebrowGeom, faceMat);
                    leftEyebrow.position.set(-0.06, 0.07, 0.17);
                    leftEyebrow.rotation.z = -0.3;
                    head.add(leftEyebrow);
                    
                    const rightEyebrow = new THREE.Mesh(eyebrowGeom, faceMat);
                    rightEyebrow.position.set(0.06, 0.07, 0.17);
                    rightEyebrow.rotation.z = 0.3;
                    head.add(rightEyebrow);
                } else {
                    smile.position.set(0, -0.02, 0.17);
                    smile.rotation.z = Math.PI; // Flip arc upside down to make a smile
                }
                head.add(smile);

                npcGroup.add(head);

                // Arms
                const armGeom = new THREE.BoxGeometry(0.12, 0.55, 0.12);
                
                // Left Arm (from NPC's perspective, so +X)
                const leftArm = new THREE.Mesh(armGeom, shirtMat);
                leftArm.position.set(0.28, 1.0, 0);
                
                // Right Arm (from NPC's perspective, so -X) (This will wave)
                const rightArmGroup = new THREE.Group();
                rightArmGroup.position.set(-0.28, 1.25, 0); // Shoulder pivot point
                const rightArmMesh = new THREE.Mesh(armGeom, shirtMat);
                rightArmMesh.position.set(0, -0.275, 0); // Center of geometry down from pivot
                rightArmGroup.add(rightArmMesh);
                
                if (isRestricted) {
                    leftArm.rotation.z = 0.8;
                    rightArmGroup.rotation.z = -0.8;
                }
                
                npcGroup.add(leftArm);
                npcGroup.add(rightArmGroup);

                // Legs
                const legGeom = new THREE.BoxGeometry(0.15, 0.7, 0.15);
                const leftLeg = new THREE.Mesh(legGeom, pantsMat);
                leftLeg.position.set(0.1, 0.35, 0);
                npcGroup.add(leftLeg);

                const rightLeg = new THREE.Mesh(legGeom, pantsMat);
                rightLeg.position.set(-0.1, 0.35, 0);
                npcGroup.add(rightLeg);

                // Invisible Hitbox for Raycasting
                const hitBoxGeom = new THREE.CylinderGeometry(0.4, 0.4, 1.8, 8);
                const hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
                const hitBox = new THREE.Mesh(hitBoxGeom, hitBoxMat);
                hitBox.position.y = 0.9;
                
                hitBox.userData = { 
                    hotspot: hs, 
                    labelId: "label-" + hs.id,
                    parentGroup: npcGroup,
                    rightArm: rightArmGroup,
                    isNPC: true,
                    isRestricted: isRestricted
                };
                npcGroup.add(hitBox);

                // Make sure NPC faces forward initially (towards +Z, standard in Threejs)
                npcGroup.lookAt(0, 0, 1000);

                scene.add(npcGroup);
                hotspotMeshes.push(hitBox);

                // Create Floating Speech Bubble
                const labelContainer = document.getElementById("floating-labels");
                const labelDiv = document.createElement("div");
                labelDiv.className = "floating-label";
                if (isRestricted) {
                    labelDiv.classList.add("restricted");
                }
                labelDiv.id = hitBox.userData.labelId;
                labelDiv.textContent = hs.title || "NPC";
                labelContainer.appendChild(labelDiv);
            }

            window.sendDataToReact = () => {
                window.parent.postMessage(
                    {
                        type: "SAVE_HOTSPOTS",
                        hotspots: hotspotsData,
                    },
                    "*",
                );
            };

            function animate() {
                requestAnimationFrame(animate);
                
                if (teleportTargetControls && teleportTargetCamera) {
                    teleportProgress += TELEPORT_SPEED;
                    if (teleportProgress >= 1) {
                        controls.target.copy(teleportTargetControls);
                        camera.position.copy(teleportTargetCamera);
                        teleportTargetControls = null;
                        teleportTargetCamera = null;
                    } else {
                        const t = teleportProgress;
                        const ease = 1 - Math.pow(1 - t, 3);
                        controls.target.lerpVectors(teleportStartControls, teleportTargetControls, ease);
                        camera.position.lerpVectors(teleportStartCamera, teleportTargetCamera, ease);
                    }
                }
                
                // Process WASD movement
                const isFirstPerson = camera.position.distanceTo(controls.target) < 0.5;
                
                if (keys.w || keys.a || keys.s || keys.d) {
                    const moveSpeed = 0.15;
                    const forward = new THREE.Vector3().subVectors(controls.target, camera.position);
                    if (isFirstPerson) forward.y = 0; // Keep movement purely horizontal in first-person
                    forward.normalize();
                    const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
                    const moveVector = new THREE.Vector3();
                    
                    if (keys.w) moveVector.add(forward.clone().multiplyScalar(moveSpeed));
                    if (keys.s) moveVector.add(forward.clone().multiplyScalar(-moveSpeed));
                    if (keys.a) moveVector.add(right.clone().multiplyScalar(-moveSpeed));
                    if (keys.d) moveVector.add(right.clone().multiplyScalar(moveSpeed));
                    
                    camera.position.add(moveVector);
                    controls.target.add(moveVector);
                }

                // Gravity & Stair Climbing (only active in first-person walking mode)
                if (isFirstPerson && model) {
                    const downVector = new THREE.Vector3(0, -1, 0);
                    const origin = camera.position.clone();
                    origin.y += 1.0; // Cast from slightly above eye level
                    
                    // We need a temporary raycaster for gravity so we don't break hotspot hovering
                    const gravityRaycaster = new THREE.Raycaster(origin, downVector);
                    const floorHits = gravityRaycaster.intersectObject(model, true);

                    // Filter out ceilings or stairs above us
                    const validHit = floorHits.find(hit => hit.point.y < camera.position.y + 0.5);

                    if (validHit) {
                        const floorY = validHit.point.y;
                        const targetY = floorY + 1.6; // Eye level
                        const diff = targetY - camera.position.y;
                        
                        let yChange = 0;
                        if (diff > 0 && diff < 2.5) {
                            // Going up stairs
                            yChange = diff * 0.15;
                        } else if (diff < 0) {
                            if (diff > -2.5) {
                                // Going down stairs
                                yChange = diff * 0.15;
                            } else {
                                // Free-falling off a ledge
                                yChange = -0.15;
                            }
                        }
                        
                        camera.position.y += yChange;
                        controls.target.y += yChange;
                    }
                }
                
                controls.update();
                
                const time = Date.now() * 0.005;
                hotspotMeshes.forEach((h) => {
                    const group = h.userData.parentGroup;
                    if (group && h.userData.isNPC) {
                        const dist = camera.position.distanceTo(group.position);
                        if (dist < 4.0) {
                            // Close enough to wave!
                            if (!h.userData.isRestricted) {
                                // Since arm is at -X, a negative Z rotation moves it outwards, preventing clipping with the head
                                h.userData.rightArm.rotation.z = -2.0 + Math.sin(time * 1.5) * 0.4; 
                                h.userData.rightArm.rotation.x = Math.sin(time) * 0.2;
                            }
                            
                            // Look at camera
                            const targetPos = camera.position.clone();
                            targetPos.y = group.position.y;
                            group.lookAt(targetPos);
                        } else {
                            // Idle
                            if (!h.userData.isRestricted) {
                                h.userData.rightArm.rotation.z = 0;
                                h.userData.rightArm.rotation.x = 0;
                            }
                            
                            // Gently face the camera even from afar so face is visible
                            const targetPos = camera.position.clone();
                            targetPos.y = group.position.y;
                            group.lookAt(targetPos);
                        }

                        // 3D to 2D projection for speech bubble
                        const pos = group.position.clone();
                        pos.y += 2.0; // Float above head
                        pos.project(camera);
                        
                        const labelDiv = document.getElementById(h.userData.labelId);
                        if (labelDiv) {
                            if (pos.z < 1) { // In front of camera
                                labelDiv.style.display = "block";
                                labelDiv.style.left = (pos.x * 0.5 + 0.5) * window.innerWidth + "px";
                                labelDiv.style.top = (-(pos.y * 0.5) + 0.5) * window.innerHeight + "px";
                                
                                const title = h.userData.hotspot.title || "NPC";
                                const desc = h.userData.hotspot.desc || "";
                                
                                if (dist < 4.0) {
                                     labelDiv.innerHTML = title + (desc ? "<br><span style='font-size:12px;font-weight:normal;'>" + desc + "</span>" : "");
                                } else {
                                     labelDiv.innerHTML = title;
                                }
                            } else {
                                labelDiv.style.display = "none";
                            }
                        }
                    }
                });
                
                renderer.render(scene, camera);
            }

            window.addEventListener("resize", () => {
                if (!camera) return;
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        </script>
    </body>
</html>
