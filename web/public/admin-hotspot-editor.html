                    },
                    "*",
                );
            };

            function animate() {
                requestAnimationFrame(animate);
                
                if (teleportTargetControls && teleportTargetCamera) {
                    teleportProgress += TELEPORT_SPEED;
                    if (teleportProgress >= 1) {
                        controls.target.copy(teleportTargetControls);
                        camera.position.copy(teleportTargetCamera);
                        teleportTargetControls = null;
                        teleportTargetCamera = null;
                    } else {
                        const t = teleportProgress;
                        const ease = 1 - Math.pow(1 - t, 3);
                        controls.target.lerpVectors(teleportStartControls, teleportTargetControls, ease);
                        camera.position.lerpVectors(teleportStartCamera, teleportTargetCamera, ease);
                    }
                }
                
                // Process WASD movement
                const isFirstPerson = camera.position.distanceTo(controls.target) < 0.5;
                
                if (keys.w || keys.a || keys.s || keys.d) {
                    const moveSpeed = 0.15;
                    const forward = new THREE.Vector3().subVectors(controls.target, camera.position);
                    if (isFirstPerson) forward.y = 0; // Keep movement purely horizontal in first-person
                    forward.normalize();
                    const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
                    const moveVector = new THREE.Vector3();
                    
                    if (keys.w) moveVector.add(forward.clone().multiplyScalar(moveSpeed));
                    if (keys.s) moveVector.add(forward.clone().multiplyScalar(-moveSpeed));
                    if (keys.a) moveVector.add(right.clone().multiplyScalar(-moveSpeed));
                    if (keys.d) moveVector.add(right.clone().multiplyScalar(moveSpeed));
                    
                    camera.position.add(moveVector);
                    controls.target.add(moveVector);
                }

                // Gravity & Stair Climbing (only active in first-person walking mode)
                if (isFirstPerson && model) {
                    const downVector = new THREE.Vector3(0, -1, 0);
                    const origin = camera.position.clone();
                    origin.y += 1.0; // Cast from slightly above eye level
                    
                    // We need a temporary raycaster for gravity so we don't break hotspot hovering
                    const gravityRaycaster = new THREE.Raycaster(origin, downVector);
                    const floorHits = gravityRaycaster.intersectObject(model, true);

                    // Filter out ceilings or stairs above us
                    const validHit = floorHits.find(hit => hit.point.y < camera.position.y + 0.5);

                    if (validHit) {
                        const floorY = validHit.point.y;
                        const targetY = floorY + 1.6; // Eye level
                        const diff = targetY - camera.position.y;
                        
                        let yChange = 0;
                        if (diff > 0 && diff < 2.5) {
                            // Going up stairs
                            yChange = diff * 0.15;
                        } else if (diff < 0) {
                            if (diff > -2.5) {
                                // Going down stairs
                                yChange = diff * 0.15;
                            } else {
                                // Free-falling off a ledge
                                yChange = -0.15;
                            }
                        }
                        
                        camera.position.y += yChange;
                        controls.target.y += yChange;
                    }
                }
                
                controls.update();
                
                const npcTime = performance.now() * 0.001;
                hotspotMeshes.forEach((h) => {
                    const group = h.userData.parentGroup;
                    if (!group || !h.userData.isNPC) return;

                    const dist = camera.position.distanceTo(group.position);

                    // "Close enough" state, shared by the wave and the bubble.
                    // Hysteresis (open 4.5m / close 5.0m) keeps it from
                    // flickering while you drift along the threshold.
                    const bubbleState = (h.userData.bubbleState ??= {
                        open: false,
                    });
                    bubbleState.open = bubbleState.open
                        ? dist < 5.0
                        : dist < 4.5;
                    const near = bubbleState.open;

                    // Turn the body toward the viewer: quickly when close,
                    // lazily when far, so it never snaps between frames.
                    const targetYaw = Math.atan2(
                        camera.position.x - group.position.x,
                        camera.position.z - group.position.z,
                    );
                    const yawDelta = Math.atan2(
                        Math.sin(targetYaw - group.rotation.y),
                        Math.cos(targetYaw - group.rotation.y),
                    );
                    group.rotation.y += yawDelta * (near ? 0.18 : 0.045);

                    h.userData.update?.(
                        npcTime,
                        near,
                        editingHotspotId === h.userData.hotspot.id,
                    );

                    // Nameplate above the head — the name is always shown.
                    const pos = group.position.clone();
                    pos.y += h.userData.labelHeight ?? 1.8;
                    pos.project(camera);

                    const labelDiv = document.getElementById(
                        h.userData.labelId,
                    );
                    const bubbleDiv = document.getElementById(
                        h.userData.bubbleId,
                    );
                    if (!labelDiv) return;

                    if (pos.z > 1) {
                        labelDiv.style.display = "none";
                        bubbleDiv?.classList.remove("show");
                        return;
                    }

                    const screenX = (pos.x * 0.5 + 0.5) * window.innerWidth;
                    const screenY = (-pos.y * 0.5 + 0.5) * window.innerHeight;

                    labelDiv.style.display = "block";
                    labelDiv.style.left = screenX + "px";
                    labelDiv.style.top = screenY + "px";

                    const title = h.userData.hotspot.title || "NPC";
                    const html =
                        '<span class="npc-dot"></span>' + escapeHtml(title);

                    // Only touch the DOM when the content really changes.
                    if (labelDiv._lastHtml !== html) {
                        labelDiv.innerHTML = html;
                        labelDiv._lastHtml = html;
                    }

                    // Speech bubble: the description pops out only when the
                    // camera is close, and tucks away again when you leave.
                    if (!bubbleDiv) return;

                    const desc = (h.userData.hotspot.desc || "").trim();

                    if (near && desc) {
                        bubbleDiv.style.left = screenX + "px";
                        bubbleDiv.style.top = screenY + "px";
                        if (bubbleDiv._lastHtml !== desc) {
                            bubbleDiv.innerHTML = escapeHtml(desc);
                            bubbleDiv._lastHtml = desc;
                        }
                        bubbleDiv.classList.add("show");
                    } else {
                        bubbleDiv.classList.remove("show");
                    }
                });
                
                // Animate and project 3D Virtual Tour Anchors
                const anchorTime = Date.now() * 0.003;
                anchorMeshes.forEach((hitMesh) => {
                    const anchor = hitMesh.userData.anchor;
                    const group = hitMesh.userData.parentGroup;
                    const ringMesh = hitMesh.userData.ringMesh;
                    const torusMesh = hitMesh.userData.torusMesh;
                    const labelDiv = document.getElementById(hitMesh.userData.labelId);

                    if (torusMesh) {
                        torusMesh.rotation.z = anchorTime * 0.8;
                    }
                    if (ringMesh && anchor.isCurrent) {
                        const s = 1.0 + Math.sin(anchorTime * 3.5) * 0.12;
                        ringMesh.scale.set(s, s, s);
                    }

                    if (group && labelDiv && camera) {
                        const dist = camera.position.distanceTo(group.position);
                        const pos = group.position.clone();
                        pos.y += 0.65; // Position label right above the beacon head
                        pos.project(camera);

                        if (pos.z < 1) { // In front of camera
                            labelDiv.style.display = "block";
                            labelDiv.style.left = (pos.x * 0.5 + 0.5) * window.innerWidth + "px";
                            labelDiv.style.top = (-(pos.y * 0.5) + 0.5) * window.innerHeight + "px";
                            if (dist > 40) {
                                labelDiv.style.opacity = Math.max(0, 1 - (dist - 40) / 20);
                            } else {
                                labelDiv.style.opacity = "1";
                            }
                        } else {
                            labelDiv.style.display = "none";
                        }
                    }
                });
                
                renderer.render(scene, camera);
            }

            window.addEventListener("resize", () => {
                if (!camera) return;
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        </script>
    </body>
</html>
