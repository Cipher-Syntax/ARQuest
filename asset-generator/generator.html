<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ARQuest Asset Generator</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f0f4f8;
        }

        canvas {
            margin: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            width: 150px;
            height: 150px;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
        }

        h1 {
            color: #0f172a;
        }
    </style>
</head>

<body>

<h1>Generating ARQuest Assets...</h1>
<p>Your browser should automatically download PNG files. Check your Downloads folder!</p>

<div class="grid" id="canvas-container"></div>

<script>

function drawAndDownload(filename, size, bgColor, imageSrc) {

    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;

    const ctx = canvas.getContext('2d');

    // Draw background if needed
    if (bgColor) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, size, size);
    }

    const img = new Image();

    img.onload = function () {

        const logoSize = size * 0.7;

        ctx.drawImage(
            img,
            (size - logoSize) / 2,
            (size - logoSize) / 2,
            logoSize,
            logoSize
        );

        document.getElementById('canvas-container').appendChild(canvas);

        // Download automatically
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
    };

    img.src = imageSrc;
}


// Generate assets using your logo image

drawAndDownload('icon.png', 1024, '#ffffff', 'ARQuest_Logo.png');

drawAndDownload('splash-icon.png', 1024, null, 'ARQuest_Logo.png');

drawAndDownload('android-icon-foreground.png', 1080, null, 'ARQuest_Logo.png');

drawAndDownload('android-icon-background.png', 1080, '#ffffff', 'ARQuest_Logo.png');

drawAndDownload('android-icon-monochrome.png', 1080, null, 'ARQuest_Logo.png');

drawAndDownload('favicon.png', 48, '#ffffff', 'ARQuest_Logo.png');

</script>

</body>
</html>
